genaiAppId: growth-command-center-2
name: Growth Command Center
contents:
  schemaVersion: 1
  kind: genai-app
  workbookId: growth-command-data-3
  prompt: |-
    Build a polished founder-focused Growth Command Center to grow this SaaS business, prioritizing existing-account expansion and retention while showing new customer growth. Use only this workbook. Sections: overview KPI cards (Total MRR, Total ARR, Recurring Revenue Accounts, Average Revenue per Account), monthly MRR trend, revenue movement drivers, searchable account workspace, saved follow-ups. Revenue data ends September 2025: default selected month 2025-09-01; trend October 2024 through September 2025. Clearly label historical snapshot and use no today-relative revenue windows. All revenue KPI totals must filter to exactly selected month, never sum snapshots across months. Use server-side summary columns and grouping for all KPIs/charts/breakdowns, no client-side row summing or counts; query monthly summary for trend, selected-month movement totals by Movement Type for drivers. Show signed losses correctly. Only compute period growth using server-returned monthly totals and safe division; avoid unsupported metrics. Account list MUST come from accounts table (verified 3000 rows = 3000 distinct accounts), one row per account, never from snapshots or events. Include search and filters by Account Status, Current Plan, Region, Account Owner and follow-up Priority/status. Show account owner, plan and current lifecycle status. Clicking an account opens a detail panel with read-only account facts, selected-month revenue facts filtered by Account ID, feature adoption records and adoption summary filtered by Account ID, and an editable follow-up form saving Next Step, Follow-up Date, Follow-up Status and Priority to linked followups using Account ID. Blank follow-up status displays Not started without changing saved source facts. Support actionable next-step workspace by priority and date and Done toggle with persisted writes and feedback. Account owner is real source attribute, not editable follow-up assignee. Do not invent renewal dates, risk scores, likelihoods or recommendations based on nonexistent data. Allow user-chosen priority, clearly distinguished from observed facts. Feature adoption pair counts are not distinct customers and MAUs must not be summed across features. Show adoption as adoption not proof of expansion potential. Add a short founder playbook as static guidance: review contraction/churn, investigate adoption gaps, assign next steps; do not present it as generated factual diagnosis. Modern restrained visual style, clean responsive layout, readable currency, subtle teal accents, meaningful signed movement colors. Empty/error/loading states and clear save feedback. This is a new app; create the actual UI now.

    The sections, top to bottom, as sketched for the user (name each one's component after it): Revenue and paying accounts, Monthly recurring revenue, What drives growth, Accounts to grow and retain, Next steps and follow-ups.
