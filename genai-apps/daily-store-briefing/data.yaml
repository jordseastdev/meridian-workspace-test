workbookId: retail-daily-briefing-data
name: Retail Daily Briefing Data
description: Data tables backing the store managers' daily briefing GenAI App.
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders
      name: Recent orders
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - RETAIL
          - ORDERS
      columns:
        - id: order_id
          name: Order ID
        - id: order_date
          name: Order Date
        - id: product_id
          name: Product ID
        - id: store_id
          name: Store ID
        - id: quantity
          name: Quantity
        - id: revenue
          name: Revenue
        - id: status
          name: Status
        - id: channel
          name: Channel
      sort:
        - columnId: order_date
          direction: descending
      limit: 500
    - id: order_followups
      name: Order follow-up flags
      kind: sheet
      inputMode: edit
      source:
        kind: linked
        from: orders
        connectionId: default
      columns:
        - id: order_id
          name: Order ID
          key: order_id
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: store_id
          name: Store ID
          formula: "[Store ID]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: follow_up
          name: Follow-up
          type: checkbox
        - id: note
          name: Note
          type: text
          multiline: true
    - id: top_products
      name: Top products by recent revenue
      kind: table
      source:
        kind: table
        elementId: orders
      columns:
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
        - id: quantity
          name: Units
          formula: Sum([Quantity])
      groupings:
        - id: by_product
          groupBy:
            - product_id
          calculations:
            - revenue
            - quantity
          sort:
            - columnId: revenue
              direction: descending
      limit: 10
    - id: revenue_trend
      name: Revenue trend
      kind: table
      source:
        kind: table
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
      groupings:
        - id: by_day
          groupBy:
            - order_date
          calculations:
            - revenue
          sort:
            - columnId: order_date
              direction: ascending
      sort:
        - columnId: order_date
          direction: descending
      limit: 500
  pages:
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders
        - order_followups
        - top_products
        - revenue_trend
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="order_followups" gridColumn="1 / 25" gridRow="13 / 25"/>
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="25 / 37"/>
      <Element elementId="revenue_trend" gridColumn="1 / 25" gridRow="37 / 49"/>
    </Page>
