workbookId: account-action-center
name: Account Action Center Data
description: Account-grain revenue and adoption signals with editable follow-up fields for the interactive account screen.
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account Signals
      kind: table
      source:
        kind: data-model
        dataModelId: revenue-action-model
        elementId: accounts
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: plan
          name: Plan
          formula: "[Plan]"
        - id: mrr
          name: Active MRR
          formula: "[Active MRR]"
        - id: renewal
          name: First Renewal
          formula: "[First Renewal]"
        - id: past_due
          name: Past Due Balance
          formula: "[Past Due Balance]"
        - id: adopted
          name: Adopted Features
          formula: "[Adopted Features]"
        - id: features
          name: Tracked Features
          formula: "[Tracked Features]"
        - id: last_used
          name: Last Feature Use
          formula: "[Last Feature Use]"
        - id: pipeline
          name: Open Pipeline
          formula: "[Open Pipeline]"
        - id: lane
          name: Action Lane
          formula: "[Action Lane]"
      visibleAsSource: true
    - id: account_work
      name: Account Follow-up
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: account_base
        connectionId: default
      columns:
        - id: account_id
          name: Account ID
          key: account_id
        - id: next_step
          name: Next Step
          type: text
          multiline: true
        - id: follow_up_date
          name: Follow-up Date
          type: date
        - id: follow_up_status
          name: Follow-up Status
          type: text
          values:
            - Not started
            - In progress
            - Done
    - id: account_list
      name: Account Action List
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account
          name: Account
          formula: "[Account]"
        - id: lane
          name: Action Lane
          formula: "[Action Lane]"
        - id: mrr
          name: Active MRR
          formula: "[Active MRR]"
        - id: past_due
          name: Past Due Balance
          formula: "[Past Due Balance]"
        - id: renewal
          name: First Renewal
          formula: "[First Renewal]"
        - id: owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: region
          name: Region
          formula: "[Region]"
      visibleAsSource: true
      sort:
        - columnId: mrr
          direction: descending
      limit: 10
  pages:
    - id: accounts
      name: Accounts
      elements:
        - account_base
        - account_work
        - account_list
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="accounts">
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="account_work" gridColumn="1 / 25" gridRow="13 / 25"/>
      <Element elementId="account_list" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
