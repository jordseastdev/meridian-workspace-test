workbookId: saas-portfolio-cockpit
name: SaaS Portfolio Cockpit Data
description: Account-grain source table for the SaaS portfolio GenAI app.
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_features
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid_invoices
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: unpaid_invoices
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
        - id: last_feature_use
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
        - id: employees
          name: Employee Count
          formula: "[Employee Count]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: churn_reason
          name: Churn Reason
          formula: "[Churn Reason]"
      visibleAsSource: true
    - id: account_work
      name: Account follow-up
      kind: sheet
      inputMode: edit
      source:
        kind: linked
        from: accounts
        connectionId: default
      columns:
        - id: account_id
          name: Account ID
          key: account_id
        - id: next_step
          name: Next Step
          type: text
          multiline: true
        - id: follow_up_date
          name: Follow-up Date
          type: date
        - id: owner
          name: Owner
          type: text
    - id: notes
      name: Account notes history
      kind: sheet
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: note_id
          name: Note ID
          type: text
          default:
            kind: id
            prefix: NOTE-
          required: true
        - id: account_id
          name: Account ID
          type: text
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
          required: true
        - id: created_by
          name: Created By
          type: text
          default:
            kind: user
          readOnly: true
        - id: created_at
          name: Created At
          type: datetime
          default:
            kind: now
          readOnly: true
  pages:
    - id: data
      name: Account Data
      elements:
        - accounts
        - account_work
        - notes
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="account_work" gridColumn="1 / 25" gridRow="13 / 25"/>
      <Element elementId="notes" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
