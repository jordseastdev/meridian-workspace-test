workbookId: qa-iterate-retail-data
name: QA Iterate Retail Data
description: Supporting grouped revenue and profit data for the QA Iterate Retail GenAI App.
folderId: qa
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: category_totals
      name: Revenue and profit by product category
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: gross_profit
          name: Gross Profit
          formula: Sum([Profit])
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_category
          groupBy:
            - category
          calculations:
            - revenue
            - gross_profit
      sort:
        - columnId: revenue
          direction: descending
    - id: monthly_totals
      name: Monthly revenue and gross profit
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: month
          name: Month
          formula: "[Order Month]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: gross_profit
          name: Gross Profit
          formula: Sum([Profit])
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_month
          groupBy:
            - month
          calculations:
            - revenue
            - gross_profit
      sort:
        - columnId: month
          direction: ascending
  pages:
    - id: data
      name: Data
      elements:
        - category_totals
        - monthly_totals
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="category_totals" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="monthly_totals" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
