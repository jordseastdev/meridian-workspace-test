workbookId: rep-visits-accounts
name: Rep Visits & Accounts
description: Account list and visit log data for a phone-first rep screen.
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Accounts
      kind: table
      source:
        kind: data-model
        dataModelId: revenue-action-model
        elementId: accounts
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: plan
          name: Plan
          formula: "[Plan]"
        - id: mrr
          name: Active MRR
          formula: "[Active MRR]"
        - id: seats
          name: Active Seats
          formula: "[Active Seats]"
        - id: renewal
          name: First Renewal
          formula: "[First Renewal]"
        - id: past_due
          name: Past Due Balance
          formula: "[Past Due Balance]"
        - id: lane
          name: Action Lane
          formula: "[Action Lane]"
      limit: 5000
    - id: visits
      name: Visit Log
      kind: sheet
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: visit_id
          name: Visit ID
          type: text
          default:
            kind: id
            prefix: VIS-
          required: true
        - id: account_id
          name: Account ID
          type: text
          required: true
        - id: visit_date
          name: Visit Date
          type: date
          default:
            kind: today
          required: true
        - id: visit_type
          name: Visit Type
          type: text
          values:
            - In person
            - Phone
            - Video
          required: true
        - id: outcome
          name: Outcome
          type: text
          multiline: true
          required: true
        - id: next_step
          name: Next Step
          type: text
          multiline: true
        - id: created_by
          name: Created By
          type: text
          default:
            kind: user
          readOnly: true
        - id: created_at
          name: Created At
          type: datetime
          default:
            kind: now
          readOnly: true
  pages:
    - id: app_data
      name: App Data
      visibility: hidden
      elements:
        - accounts
        - visits
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="app_data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="visits" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
