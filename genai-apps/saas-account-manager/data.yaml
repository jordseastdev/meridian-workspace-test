workbookId: saas-account-management-data
name: SaaS Account Management Data
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: monthly_active_users
          name: Total Monthly Active Users
          formula: "[Total Monthly Active Users]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: paid_invoice_count
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
      sort:
        - columnId: account_name
          direction: ascending
    - id: account_work
      name: Account Management Updates
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: accounts
        connectionId: default
      columns:
        - id: account_id
          name: Account ID
          key: account_id
        - id: notes
          name: Account Management Notes
          type: text
          multiline: true
        - id: follow_up_date
          name: Follow-up Date
          type: date
  pages:
    - id: data
      name: Account Data
      elements:
        - accounts
        - account_work
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="account_work" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
