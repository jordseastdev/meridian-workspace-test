genaiAppId: saas-account-manager
name: SaaS Account Manager
contents:
  schemaVersion: 1
  kind: genai-app
  workbookId: saas-account-management-data
  prompt: "Build an interactive polished SaaS account-management screen using only this workbook. accounts contains 3000 rows, verified one row per unique account_id; account names are NOT unique. account_work is linked by account_id and persists notes and follow_up_date. Show searchable sortable paginated account table/cards with account name, region, industry, current plan, lifecycle status, account owner, CSM, signup date, last feature-use date, adopted feature count, Total Monthly Active Users, Total Billed, paid and unpaid invoice counts. Search by account name or ID; filters for region, status, current plan, account owner, CSM (including unassigned), and inclusive signup date default 2022-01-02 to 2025-09-28. Load all rows via appropriate pagination so searches and filters cover all 3000, not just first page. Show matching count. Select an account to open a detail panel containing these facts and an edit area for Account Management Notes and Follow-up Date. Persist edits ONLY to account_work using account_id key and supported linked-row update, preserving source read-only fields. Explicit Save and Cancel; dirty state, before/after review of pending changes, saving/error/success feedback; reload saved values after save and when selecting account. Protect against discarding unsaved edits accidentally. No notes history requested: notes are editable current account-management notes. Follow-up Date is user-entered follow-up, never label it renewal. Do not invent risk scores or renewal dates. Format Total Billed as currency including tax, counts as integers; explain Total Monthly Active Users is summed across features, not distinct people. Handle null dates and CSM gracefully. Keep exactly one list item per Account ID, and retain separate accounts even if names match. Responsive professional interface with filters, list, selected details. No invented data, charts or unnecessary metrics."
