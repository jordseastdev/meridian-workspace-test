workbookId: renewal-board-data
name: Renewal Board Data
description: Data source tables for the SaaS renewal board GenAI App.
tags:
  - genai-data
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Renewal accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas
        elementId: subscriptions
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account/Account Name]"
        - id: owner
          name: Owner
          formula: "[Account/Account Owner]"
        - id: renewal_date
          name: Renewal Date
          formula: "[First Renewal Date]"
        - id: current_mrr
          name: Current MRR
          formula: "[Current MRR]"
      filters:
        - id: active_only
          kind: formula
          formula: '[Status] = "Active"'
    - id: account_work
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: accounts
        connectionId: default
      columns:
        - id: account_id
          name: Account ID
          key: account_id
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: renewal_date
          name: Renewal Date
          formula: "[Renewal Date]"
        - id: current_mrr
          name: Current MRR
          formula: "[Current MRR]"
        - id: next_step
          name: Next Step
          type: text
          multiline: true
        - id: step_owner
          name: Next Step Owner
          type: text
  pages:
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
        - account_work
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="account_work" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
