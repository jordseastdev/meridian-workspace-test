workbookId: support-ticket-triage-14
name: Support Ticket Triage
description: Triage support tickets, assign owners, close resolved cases, and monitor ticket status and category.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_base
      name: Ticket source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: channel
          name: Channel
          formula: "[Contact Channel]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: response
          name: First Response Minutes
          formula: "[First Response Minutes]"
        - id: resolution
          name: Resolution Hours
          formula: "[Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[CSAT Score]"
    - id: ticket_workflow
      name: Ticket assignment and closure
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: ticket_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: category
          name: Category
          formula: "[Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: checkbox
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - opened_at
          - priority
          - assigned_to
    - id: open_count
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: open_tickets
      columns:
        - id: value
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      value:
        columnId: value
    - id: avg_response
      name: Median First Response
      kind: kpi-chart
      source:
        kind: table
        elementId: open_tickets
      columns:
        - id: value
          name: Median First Response (min)
          formula: Median([First Response Minutes])
          format:
            kind: number
            decimals: 0
      value:
        columnId: value
    - id: status_kpis
      name: Tickets by Status
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: status
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
    - id: category_chart
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      limit: 10
    - id: open_tickets
      name: Open Ticket Cards
      kind: table
      source:
        kind: table
        elementId: ticket_workflow
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: status
          name: Status
        - id: assigned_to
          name: Assigned To
        - id: closed
          name: Closed
      filters:
        - id: still_open
          kind: formula
          formula: (IsNull([closed]) or [closed] = False) and [Status] != "Closed" and [Status] != "Solved"
      rowActions:
        - id: assign_open
          text: Assign
          appearance: outline
          icon: assign
          ask:
            label: Assign to
            placeholder: Name or email
            required: true
          effects:
            - effect: update-rows
              tableElementId: ticket_workflow
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                assigned_to:
                  type: answer
        - id: close_open
          text: Close
          appearance: filled
          icon: check
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_workflow
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                closed:
                  type: constant
                  value: true
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - opened_at
          - priority
          - assigned_to
    - id: ticket_detail
      name: Ticket Drawer
      kind: table
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: channel
          name: Channel
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: status
          name: Status
        - id: response
          name: First Response Minutes
        - id: resolution
          name: Resolution Hours
        - id: csat
          name: CSAT Score
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Assistant
      appearance: filled
      icon: sparkles
    - id: support_assistant
      kind: agent
      agentId: support-ticket-assistant
      placeholder: Ask about ticket trends or triage priorities…
      height: 600
  pages:
    - id: triage
      name: Triage
      elements:
        - open_count
        - avg_response
        - status_kpis
        - category_chart
        - open_tickets
        - ask_button
    - id: workflow_data
      name: Workflow data
      visibility: hidden
      elements:
        - ticket_workflow
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="open_count" gridColumn="1 / 13" gridRow="1 / 5"/>
      <Element elementId="avg_response" gridColumn="13 / 25" gridRow="1 / 5"/>
      <Element elementId="status_kpis" gridColumn="1 / 13" gridRow="5 / 14"/>
      <Element elementId="category_chart" gridColumn="13 / 25" gridRow="5 / 14"/>
      <Element elementId="open_tickets" gridColumn="1 / 25" gridRow="14 / 26"/>
      <Element elementId="ask_button" gridColumn="1 / 5" gridRow="26 / 28"/>
      <Element elementId="ticket_base" gridColumn="1 / 25" gridRow="28 / 40"/>
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="40 / 52"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="workflow_data">
      <Element elementId="ticket_workflow" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="support_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Support Ticket Assistant
      size: large
      elements:
        - support_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
