workbookId: support-ticket-triage
name: Support Ticket Triage
description: Triage open customer support tickets and monitor ticket volume and resolution trends.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets_base
      name: Support Tickets Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: channel
          name: Contact Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: status
          name: Status
          formula: "[Support Tickets/Ticket Status]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat_score
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
    - id: f_dates
      kind: control
      controlId: opened_dates
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: tickets_base
          columnId: opened_at
    - id: f_priority
      kind: control
      controlId: priority_filter
      controlType: list
      label: Priority
      mode: multiple
      filters:
        - source:
            kind: table
            elementId: tickets_base
          columnId: priority
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: ask_assistant
      text: Ask Support Triage Assistant
      appearance: filled
      icon: sparkles
    - id: open_tickets
      name: Open Tickets
      kind: sheet
      inputMode: edit
      source:
        kind: linked
        from: tickets_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: category
          name: Category
          formula: "[Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: assigned_by
          name: Assigned By
          type: text
        - id: closed_by
          name: Closed By
          type: text
      rowActions:
        - id: assign_to_me
          text: Assign to me
          appearance: outline
          icon: assign
          showWhen: '[Status] = "Open"'
          effects:
            - effect: update-rows
              tableElementId: open_tickets
              whichRows:
                type: selected
              values:
                assigned_by:
                  type: user
                  field: email
                agent:
                  type: user
                  field: email
            - effect: notify
              message: Assigned to you
              level: success
        - id: close_ticket
          text: Close
          appearance: filled
          icon: check
          showWhen: '[Status] = "Open"'
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: open_tickets
              whichRows:
                type: selected
              values:
                status:
                  type: constant
                  value: Closed
                closed_by:
                  type: user
                  field: email
            - effect: notify
              message: Ticket closed
              level: success
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - priority
          - agent
          - opened_at
    - id: by_category
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: tickets
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: tickets
          direction: descending
      yAxis:
        columnIds:
          - tickets
      color:
        by: single
        value: "#4661c9"
    - id: by_priority
      name: Tickets by Priority
      kind: bar-chart
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: tickets
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: tickets
          direction: descending
      yAxis:
        columnIds:
          - tickets
      color:
        by: single
        value: "#4661c9"
    - id: resolution_trend
      name: Average Resolution Hours Over Time
      kind: line-chart
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Opened At])
        - id: avg_resolution_hours
          name: Average Resolution Hours
          formula: Avg([Resolution Hours])
          format:
            kind: number
            decimals: 1
      filters:
        - id: resolved_only
          kind: formula
          formula: IsNotNull([Resolution Hours])
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - avg_resolution_hours
    - id: triage_agent
      kind: agent
      agentId: support-triage-assistant
      placeholder: Ask about ticket triage, backlog, or resolution trends…
      height: 520
  pages:
    - id: triage
      name: Triage
      elements:
        - f_dates
        - f_priority
        - ask_button
        - open_tickets
    - id: analytics
      name: Analytics
      elements:
        - f_dates
        - f_priority
        - by_category
        - by_priority
        - resolution_trend
    - id: assistant_data
      name: Assistant Data
      visibility: hidden
      elements:
        - tickets_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="f_dates" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_priority" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="open_tickets" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="f_dates" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_priority" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="by_category" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="by_priority" gridColumn="13 / 25" gridRow="3 / 12"/>
      <Element elementId="resolution_trend" gridColumn="1 / 25" gridRow="12 / 21"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_data">
      <Element elementId="tickets_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ask_assistant">
      <Element elementId="triage_agent" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ask_assistant
      kind: drawer
      title: Support Triage Assistant
      size: large
      elements:
        - triage_agent
  settings:
    theme:
      preset: daylight
      palette: meridian
