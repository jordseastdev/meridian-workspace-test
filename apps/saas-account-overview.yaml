workbookId: saas-account-overview
name: SaaS Account Overview
description: Account-level overview of SaaS customer lifecycle, billing, and feature adoption.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: SaaS Accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: domain
          name: Domain
          formula: "[Domain]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: employee_count
          name: Employee Count
          formula: "[Employee Count]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: acquisition_source
          name: Acquisition Source
          formula: "[Acquisition Source]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
      visibleAsSource: true
    - id: signup_filter
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup Date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: signup_date
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      selectionMode: multiple
      source:
        kind: source
        source:
          kind: table
          elementId: accounts
        columnId: region
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: region
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Account Status
      selectionMode: multiple
      source:
        kind: source
        source:
          kind: table
          elementId: accounts
        columnId: status
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: v
    - id: kpi_billed
      name: Total Billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: v
    - id: kpi_adoption
      name: Adopted Feature Rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: accounts_by_region
      name: Accounts by Region
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: n
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: region
        sort:
          by: n
          direction: descending
      yAxis:
        columnIds:
          - n
      color:
        by: single
        value: "#4661c9"
    - id: billed_by_plan
      name: Billed by Current Plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      xAxis:
        columnId: plan
        sort:
          by: billed
          direction: descending
      yAxis:
        columnIds:
          - billed
      color:
        by: single
        value: "#4661c9"
    - id: account_detail
      name: Account Detail
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
      limit: 100
    - id: plan_filter
      kind: control
      controlId: current_plan
      controlType: list
      label: Current Plan
      selectionMode: multiple
      source:
        kind: source
        source:
          kind: table
          elementId: accounts
        columnId: current_plan
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: current_plan
    - id: signups_by_month
      name: Signups by Month
      kind: line-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: month
          name: Signup Month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: "[Account Count]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - signups
      color:
        by: single
        value: "#4661c9"
  pages:
    - id: overview
      name: Overview
      elements:
        - signup_filter
        - region_filter
        - status_filter
        - plan_filter
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - accounts_by_region
        - billed_by_plan
        - signups_by_month
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="signup_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="region_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="plan_filter" gridColumn="19 / 25" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="accounts_by_region" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="billed_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="signups_by_month" gridColumn="1 / 25" gridRow="16 / 25"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
