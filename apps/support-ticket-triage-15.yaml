workbookId: support-ticket-triage-15
name: Support Ticket Triage
description: Triage open support tickets, track status and category, and ask an assistant for read-only guidance.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets_base
      name: Support tickets base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: channel
          name: Contact Channel
          formula: "[Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[First Response Minutes]"
        - id: resolution
          name: Resolution Hours
          formula: "[Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[CSAT Score]"
      visibleAsSource: true
    - id: f_opened
      kind: control
      controlId: opened_range
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: tickets_base
          columnId: opened_at
    - id: triage_records
      name: Ticket assignment and closure
      kind: input-table
      actions:
        - id: open_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      inputMode: edit
      source:
        kind: linked
        from: tickets_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: text
          values:
            - Closed
      rowActions:
        - id: assign
          text: Assign
          appearance: filled
          icon: assign
          showWhen: IsNull([assigned_to])
          ask:
            label: Assignee
            placeholder: Name or email
            required: true
          effects:
            - effect: update-rows
              tableElementId: triage_records
              whichRows:
                type: selected
              values:
                assigned_to:
                  type: answer
        - id: close
          text: Close
          appearance: outline
          icon: archive
          showWhen: IsNull([closed])
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: triage_records
              whichRows:
                type: selected
              values:
                closed:
                  type: constant
                  value: Closed
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - opened_at
          - agent
          - status
          - assigned_to
    - id: ticket_queue
      name: Open tickets
      kind: table
      actions:
        - id: select_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      source:
        kind: table
        elementId: triage_records
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Ticket Category
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: status
          name: Ticket Status
        - id: assigned_to
          name: Assigned To
        - id: closed
          name: Closed
      filters:
        - id: still_open
          kind: formula
          formula: IsNull([closed]) and [Ticket Status] != "Solved"
      rowActions:
        - id: assign_ticket
          text: Assign
          appearance: filled
          icon: assign
          showWhen: IsNull([assigned_to])
          ask:
            label: Assignee
            placeholder: Name or email
            required: true
          effects:
            - effect: update-rows
              tableElementId: triage_records
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                assigned_to:
                  type: answer
        - id: close_ticket
          text: Close
          appearance: outline
          icon: archive
          showWhen: IsNull([closed])
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: triage_records
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                closed:
                  type: constant
                  value: Closed
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - opened_at
          - agent
          - status
          - assigned_to
    - id: kpi_open
      name: Open ticket count
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: v
          name: Open tickets
          formula: CountDistinct([Ticket ID])
      value:
        columnId: v
    - id: kpi_pending
      name: Pending tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: v
          name: Pending tickets
          formula: CountIf([Ticket Status] = "Pending")
      value:
        columnId: v
    - id: kpi_solved
      name: Solved tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: v
          name: Solved tickets
          formula: CountIf([Ticket Status] = "Solved")
      value:
        columnId: v
    - id: category_chart
      name: Open tickets by category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: tickets
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: tickets
          direction: descending
      yAxis:
        columnIds:
          - tickets
      color:
        by: single
        value: "#0f766e"
    - id: ticket_detail
      name: Selected ticket
      kind: table
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: channel
          name: Contact Channel
        - id: category
          name: Ticket Category
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: status
          name: Ticket Status
        - id: first_response
          name: First Response Minutes
        - id: resolution
          name: Resolution Hours
        - id: csat
          name: CSAT Score
      filters:
        - id: chosen
          kind: formula
          formula: "[Ticket ID] = [selected_ticket]"
    - id: selected_ticket
      kind: control
      controlId: selected_ticket
      controlType: text
    - id: ask_button
      kind: button
      actions:
        - id: ask_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Triage Assistant
      appearance: filled
      icon: sparkles
    - id: assistant
      kind: agent
      agentId: support-triage-assistant
      placeholder: Ask about ticket trends or triage guidance
      height: 600
  pages:
    - id: overview
      name: Overview
      elements:
        - f_opened
        - ask_button
        - kpi_open
        - kpi_pending
        - kpi_solved
        - category_chart
        - ticket_queue
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_opened" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="7 / 11" gridRow="1 / 3"/>
      <Element elementId="kpi_open" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_pending" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_solved" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="category_chart" gridColumn="1 / 25" gridRow="7 / 16"/>
      <Element elementId="ticket_queue" gridColumn="1 / 25" gridRow="16 / 28"/>
      <Element elementId="tickets_base" gridColumn="1 / 25" gridRow="28 / 40"/>
      <Element elementId="triage_records" gridColumn="1 / 25" gridRow="40 / 52"/>
      <Element elementId="selected_ticket" gridColumn="1 / 7" gridRow="52 / 54"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_drawer">
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ticket_drawer
      kind: drawer
      title: Ticket details
      size: large
      elements:
        - ticket_detail
    - id: assistant_drawer
      kind: drawer
      title: Support Triage Assistant
      size: large
      elements:
        - assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
