workbookId: customer-orders-5
name: Customer Orders
description: Browse customers and open a drawer to review their order lines.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_base
      name: Customer base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer Name
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: loyalty_tier
          name: Loyalty Tier
          formula: "[Loyalty Tier]"
        - id: region
          name: Region
          formula: "[Customer Region]"
    - id: customer_list
      name: Customers
      description: Select a customer to open their order history.
      kind: table
      actions:
        - id: show_customer_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: customer_orders_drawer
      source:
        kind: table
        elementId: customer_base
      columns:
        - id: customer_id
          name: Customer ID
        - id: customer_name
          name: Customer Name
        - id: segment
          name: Segment
        - id: loyalty_tier
          name: Loyalty Tier
        - id: region
          name: Region
      sort:
        - columnId: customer_name
          direction: ascending
      limit: 500
    - id: selected_customer_control
      kind: control
      controlId: selected_customer
      controlType: text
      label: Selected customer
      value: ""
      required: false
    - id: orders_base
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
      filters:
        - id: customer_filter
          kind: formula
          formula: "[Customer ID] = [selected_customer]"
    - id: customer_orders
      name: Customer orders
      description: Order lines for the selected customer.
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_date
          name: Order Date
        - id: order_id
          name: Order ID
        - id: channel
          name: Channel
        - id: status
          name: Status
        - id: quantity
          name: Quantity
        - id: revenue
          name: Revenue
      sort:
        - columnId: order_date
          direction: descending
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
    - id: data
      name: Data
      visibility: hidden
      elements:
        - customer_base
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="selected_customer_control" gridColumn="1 / 7" gridRow="13 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="customer_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customer_orders_drawer">
      <Element elementId="customer_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
  overlays:
    - id: customer_orders_drawer
      kind: drawer
      title: Customer orders
      size: large
      elements:
        - customer_orders
  settings:
    theme:
      preset: daylight
      palette: meridian
