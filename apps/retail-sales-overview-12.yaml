workbookId: retail-sales-overview-12
name: Retail Sales Overview
description: Interactive overview of retail revenue, profitability, sales mix and order-line detail.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base
      name: Retail order lines base
      kind: table
      source:
        kind: data-model
        dataModelId: retail-obt
        elementId: order_lines
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: cost
          name: Cost
          formula: "[Cost]"
          format:
            kind: currency
            decimals: 2
        - id: profit
          name: Profit
          formula: "[Profit]"
          format:
            kind: currency
            decimals: 2
        - id: category
          name: Category
          formula: "[Products/Category]"
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date range
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: base
          columnId: order_date
    - id: channel_filter
      kind: control
      controlId: sales_channel
      controlType: list
      label: Channel
      filters:
        - source:
            kind: table
            elementId: base
          columnId: channel
    - id: status_filter
      kind: control
      controlId: order_status
      controlType: list
      label: Order status
      filters:
        - source:
            kind: table
            elementId: base
          columnId: status
    - id: kpi_revenue
      name: Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: kpi_profit
      name: Profit
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Total Profit
          formula: "[Total Profit]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: kpi_orders
      name: Order lines
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: v
    - id: kpi_margin
      name: Gross margin
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: monthly_trend
      name: Monthly revenue and profit
      kind: area-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: month
          name: Order Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: profit
          name: Profit
          formula: "[Total Profit]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
          - profit
    - id: channel_sales
      name: Revenue by channel
      kind: bar-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#0f766e"
    - id: category_sales
      name: Revenue by product category
      kind: bar-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#0f766e"
      limit: 10
    - id: detail
      name: Order line detail
      kind: table
      source:
        kind: table
        elementId: base
      columns:
        - id: order_date
          name: Order Date
        - id: order_id
          name: Order ID
        - id: channel
          name: Channel
        - id: status
          name: Status
        - id: category
          name: Category
        - id: quantity
          name: Quantity
        - id: revenue
          name: Revenue
        - id: profit
          name: Profit
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - channel_filter
        - status_filter
        - kpi_revenue
        - kpi_profit
        - kpi_orders
        - kpi_margin
        - monthly_trend
        - channel_sales
        - category_sales
        - detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_profit" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_orders" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_margin" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="category_sales" gridColumn="1 / 25" gridRow="16 / 25"/>
      <Element elementId="detail" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
