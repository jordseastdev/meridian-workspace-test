workbookId: discount-request-review-3
name: Discount Request Review
description: Managers review open discount requests, record an approval decision, and leave a note.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deal_base
      name: Discount request data
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      value: Pending
      filters:
        - source:
            kind: table
            elementId: deal_base
          columnId: status
    - id: deals
      name: Discount Requests
      kind: table
      source:
        kind: table
        elementId: deal_base
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
    - id: decision
      name: Decision Notes
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
          required: true
        - id: reviewer
          name: Reviewer
          type: text
          default:
            kind: user
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: datetime
          default:
            kind: now
          readOnly: true
  pages:
    - id: review
      name: Review Requests
      elements:
        - f_status
        - deals
        - decision
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deal_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="f_status" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="deals" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="decision" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deal_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
