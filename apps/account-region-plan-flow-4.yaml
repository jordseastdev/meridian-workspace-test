workbookId: account-region-plan-flow-4
name: "Account Flow: Region to Current Plan"
description: Explore account counts flowing from region into current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account Base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: Count()
      groupings:
        - id: region_plan
          groupBy:
            - region
            - current_plan
          calculations:
            - account_count
    - id: account_flow
      name: Accounts by Region → Current Plan
      kind: sankey-chart
      source:
        kind: table
        elementId: account_base
        groupingId: region_plan
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: accounts
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: overview
      name: Account Flow
      elements:
        - account_flow
    - id: data
      name: Data
      visibility: hidden
      elements:
        - account_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="account_flow" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
