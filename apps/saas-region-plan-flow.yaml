workbookId: saas-region-plan-flow
name: "Accounts: Region to Current Plan"
description: Shows account counts flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: region_to_plan
      name: Accounts by Region → Current Plan
      kind: sankey-chart
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: Count()
      value:
        columnId: accounts
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: overview
      name: Account Flow
      elements:
        - region_to_plan
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="region_to_plan" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
