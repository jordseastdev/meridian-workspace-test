workbookId: revenue-year-over-year-2
name: Revenue This Year vs Last Year
description: Monthly revenue comparison for the current year versus last year, with year-over-year KPIs.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: f_order_date
      kind: control
      controlId: order_date_range
      controlType: date-range
      label: Order date range
      value:
        start: 2024-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: orders_base
      name: Order revenue base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: completed
          kind: formula
          formula: '[Orders/Status] = "Completed"'
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
      filters:
        - id: current_year
          kind: formula
          formula: DatePart("year", [Order Date]) = DatePart("year", Today())
      value:
        columnId: revenue
      comparison:
        period: previous-period
        label: vs previous period
      trend:
        columnId: year
    - id: kpi_yoy
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
      filters:
        - id: current_year
          kind: formula
          formula: DatePart("year", [Order Date]) = DatePart("year", Today())
      value:
        columnId: revenue
      comparison:
        period: previous-period
        label: vs last year
    - id: monthly_revenue
      name: "Revenue by month: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DatePart("month", [Order Date])
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      filters:
        - id: two_years
          kind: formula
          formula: DatePart("year", [Order Date]) >= DatePart("year", Today()) - 1 and DatePart("year", [Order Date]) <= DatePart("year", Today())
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
      legend:
        position: bottom
  pages:
    - id: overview
      name: Revenue Overview
      elements:
        - f_order_date
        - kpi_revenue
        - kpi_yoy
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_order_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_yoy" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
