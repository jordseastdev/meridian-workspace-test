workbookId: saas-revenue-pulse
name: SaaS Revenue Pulse
description: A focused view of recurring revenue, account base, and monthly revenue movements.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base_mrr
      name: Monthly MRR
      kind: table
      source:
        kind: data-model
        dataModelId: saas-growth
        elementId: mrr_monthly
      columns:
        - id: month
          name: Month
        - id: account_id
          name: Account ID
        - id: plan_name
          name: Plan Name
        - id: mrr
          name: MRR
        - id: arr
          name: ARR
    - id: base_movements
      name: Movements
      kind: table
      source:
        kind: data-model
        dataModelId: saas-growth
        elementId: mrr_movements
      columns:
        - id: month
          name: Month
        - id: movement_type
          name: Movement Type
        - id: mrr_change
          name: MRR Change
    - id: f_month
      kind: control
      controlId: month_range
      controlType: date-range
      label: MRR Month
      value:
        start: 2024-10-01
        end: 2025-09-01
      filters:
        - source:
            kind: table
            elementId: base_mrr
          columnId: month
    - id: ask_btn
      kind: button
      actions:
        - id: open_analyst
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: analyst_drawer
      text: Ask Revenue Analyst
      appearance: filled
      icon: sparkles
    - id: kpi_mrr
      name: Latest MRR
      kind: kpi-chart
      source:
        kind: table
        elementId: base_mrr
      columns:
        - id: v
          name: MRR
          formula: "[Total MRR]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: kpi_arr
      name: Latest ARR
      kind: kpi-chart
      source:
        kind: table
        elementId: base_mrr
      columns:
        - id: v
          name: ARR
          formula: "[Total ARR]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: kpi_accounts
      name: Revenue Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: base_mrr
      columns:
        - id: v
          name: Accounts
          formula: "[Recurring Revenue Accounts]"
          format:
            kind: number
            decimals: 0
      value:
        columnId: v
    - id: mrr_trend
      name: Monthly MRR
      kind: line-chart
      source:
        kind: table
        elementId: base_mrr
      columns:
        - id: month
          name: Month
        - id: mrr
          name: MRR
          formula: "[Total MRR]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - mrr
    - id: movement_trend
      name: MRR Change by Type
      kind: bar-chart
      source:
        kind: table
        elementId: base_movements
      columns:
        - id: movement_type
          name: Movement Type
        - id: change
          name: MRR Change
          formula: Sum([MRR Change])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: movement_type
        sort:
          by: change
          direction: descending
      yAxis:
        columnIds:
          - change
      orientation: horizontal
    - id: plan_mix
      name: MRR by Plan
      kind: bar-chart
      source:
        kind: table
        elementId: base_mrr
      columns:
        - id: plan
          name: Plan Name
        - id: mrr
          name: MRR
          formula: Sum([MRR])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: plan
        sort:
          by: mrr
          direction: descending
      yAxis:
        columnIds:
          - mrr
      orientation: horizontal
    - id: analyst
      kind: agent
      agentId: saas-revenue-analyst
      placeholder: Ask about MRR trends, growth drivers, and plan mix.
  pages:
    - id: overview
      name: Revenue Pulse
      elements:
        - f_month
        - ask_btn
        - kpi_mrr
        - kpi_arr
        - kpi_accounts
        - mrr_trend
        - movement_trend
        - plan_mix
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base_mrr
        - base_movements
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_month" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ask_btn" gridColumn="7 / 11" gridRow="1 / 3"/>
      <Element elementId="kpi_mrr" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_arr" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_accounts" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="mrr_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="movement_trend" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="plan_mix" gridColumn="1 / 25" gridRow="16 / 25"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base_mrr" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="base_movements" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analyst_drawer">
      <Element elementId="analyst" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: analyst_drawer
      kind: drawer
      title: Revenue Analyst
      size: large
      elements:
        - analyst
  settings:
    theme:
      preset: daylight
      palette: ocean
