workbookId: saas-churn-dashboard-9
name: Churn Dashboard
description: Account-level views of churned, at-risk and healthy SaaS accounts.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: churned_table
      name: Churned accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_name
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: churn_reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: account_owner
          name: Owner
          formula: "[Account Owner]"
      sort:
        - columnId: churned_date
          direction: descending
      limit: 100
    - id: risk_table
      name: At-risk accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_name
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: unpaid_invoices
          name: Unpaid Invoices
          formula: "[Unpaid Invoice Count]"
        - id: adopted_rate
          name: Adopted Feature Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use
          name: Last Feature Use
          formula: "[Last Feature Use Date]"
        - id: csm
          name: CSM
          formula: "[CSM]"
      sort:
        - columnId: unpaid_invoices
          direction: descending
      limit: 100
    - id: healthy_table
      name: Healthy accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_name
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: paid_rate
          name: Paid Invoice Rate
          formula: SafeDivide([Paid Invoice Count], [Invoice Count])
          format:
            kind: percent
            decimals: 1
        - id: adopted_rate
          name: Adopted Feature Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use
          name: Last Feature Use
          formula: "[Last Feature Use Date]"
        - id: csm
          name: CSM
          formula: "[CSM]"
      limit: 100
  pages:
    - id: churned
      name: Churned Accounts
      elements:
        - churned_table
    - id: at_risk
      name: At-Risk Accounts
      elements:
        - risk_table
    - id: healthy
      name: Healthy Accounts
      elements:
        - healthy_table
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="churned">
      <Element elementId="churned_table" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="at_risk">
      <Element elementId="risk_table" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="healthy">
      <Element elementId="healthy_table" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
