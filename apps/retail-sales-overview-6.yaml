workbookId: retail-sales-overview-6
name: Retail Sales Overview
description: Sales performance overview and top product rankings using the certified Retail model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Order Lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: profit
          name: Profit
          formula: "[Profit]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: product_name
          name: Product Name
          formula: "[Product/Product Name]"
        - id: category
          name: Category
          formula: "[Product/Category]"
      filters:
        - id: completed
          kind: formula
          formula: '[Status] = "Completed"'
    - id: f_order_date
      kind: control
      controlId: order_date_filter
      controlType: date-range
      label: Order date
      value:
        start: 2024-09-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: kpi_revenue
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: revenue
    - id: kpi_orders
      name: Order Count
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: orders
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: orders
    - id: kpi_margin
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: margin
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: margin
    - id: sales_trend
      name: Monthly Revenue
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Order Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top Products by Revenue
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
    - id: product_table
      name: Product Performance
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: category
          name: Category
          formula: "[Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_product
          groupBy:
            - product
            - category
          calculations:
            - revenue
          sort:
            - columnId: revenue
              direction: descending
      limit: 10
  pages:
    - id: overview
      name: Overview
      elements:
        - f_order_date
        - kpi_revenue
        - kpi_orders
        - kpi_margin
        - sales_trend
        - channel_sales
    - id: products
      name: Products
      elements:
        - top_products
        - product_table
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_order_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_orders" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_margin" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="sales_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="products">
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="1 / 10"/>
      <Element elementId="product_table" gridColumn="1 / 25" gridRow="10 / 22"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
