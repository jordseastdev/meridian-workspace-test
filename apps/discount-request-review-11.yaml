workbookId: discount-request-review-11
name: Discount Request Review
description: Managers review open discount requests and record approval or rejection decisions with notes.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Discount Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deals/Deal ID]"
        - id: account
          name: Account
          formula: "[Deals/Account]"
        - id: owner
          name: Owner
          formula: "[Deals/Owner]"
        - id: region
          name: Region
          formula: "[Deals/Region]"
        - id: stage
          name: Stage
          formula: "[Deals/Stage]"
        - id: status
          name: Status
          formula: "[Deals/Status]"
        - id: list_amount
          name: List Amount
          formula: "[Deals/List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Deals/Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Deals/Age Days]"
      sort:
        - columnId: age_days
          direction: descending
      limit: 500
    - id: decisions_base
      name: Recorded Decisions
      kind: table
      source:
        kind: table
        elementId: review_form
      columns:
        - id: deal_id
          name: Deal ID
        - id: decision
          name: Decision
        - id: note
          name: Note
        - id: reviewer
          name: Reviewer
        - id: reviewed_at
          name: Reviewed At
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      value: Open
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: status
    - id: f_stage
      kind: control
      controlId: stage_filter
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: stage
    - id: queue
      name: Discount requests
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: list_amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
      sort:
        - columnId: age_days
          direction: descending
      limit: 500
    - id: review_form
      name: Decision notes
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
          required: true
        - id: reviewer
          name: Reviewer
          type: text
          default:
            kind: user
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: date
          default:
            kind: today
          readOnly: true
  pages:
    - id: review
      name: Review Queue
      elements:
        - f_status
        - f_stage
        - queue
        - review_form
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deals_base
        - decisions_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="f_status" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_stage" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="queue" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="review_form" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="decisions_base" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
