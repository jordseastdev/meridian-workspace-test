workbookId: order-value-spread-by-channel-2
name: Order Value Spread by Channel
description: Distribution of order-line values across sales channels.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: order_lines
      name: Order Lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_value
          name: Order Value
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
    - id: order_values
      name: Order Value Distribution by Channel
      kind: box-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
        - id: channel
          name: Channel
          formula: "[Channel]"
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: distribution
      name: Distribution
      elements:
        - order_values
    - id: data
      name: Data
      visibility: hidden
      elements:
        - order_lines
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="distribution">
      <Element elementId="order_values" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="order_lines" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
