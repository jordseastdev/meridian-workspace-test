workbookId: retail-sales-products
name: Retail Sales & Products
description: Sales performance overview and top products from the Retail model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: sales_base
      name: Order Lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: product
          name: Product
          formula: "[Product/Product Name]"
        - id: category
          name: Category
          formula: "[Product/Category]"
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: product_date_filter
      kind: control
      controlId: product_order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: revenue_kpi
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: value
    - id: orders_kpi
      name: Order Count
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: value
    - id: aov_kpi
      name: Avg Order Value
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Avg Order Value
          formula: "[Avg Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: margin_kpi
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: monthly_revenue
      name: Monthly Revenue
      kind: line-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top Products by Revenue
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
    - id: product_table
      name: Top Products
      kind: table
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_product
          groupBy:
            - product
          calculations:
            - revenue
          sort:
            - columnId: revenue
              direction: descending
      limit: 10
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - revenue_kpi
        - orders_kpi
        - aov_kpi
        - margin_kpi
        - monthly_revenue
        - channel_sales
    - id: products
      name: Products
      elements:
        - product_date_filter
        - top_products
        - product_table
    - id: data
      name: Data
      visibility: hidden
      elements:
        - sales_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="revenue_kpi" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="orders_kpi" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="aov_kpi" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="margin_kpi" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="products">
      <Element elementId="product_date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="3 / 12"/>
      <Element elementId="product_table" gridColumn="1 / 25" gridRow="12 / 24"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="sales_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
