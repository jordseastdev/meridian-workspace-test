workbookId: discount-request-review-10
name: Discount Request Review
description: Managers review open discount requests and record an approval or rejection with a note.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Discount Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age
          name: Age Days
          formula: "[Age Days]"
      sort:
        - columnId: age
          direction: descending
      limit: 500
    - id: status_filter
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      value: Open
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: status
    - id: region_filter
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: region
    - id: queue
      name: Discount Requests
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: age
          name: Age Days
    - id: decision_note
      name: Decision Notes
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
        - id: decided_by
          name: Decided By
          type: text
          default:
            kind: user
        - id: decided_at
          name: Decided At
          type: date
          default:
            kind: today
  pages:
    - id: review
      name: Review Queue
      elements:
        - status_filter
        - region_filter
        - queue
        - decision_note
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deals_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="status_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="region_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="queue" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="decision_note" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
