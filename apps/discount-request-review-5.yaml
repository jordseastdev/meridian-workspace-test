workbookId: discount-request-review-5
name: Discount Request Review
description: Managers review open discount requests and record an approval or rejection with a note.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deal_source
      name: Discount requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age
          name: Age Days
          formula: "[Age Days]"
      filters:
        - id: open_only
          kind: formula
          formula: '[Status] = "Open"'
      sort:
        - columnId: age
          direction: descending
    - id: queue
      name: Discount requests
      kind: table
      source:
        kind: table
        elementId: deal_source
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: amount
          name: List Amount
        - id: discount
          name: Submitted Discount
        - id: age
          name: Age Days
      sort:
        - columnId: age
          direction: descending
      limit: 500
    - id: decision_note
      kind: control
      controlId: decision_note_value
      controlType: text-area
      label: Decision note
      placeholder: Explain the approval or rejection
    - id: decision_form
      name: Record decision
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
          required: true
        - id: reviewer
          name: Reviewer
          type: text
          default:
            kind: user
          readOnly: true
        - id: decided_at
          name: Decided At
          type: date
          default:
            kind: today
          readOnly: true
  pages:
    - id: review
      name: Review Queue
      elements:
        - queue
        - decision_note
        - decision_form
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deal_source
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="queue" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="decision_note" gridColumn="1 / 7" gridRow="13 / 15"/>
      <Element elementId="decision_form" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deal_source" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
