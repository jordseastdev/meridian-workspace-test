workbookId: retail-sales-dashboard-2
name: Retail Sales Dashboard
description: Interactive retail performance dashboard for reviewing sales, profit, channel, category, and order-line detail.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base
      name: Retail Order Lines Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail-obt
        elementId: order_lines
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: unit_price
          name: Unit Price
          formula: "[Unit Price]"
          format:
            kind: currency
            decimals: 2
        - id: discount
          name: Discount
          formula: "[Discount]"
          format:
            kind: percent
            decimals: 1
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: cost
          name: Cost
          formula: "[Cost]"
          format:
            kind: currency
            decimals: 2
        - id: profit
          name: Profit
          formula: "[Profit]"
          format:
            kind: currency
            decimals: 2
        - id: category
          name: Category
          formula: "[Products/Category]"
        - id: product_name
          name: Product Name
          formula: "[Products/Product Name]"
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: base
          columnId: order_date
    - id: channel_filter
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: base
          columnId: channel
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: base
          columnId: status
    - id: revenue_kpi
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: profit_kpi
      name: Total Profit
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Total Profit
          formula: "[Total Profit]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: orders_kpi
      name: Order Lines
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Order Lines
          formula: "[Order Count]"
      value:
        columnId: v
    - id: margin_kpi
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: v
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: monthly_trend
      name: Monthly Revenue & Profit
      kind: line-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: month
          name: Order Month
          formula: "[Order Month]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: profit
          name: Total Profit
          formula: "[Total Profit]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
          - profit
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
    - id: category_sales
      name: Revenue by Category
      kind: bar-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
    - id: top_products
      name: Top 10 Products by Revenue
      kind: bar-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: product_name
          name: Product Name
          formula: "[Product Name]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product_name
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
      limit: 10
    - id: detail_table
      name: Order Line Detail
      kind: table
      source:
        kind: table
        elementId: base
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: product_name
          name: Product
          formula: "[Product Name]"
        - id: category
          name: Category
          formula: "[Category]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: profit
          name: Profit
          formula: "[Profit]"
          format:
            kind: currency
            decimals: 2
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - channel_filter
        - status_filter
        - revenue_kpi
        - profit_kpi
        - orders_kpi
        - margin_kpi
        - monthly_trend
        - channel_sales
        - category_sales
        - top_products
        - detail_table
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="revenue_kpi" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="profit_kpi" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="orders_kpi" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="margin_kpi" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="category_sales" gridColumn="1 / 13" gridRow="16 / 25"/>
      <Element elementId="top_products" gridColumn="13 / 25" gridRow="16 / 25"/>
      <Element elementId="detail_table" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
