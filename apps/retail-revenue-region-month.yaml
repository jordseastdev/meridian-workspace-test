workbookId: retail-revenue-region-month
name: Revenue by Region and Month
description: Revenue pivoted by sales region and order month, using the Retail semantic model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: revenue_by_region_month
      name: Revenue by Region and Month
      kind: pivot-table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: month
          name: Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      rowsBy:
        - columnId: region
      columnsBy:
        - columnId: month
      values:
        - revenue
      showTotals: true
  pages:
    - id: revenue_pivot
      name: Revenue by Region and Month
      elements:
        - revenue_by_region_month
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="revenue_pivot">
      <Element elementId="revenue_by_region_month" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
