workbookId: order-value-spread-by-channel-8
name: Order Value Spread by Channel
description: Distribution of net order-line values across sales channels.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders-base
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
    - id: channel-filter
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders-base
          columnId: channel
    - id: order-value-box
      name: Order value distribution by channel
      kind: box-chart
      source:
        kind: table
        elementId: orders-base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: overview
      name: Order Value Spread
      elements:
        - channel-filter
        - order-value-box
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders-base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="channel-filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="order-value-box" gridColumn="1 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders-base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
