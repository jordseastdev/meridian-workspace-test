workbookId: support-ticket-triage-4
name: Support Ticket Triage
description: Triage open support tickets and monitor ticket volume and resolution performance.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_base
      name: Support ticket source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Resolution Hours]"
        - id: ticket_count
          name: Ticket Count
          formula: "[Ticket Count]"
        - id: avg_resolution
          name: Average Resolution Hours
          formula: Avg([Resolution Hours])
      visibleAsSource: true
    - id: date_filter
      kind: control
      controlId: opened_date
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: opened_at
    - id: priority_filter
      kind: control
      controlId: priority
      controlType: list
      label: Priority
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: priority
    - id: open_cards
      name: Open tickets
      kind: table
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: opened_at
          name: Opened At
        - id: status
          name: Status
      filters:
        - id: open_only
          kind: formula
          formula: '[status] = "Open"'
      rowActions:
        - id: assign_to_me
          text: Assign to me
          appearance: filled
          icon: assign
          showWhen: '[status] = "Open"'
          effects:
            - effect: update-rows
              tableElementId: ticket_actions
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                agent:
                  type: user
                  field: email
        - id: close_ticket
          text: Close
          appearance: outline
          icon: archive
          showWhen: '[status] = "Open"'
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_actions
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                status:
                  type: constant
                  value: Closed
                closed_by:
                  type: user
                  field: email
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - priority
          - agent
          - opened_at
    - id: ticket_actions
      name: Ticket action log
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          type: text
          required: true
        - id: agent
          name: Assigned To
          type: text
        - id: status
          name: Status
          type: text
        - id: closed_by
          name: Closed By
          type: text
    - id: by_category
      name: Tickets by category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: category
          name: Category
        - id: tickets
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: tickets
          direction: descending
      yAxis:
        columnIds:
          - tickets
      color:
        by: single
        value: "#4661c9"
    - id: by_priority
      name: Tickets by priority
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: priority
          name: Priority
        - id: tickets
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: tickets
          direction: descending
      yAxis:
        columnIds:
          - tickets
      color:
        by: single
        value: "#4661c9"
    - id: resolution_trend
      name: Average resolution hours over time
      kind: line-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Opened At])
        - id: avg_hours
          name: Average Resolution Hours
          formula: Avg([Resolution Hours])
          format:
            kind: number
            decimals: 1
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - avg_hours
    - id: ask_button
      kind: button
      actions:
        - id: open_agent
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: ask_assistant
      text: Ask Ticket Triage Assistant
      appearance: filled
      icon: sparkles
    - id: assistant
      kind: agent
      agentId: support-ticket-triage-assistant
      placeholder: Ask about ticket triage and support performance
      height: 520
  pages:
    - id: queue
      name: Open Queue
      elements:
        - date_filter
        - priority_filter
        - ask_button
        - open_cards
    - id: analytics
      name: Ticket Analytics
      elements:
        - date_filter
        - priority_filter
        - by_category
        - by_priority
        - resolution_trend
    - id: data
      name: Data
      visibility: hidden
      elements:
        - ticket_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="open_cards" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="ticket_actions" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="by_category" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="by_priority" gridColumn="13 / 25" gridRow="3 / 12"/>
      <Element elementId="resolution_trend" gridColumn="1 / 25" gridRow="12 / 21"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="ticket_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ask_assistant">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ask_assistant
      kind: drawer
      title: Ticket Triage Assistant
      size: large
      elements:
        - assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
