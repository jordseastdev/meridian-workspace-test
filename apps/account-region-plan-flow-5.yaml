workbookId: account-region-plan-flow-5
name: "Account Flow: Region to Current Plan"
description: Shows account counts flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account-level account flow base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
      visibleAsSource: true
    - id: flow
      name: Accounts by Region to Current Plan
      kind: sankey-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: CountDistinct([Account ID])
      value:
        columnId: account_count
      from:
        columnId: region
      to:
        columnId: current_plan
    - id: details
      name: Account Flow Details
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: CountDistinct([Account ID])
      groupings:
        - id: by_region_plan
          groupBy:
            - region
            - current_plan
          calculations:
            - account_count
      sort:
        - columnId: account_count
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Account Flow
      elements:
        - flow
        - details
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="flow" gridColumn="1 / 25" gridRow="1 / 10"/>
      <Element elementId="details" gridColumn="1 / 25" gridRow="10 / 22"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
