workbookId: order-value-spread-channel
name: Order Value Spread by Channel
description: Distribution of order-line values across sales channels.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Order Values by Channel
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: status
          name: Status
          formula: "[Status]"
      filters:
        - id: completed_orders
          kind: list
          columnId: status
          mode: include
          values:
            - Completed
    - id: order_value_box
      name: Order Value Spread by Channel
      description: Box plot of order-line net revenue (the model's order value at line grain) for each channel; completed orders only.
      kind: box-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
        - id: channel
          name: Channel
          formula: "[Channel]"
      value:
        columnId: order_value
      category:
        columnId: channel
      limit: 10
  pages:
    - id: overview
      name: Order Value Spread
      elements:
        - order_value_box
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="order_value_box" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
