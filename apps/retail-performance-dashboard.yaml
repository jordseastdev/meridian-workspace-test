workbookId: retail-performance-dashboard
name: Retail Performance Dashboard
description: Interactive retail sales, profit and order-line dashboard with order-date, channel and status filters.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Filtered retail order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail-obt
        elementId: order_lines
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: unit_price
          name: Unit Price
          formula: "[Unit Price]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: profit
          name: Profit
          formula: "[Profit]"
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: channel_filter
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: channel
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: status
    - id: revenue_kpi
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: value
    - id: profit_kpi
      name: Total Profit
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Total Profit
          formula: "[Total Profit]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: value
    - id: orders_kpi
      name: Order Lines
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: value
    - id: customers_kpi
      name: Customers
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Customer Count
          formula: "[Customer Count]"
      value:
        columnId: value
    - id: monthly_trend
      name: Monthly Revenue and Profit
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Order Month
          formula: "[Order Month]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: profit
          name: Total Profit
          formula: "[Total Profit]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
          - profit
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: category_sales
      name: Revenue by Product Category
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: category
          name: Category
          formula: "[Product/Category]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      limit: 10
    - id: status_mix
      name: Order Lines by Status
      kind: donut-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: lines
          name: Order Lines
          formula: "[Order Count]"
      value:
        columnId: lines
      category:
        columnId: status
    - id: order_details
      name: Order-line Detail
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: profit
          name: Profit
          formula: "[Profit]"
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - channel_filter
        - status_filter
        - revenue_kpi
        - profit_kpi
        - orders_kpi
        - customers_kpi
        - monthly_trend
        - channel_sales
        - category_sales
        - status_mix
        - order_details
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="revenue_kpi" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="profit_kpi" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="orders_kpi" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="customers_kpi" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="category_sales" gridColumn="1 / 13" gridRow="16 / 25"/>
      <Element elementId="status_mix" gridColumn="13 / 25" gridRow="16 / 25"/>
      <Element elementId="order_details" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
