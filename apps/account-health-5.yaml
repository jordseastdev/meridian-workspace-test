workbookId: account-health-5
name: Account Health
description: Account health overview with billing, adoption, lifecycle, and an account-focused assistant.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account Health Data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: employee_count
          name: Employee Count
          formula: "[Employee Count]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: adoption_rate
          name: Feature Adoption Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: paid_invoice_rate
          name: Paid Invoice Rate
          formula: SafeDivide([Paid Invoice Count], [Invoice Count])
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
    - id: signup_filter
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: signup_date
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Account status
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: status
    - id: ask_assistant
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Account Health Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: v
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
      value:
        columnId: v
    - id: kpi_adoption
      name: Feature adoption
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Feature Adoption Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: accounts_by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: count
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
    - id: billed_by_plan
      name: Total billed by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
      xAxis:
        columnId: plan
        sort:
          by: billed
          direction: descending
      yAxis:
        columnIds:
          - billed
    - id: account_detail
      name: Account details
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adoption_rate
          name: Feature Adoption Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: paid_invoice_rate
          name: Paid Invoice Rate
          formula: SafeDivide([Paid Invoice Count], [Invoice Count])
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
    - id: account_health_assistant
      kind: agent
      agentId: account-health-assistant
      placeholder: Ask about account health, billing, adoption, or a specific account…
      height: 700
  pages:
    - id: overview
      name: Overview
      elements:
        - signup_filter
        - status_filter
        - ask_assistant
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - accounts_by_status
        - billed_by_plan
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - account_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="signup_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_assistant" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="accounts_by_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="billed_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="account_health_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Account Health Assistant
      size: large
      elements:
        - account_health_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
