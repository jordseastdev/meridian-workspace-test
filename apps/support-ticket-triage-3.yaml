workbookId: support-ticket-triage-3
name: Support Ticket Triage
description: Triage open support tickets and monitor category, priority and resolution trends.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: date_filter
      kind: control
      controlId: opened_range
      controlType: date-range
      label: Opened date
      value:
        start: 2025-01-01
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: tickets
          columnId: opened_at
    - id: priority_filter
      kind: control
      controlId: priority
      controlType: list
      label: Priority
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: tickets
          columnId: priority
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Triage Assistant
      appearance: filled
      icon: sparkles
    - id: tickets
      name: Support ticket base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Resolution Hours]"
      filters:
        - id: open_only
          kind: list
          columnId: status
          mode: include
          values:
            - Open
    - id: ticket_cards
      name: Open Tickets
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: tickets
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: category
          name: Category
          formula: "[Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: assigned_by
          name: Assigned By
          type: text
        - id: closed_by
          name: Closed By
          type: text
        - id: closed_at
          name: Closed At
          type: datetime
      rowActions:
        - id: assign_to_me
          text: Assign to me
          appearance: filled
          icon: assign
          showWhen: IsNull([assigned_by])
          effects:
            - effect: update-rows
              tableElementId: ticket_cards
              whichRows:
                type: selected
              values:
                assigned_by:
                  type: user
                  field: email
        - id: close_ticket
          text: Close
          appearance: outline
          icon: archive
          showWhen: '[status] = "Open"'
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_cards
              whichRows:
                type: selected
              values:
                closed_by:
                  type: user
                  field: email
                closed_at:
                  type: now
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - priority
          - agent
          - opened_at
    - id: by_category
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: by_priority
      name: Tickets by Priority
      kind: bar-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: resolution_trend
      name: Average Resolution Hours Over Time
      kind: line-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Opened At])
        - id: avg_hours
          name: Average Resolution Hours
          formula: Avg([Resolution Hours])
          format:
            kind: number
            decimals: 1
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - avg_hours
    - id: support_agent
      kind: agent
      agentId: support-triage-assistant-2
      placeholder: Ask about the ticket queue, trends, or triage priorities.
      height: 720
  pages:
    - id: triage
      name: Triage
      elements:
        - date_filter
        - priority_filter
        - ask_button
        - ticket_cards
    - id: analytics
      name: Analytics
      elements:
        - date_filter
        - priority_filter
        - by_category
        - by_priority
        - resolution_trend
    - id: data
      name: Data
      visibility: hidden
      elements:
        - tickets
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="ticket_cards" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="by_category" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="by_priority" gridColumn="13 / 25" gridRow="3 / 12"/>
      <Element elementId="resolution_trend" gridColumn="1 / 25" gridRow="12 / 21"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="tickets" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="support_agent" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Support Triage Assistant
      size: large
      elements:
        - support_agent
  settings:
    theme:
      preset: daylight
      palette: meridian
