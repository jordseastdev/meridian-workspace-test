workbookId: saas-account-explorer
name: SaaS Account Explorer
description: Explore SaaS account counts, billing, adoption, and account attributes.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid_invoice_count
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Lifecycle Status
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: f_region
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: region
    - id: f_signup
      kind: control
      controlId: signup_date_filter
      controlType: date-range
      label: Signup Date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: signup_date
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: v
    - id: kpi_billed
      name: Total Billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
      value:
        columnId: v
    - id: kpi_adoption
      name: Adopted Feature Rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: kpi_paid
      name: Paid Invoice Rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: trend_signup
      name: Accounts by Signup Month
      kind: line-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: month
          name: Signup Month
          formula: DateTrunc("month", [Signup Date])
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - accounts
    - id: by_plan
      name: Accounts by Current Plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: plan
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
      limit: 10
    - id: account_detail
      name: Account Detail
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
        - id: region
          name: Region
        - id: status
          name: Status
        - id: current_plan
          name: Current Plan
        - id: signup_date
          name: Signup Date
        - id: total_billed
          name: Total Billed
        - id: adopted_feature_count
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: paid_invoice_count
          name: Paid Invoices
          formula: "[Paid Invoice Count]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Account Overview
      elements:
        - f_status
        - f_region
        - f_signup
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - trend_signup
        - by_plan
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_status" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_region" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_signup" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="trend_signup" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
