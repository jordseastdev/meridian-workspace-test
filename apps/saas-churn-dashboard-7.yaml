workbookId: saas-churn-dashboard-7
name: SaaS Account Churn Dashboard
description: Account-level churn dashboard with separate views for churned, at-risk, and healthy accounts.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: churn_reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: adopted_feature_rate
          name: Adopted Feature Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Account status
      selectionMode: multiple
      source:
        kind: source
        source:
          kind: table
          elementId: accounts
        columnId: status
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: churned_tab
      name: Churned accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: churn_reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
      filters:
        - id: only_churned
          kind: formula
          formula: '[Status] = "Churned"'
      limit: 500
    - id: risk_tab
      name: At-risk accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: adopted_feature_rate
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
        - id: csm
          name: CSM
          formula: "[CSM]"
      filters:
        - id: at_risk_status
          kind: formula
          formula: '[Status] = "At Risk"'
      limit: 500
    - id: healthy_tab
      name: Healthy accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: adopted_feature_rate
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
      filters:
        - id: healthy_status
          kind: formula
          formula: '[Status] = "Active"'
      limit: 500
    - id: plan_filter
      kind: control
      controlId: plan
      controlType: list
      label: Current plan
      selectionMode: multiple
      source:
        kind: source
        source:
          kind: table
          elementId: accounts
        columnId: current_plan
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: current_plan
    - id: signups_by_month
      name: Signups by month
      kind: line-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: signup_month
          name: Signup month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: CountDistinct([Account ID])
      filters:
        - id: valid_signup_date
          kind: formula
          formula: '[Signup Date] >= "2022-01-02" and [Signup Date] <= "2025-09-28"'
      xAxis:
        columnId: signup_month
      yAxis:
        columnIds:
          - signups
      color:
        by: single
        value: "#4661c9"
  pages:
    - id: churn_dashboard
      name: Churn Dashboard
      elements:
        - status_filter
        - plan_filter
        - signups_by_month
        - churned_tab
        - risk_tab
        - healthy_tab
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="churn_dashboard">
      <Element elementId="status_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="plan_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="signups_by_month" gridColumn="1 / 25" gridRow="3 / 12"/>
      <Element elementId="churned_tab" gridColumn="1 / 25" gridRow="12 / 24"/>
      <Element elementId="risk_tab" gridColumn="1 / 25" gridRow="24 / 36"/>
      <Element elementId="healthy_tab" gridColumn="1 / 25" gridRow="36 / 48"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
