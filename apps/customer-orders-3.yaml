workbookId: customer-orders-3
name: Customer Orders
description: Customer list with a drawer showing each selected customer's order history.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_base
      name: Customer directory
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer Name
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: region
          name: Region
          formula: "[Customer Region]"
        - id: loyalty_tier
          name: Loyalty Tier
          formula: "[Loyalty Tier]"
      sort:
        - columnId: customer_name
          direction: ascending
      limit: 500
    - id: order_base
      name: Customer orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      sort:
        - columnId: order_date
          direction: descending
      limit: 500
    - id: customer_list
      name: Customers
      description: Select a customer row to open their order history.
      kind: table
      actions:
        - id: open_customer_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: customer_order_drawer
      source:
        kind: table
        elementId: customer_base
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer Name
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: loyalty_tier
          name: Loyalty Tier
          formula: "[Loyalty Tier]"
    - id: customer_orders
      name: Orders
      kind: table
      source:
        kind: table
        elementId: order_base
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: selected_customer_filter
          kind: formula
          formula: "[Customer ID] = [selected_customer]"
      sort:
        - columnId: order_date
          direction: descending
      limit: 500
    - id: selected_customer_control
      kind: control
      controlId: selected_customer
      controlType: text
      label: Selected customer
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
    - id: data
      name: Data
      visibility: hidden
      elements:
        - selected_customer_control
        - customer_base
        - order_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="selected_customer_control" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="customer_base" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="order_base" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customer_order_drawer">
      <Element elementId="customer_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
  overlays:
    - id: customer_order_drawer
      kind: drawer
      title: Customer orders
      elements:
        - customer_orders
  settings:
    theme:
      preset: daylight
      palette: meridian
