workbookId: support-ticket-triage-13
name: Support Ticket Triage
description: Triage open retail support tickets, assign ownership, close tickets, and review status and category trends.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_base
      name: Support Tickets Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: category
          name: Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: status
          name: Status
          formula: "[Support Tickets/Ticket Status]"
        - id: channel
          name: Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: first_response_minutes
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat_score
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
    - id: f_date
      kind: control
      controlId: opened_date
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: opened_at
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: status
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Triage Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_open
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: count
          name: Open Tickets
          formula: "[Ticket Count]"
      filters:
        - id: open_only
          kind: formula
          formula: '[Status] = "Open"'
      value:
        columnId: count
    - id: kpi_status
      name: Tickets by Status
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: ticket_count
          name: Tickets
          formula: "[Ticket Count]"
      xAxis:
        columnId: status
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
    - id: category_chart
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: ticket_count
          name: Tickets
          formula: "[Ticket Count]"
      xAxis:
        columnId: category
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
      limit: 10
    - id: ticket_cards
      name: Open Ticket Queue
      kind: input-table
      actions:
        - id: open_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      inputMode: edit
      source:
        kind: linked
        from: ticket_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: category
          name: Category
          formula: "[Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: status
          name: Status
          formula: If([Closed], "Closed", [Status])
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: checkbox
      sort:
        - columnId: opened_at
          direction: descending
      rowActions:
        - id: assign
          text: Assign
          appearance: outline
          icon: assign
          showWhen: IsNull([assigned_to])
          ask:
            label: Assign to
            placeholder: Agent name
            required: true
          effects:
            - effect: update-rows
              tableElementId: ticket_cards
              whichRows:
                type: selected
              values:
                assigned_to:
                  type: answer
        - id: close
          text: Close
          appearance: danger
          icon: archive
          showWhen: IsNull([closed])
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_cards
              whichRows:
                type: selected
              values:
                closed:
                  type: constant
                  value: true
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - opened_at
          - agent
          - channel
          - assigned_to
    - id: ticket_work
      name: Ticket Triage Updates
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: ticket_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: checkbox
    - id: selected_ticket
      kind: control
      controlId: selected_ticket
      controlType: text
      label: Selected ticket
    - id: ticket_detail
      name: Selected Ticket Details
      kind: table
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: status
          name: Status
        - id: channel
          name: Channel
        - id: first_response_minutes
          name: First Response Minutes
        - id: resolution_hours
          name: Resolution Hours
        - id: csat_score
          name: CSAT Score
      filters:
        - id: selected
          kind: formula
          formula: "[Ticket ID] = [selected_ticket]"
    - id: support_assistant
      kind: agent
      agentId: support-triage-assistant
      placeholder: Ask about ticket trends or triage priorities.
      height: 700
  pages:
    - id: triage
      name: Ticket Triage
      elements:
        - f_date
        - f_status
        - ask_button
        - kpi_open
        - kpi_status
        - category_chart
        - ticket_cards
    - id: hidden_data
      name: Data
      visibility: hidden
      elements:
        - ticket_base
        - ticket_work
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="f_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="kpi_open" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="kpi_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="category_chart" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="ticket_cards" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="hidden_data">
      <Element elementId="ticket_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_work" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_drawer">
      <Element elementId="selected_ticket" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="support_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ticket_drawer
      kind: drawer
      title: Ticket Details
      size: large
      elements:
        - selected_ticket
        - ticket_detail
    - id: assistant_drawer
      kind: drawer
      title: Support Triage Assistant
      size: large
      elements:
        - support_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
