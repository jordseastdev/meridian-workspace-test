workbookId: support-ticket-workspace
name: Support Ticket Workspace
description: Mobile-friendly workspace for triaging and updating open customer support tickets.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_source
      name: Support ticket source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: channel
          name: Contact Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: status
          name: Ticket Status
          formula: "[Support Tickets/Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
    - id: ticket_updates
      name: Ticket updates
      kind: input-table
      inputMode: edit
      source:
        kind: empty
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          type: text
          required: true
        - id: assigned_to
          name: Assigned To
          type: text
        - id: working_note
          name: Working Note
          type: text
          multiline: true
        - id: follow_up_date
          name: Follow-up Date
          type: date
        - id: closed
          name: Closed
          type: checkbox
          default:
            kind: constant
            value: false
    - id: status_filter
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      value: Open
      options:
        - Open
      filters:
        - source:
            kind: table
            elementId: ticket_source
          columnId: status
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: ask_assistant
      text: Ask Support Ticket Assistant
      appearance: filled
      icon: sparkles
    - id: open_count
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_source
      columns:
        - id: total
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      value:
        columnId: total
    - id: category_chart
      name: Open Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_source
      columns:
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: ticket_count
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
      color:
        by: single
        value: "#4661c9"
    - id: priority_chart
      name: Open Tickets by Priority
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_source
      columns:
        - id: priority
          name: Priority
        - id: ticket_count
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
      color:
        by: single
        value: "#4661c9"
    - id: ticket_queue
      name: Open Ticket Queue
      kind: table
      actions:
        - id: select_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_detail
      source:
        kind: table
        elementId: ticket_source
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
        - id: channel
          name: Channel
          formula: "[Contact Channel]"
        - id: agent
          name: Current Agent
          formula: "[Agent]"
      filters:
        - id: open_only
          kind: formula
          formula: '[Ticket Status] = "Open"'
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - opened_at
          - channel
          - agent
    - id: selected_ticket
      kind: control
      controlId: selected_ticket
      controlType: text
      label: Selected ticket
    - id: ticket_detail_view
      name: Selected Ticket
      kind: table
      source:
        kind: table
        elementId: ticket_source
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
        - id: channel
          name: Contact Channel
        - id: agent
          name: Current Agent
          formula: "[Agent]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: first_response
          name: First Response (min)
          formula: "[First Response Minutes]"
        - id: resolution
          name: Resolution (hours)
          formula: "[Resolution Hours]"
        - id: csat
          name: CSAT
          formula: "[CSAT Score]"
      filters:
        - id: selected
          kind: formula
          formula: "[Ticket ID] = [selected_ticket]"
    - id: ticket_update
      kind: form
      title: Update ticket
      tableElementId: ticket_updates
      fields:
        - ticket_id
        - assigned_to
        - working_note
        - follow_up_date
        - closed
      submitText: Save update
    - id: support_agent
      kind: agent
      agentId: support-ticket-assistant-2
      placeholder: Ask about the open ticket queue or support trends.
      height: 520
  pages:
    - id: workspace
      name: Ticket Workspace
      elements:
        - status_filter
        - ask_button
        - open_count
        - category_chart
        - priority_chart
        - ticket_queue
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="workspace">
      <Element elementId="status_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="7 / 11" gridRow="1 / 3"/>
      <Element elementId="open_count" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="category_chart" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="priority_chart" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="ticket_queue" gridColumn="1 / 25" gridRow="16 / 28"/>
      <Element elementId="ticket_source" gridColumn="1 / 25" gridRow="28 / 40"/>
      <Element elementId="ticket_updates" gridColumn="1 / 25" gridRow="40 / 52"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_detail">
      <Element elementId="selected_ticket" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ticket_detail_view" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="ticket_update" gridColumn="1 / 25" gridRow="15 / 23"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ask_assistant">
      <Element elementId="support_agent" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ticket_detail
      kind: drawer
      title: Ticket details
      size: large
      elements:
        - selected_ticket
        - ticket_detail_view
        - ticket_update
    - id: ask_assistant
      kind: drawer
      title: Support Ticket Assistant
      size: large
      elements:
        - support_agent
  settings:
    theme:
      preset: daylight
      palette: meridian
