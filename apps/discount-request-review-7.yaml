workbookId: discount-request-review-7
name: Discount Request Review
description: Managers review CRM discount requests and record an approval or rejection with a note.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals
      name: CRM Discount Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deals/Deal ID]"
        - id: account
          name: Account
          formula: "[Deals/Account]"
        - id: owner
          name: Owner
          formula: "[Deals/Owner]"
        - id: region
          name: Region
          formula: "[Deals/Region]"
        - id: stage
          name: Stage
          formula: "[Deals/Stage]"
        - id: status
          name: Status
          formula: "[Deals/Status]"
        - id: list_amount
          name: List Amount
          formula: "[Deals/List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Deals/Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Deals/Age Days]"
      sort:
        - columnId: age_days
          direction: descending
      limit: 500
    - id: deal_queue
      name: Discount Requests
      kind: table
      source:
        kind: table
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: list_amount
          name: List Amount
        - id: submitted_discount
          name: Submitted Discount
        - id: age_days
          name: Age Days
      sort:
        - columnId: age_days
          direction: descending
      limit: 500
    - id: decision_panel
      name: Decision and Note
      description: Record a manager's approval or rejection and explain the decision.
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Manager Note
          type: text
          multiline: true
          required: true
        - id: manager
          name: Manager
          type: text
          default:
            kind: user
          readOnly: true
        - id: decided_at
          name: Decided At
          type: date
          default:
            kind: today
          readOnly: true
  pages:
    - id: review
      name: Review Requests
      elements:
        - deal_queue
        - decision_panel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deals
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="deal_queue" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="decision_panel" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deals" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
