workbookId: region-plan-flow
name: Accounts by Region → Current Plan
description: Sankey showing account counts flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: region_plan_flow
      name: Accounts flowing from region to current plan
      kind: sankey-chart
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: Count()
      value:
        columnId: account_count
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: flow
      name: Account Flow
      elements:
        - region_plan_flow
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="flow">
      <Element elementId="region_plan_flow" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
