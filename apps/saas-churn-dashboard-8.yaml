workbookId: saas-churn-dashboard-8
name: SaaS Account Churn Dashboard
description: Churned, at-risk, and healthy SaaS accounts using lifecycle status from the SaaS Account-Level OBT.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: total_monthly_active_users
          name: Total Monthly Active Users
          formula: "[Total Monthly Active Users]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
      limit: 500
    - id: status_filter
      kind: control
      controlId: status_filter
      controlType: list
      label: Filter all accounts by status
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: churned_tab
      name: Churned Accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
      filters:
        - id: churned_only
          kind: formula
          formula: '[Status] = "Churned"'
      limit: 500
    - id: atrisk_tab
      name: At-Risk Accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: total_monthly_active_users
          name: Total Monthly Active Users
          formula: "[Total Monthly Active Users]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
      filters:
        - id: at_risk_statuses
          kind: list
          columnId: status
          mode: include
          values:
            - At-Risk
            - At Risk
            - Trial
      limit: 500
    - id: healthy_tab
      name: Healthy Accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: total_monthly_active_users
          name: Total Monthly Active Users
          formula: "[Total Monthly Active Users]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
      filters:
        - id: healthy_status
          kind: formula
          formula: '[Status] = "Active"'
      limit: 500
    - id: plan_filter
      kind: control
      controlId: plan_filter
      controlType: list
      label: Filter all accounts by plan
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: current_plan
    - id: signups_by_month
      name: Signups by Month
      kind: line-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: signup_month
          name: Signup Month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: CountDistinct([Account ID])
      filters:
        - id: signup_dates
          kind: formula
          formula: '[Signup Date] >= "2022-01-02" and [Signup Date] <= "2025-09-28"'
      xAxis:
        columnId: signup_month
      yAxis:
        columnIds:
          - signups
  pages:
    - id: churn_dashboard
      name: Churn Dashboard
      elements:
        - status_filter
        - plan_filter
        - signups_by_month
        - churned_tab
        - atrisk_tab
        - healthy_tab
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="churn_dashboard">
      <Element elementId="status_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="plan_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="signups_by_month" gridColumn="1 / 25" gridRow="3 / 12"/>
      <Element elementId="churned_tab" gridColumn="1 / 25" gridRow="12 / 24"/>
      <Element elementId="atrisk_tab" gridColumn="1 / 25" gridRow="24 / 36"/>
      <Element elementId="healthy_tab" gridColumn="1 / 25" gridRow="36 / 48"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
