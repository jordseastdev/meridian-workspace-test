workbookId: order-value-spread-by-channel-6
name: Order Value Spread by Channel
description: Box plot of order-line value distributions across sales channels.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: order_lines
      name: Order Lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
    - id: channel_filter
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      value:
        - Online
        - In Store
        - Mobile
        - Marketplace
      filters:
        - source:
            kind: table
            elementId: order_lines
          columnId: channel
    - id: order_value_spread
      name: Order Value Distribution by Channel
      kind: box-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: overview
      name: Order Value Spread
      elements:
        - channel_filter
        - order_value_spread
    - id: data
      name: Data
      visibility: hidden
      elements:
        - order_lines
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="channel_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="order_value_spread" gridColumn="1 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="order_lines" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
