workbookId: order-value-spread-by-channel
name: Order Value Spread by Channel
description: Distribution of order-line values by sales channel.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: order_lines
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
      filters:
        - id: valid_lines
          kind: formula
          formula: '[Status] = "Completed"'
    - id: order_value_box
      name: Order value distribution by channel
      kind: box-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: order_value
      category:
        columnId: channel
      limit: 10
  pages:
    - id: analysis
      name: Order Value Spread
      elements:
        - order_value_box
    - id: data
      name: Data
      visibility: hidden
      elements:
        - order_lines
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analysis">
      <Element elementId="order_value_box" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="order_lines" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
