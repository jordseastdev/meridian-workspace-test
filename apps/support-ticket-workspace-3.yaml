workbookId: support-ticket-workspace-3
name: Support Ticket Workspace
description: Mobile-friendly workspace to triage open support tickets and record ownership, notes, follow-up dates and closure.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets_base
      name: Support Tickets Source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Support Tickets/Customer ID]"
        - id: order_id
          name: Order ID
          formula: "[Support Tickets/Order ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: contact_channel
          name: Contact Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: status
          name: Ticket Status
          formula: "[Support Tickets/Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
    - id: ticket_work
      name: Ticket Work Updates
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: tickets_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: contact_channel
          name: Contact Channel
          formula: "[Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: original_agent
          name: Original Agent
          formula: "[Agent]"
        - id: ticket_status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[First Response Minutes]"
        - id: resolution
          name: Resolution Hours
          formula: "[Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[CSAT Score]"
        - id: assigned_to
          name: Assigned To
          type: text
        - id: working_note
          name: Working Note
          type: text
          multiline: true
        - id: follow_up_date
          name: Follow-up Date
          type: date
        - id: closed
          name: Closed
          type: checkbox
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - ticket_status
          - opened_at
          - assigned_to
    - id: selected_ticket
      kind: control
      controlId: selected_ticket
      controlType: text
      label: Selected ticket
    - id: open_count
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: count
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      value:
        columnId: count
    - id: by_category
      name: Open Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: count
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: by_priority
      name: Open Tickets by Priority
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_queue
      columns:
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: count
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: ticket_queue
      name: Open Ticket Queue
      kind: table
      actions:
        - id: open_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_detail
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: assigned_to
          name: Assigned To
          formula: "[Assigned To]"
      filters:
        - id: open_only
          kind: formula
          formula: Coalesce([Closed], false) = false and [Ticket Status] = "Open"
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - ticket_status
          - opened_at
          - assigned_to
    - id: ticket_card
      name: Ticket Details
      kind: table
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: original_agent
          name: Original Agent
          formula: "[Original Agent]"
        - id: assigned_to
          name: Assigned To
          formula: "[Assigned To]"
        - id: note
          name: Working Note
          formula: "[Working Note]"
        - id: follow_up
          name: Follow-up Date
          formula: "[Follow-up Date]"
        - id: closed
          name: Closed
          formula: "[Closed]"
      filters:
        - id: selected_row
          kind: formula
          formula: "[Ticket ID] = [selected_ticket]"
      display: record
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - status
          - opened_at
          - original_agent
          - assigned_to
          - note
          - follow_up
    - id: ticket_form
      kind: form
      title: Update Ticket
      tableElementId: ticket_work
      fields:
        - assigned_to
        - working_note
        - follow_up_date
        - closed
      submitText: Save ticket update
      editRow:
        control: selected_ticket
        columnId: ticket_id
    - id: support_assistant_button
      kind: button
      actions:
        - id: open_support_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: support_assistant
      text: Ask Support Ticket Helper
      appearance: filled
      icon: sparkles
    - id: support_assistant
      kind: agent
      agentId: support-ticket-helper
      height: 700
  pages:
    - id: queue
      name: Open Tickets
      elements:
        - support_assistant_button
        - open_count
        - by_category
        - by_priority
        - ticket_queue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - tickets_base
        - ticket_work
        - selected_ticket
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="support_assistant_button" gridColumn="1 / 5" gridRow="1 / 3"/>
      <Element elementId="open_count" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="by_category" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="by_priority" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="ticket_queue" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="tickets_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_work" gridColumn="1 / 25" gridRow="13 / 25"/>
      <Element elementId="selected_ticket" gridColumn="1 / 7" gridRow="25 / 27"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_detail">
      <Element elementId="ticket_card" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_form" gridColumn="1 / 25" gridRow="13 / 21"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="support_assistant">
      <Element elementId="support_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ticket_detail
      kind: drawer
      title: Ticket Details
      size: large
      elements:
        - ticket_card
        - ticket_form
    - id: support_assistant
      kind: drawer
      title: Support Ticket Helper
      size: large
      elements:
        - support_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
