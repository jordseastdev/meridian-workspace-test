workbookId: discount-approvals-3
name: Discount Approvals
description: Sales team queue for reviewing discount requests, recording decisions, and monitoring approvals.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Deal Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deals/Deal ID]"
        - id: account
          name: Account
          formula: "[Deals/Account]"
        - id: owner
          name: Owner
          formula: "[Deals/Owner]"
        - id: region
          name: Region
          formula: "[Deals/Region]"
        - id: stage
          name: Stage
          formula: "[Deals/Stage]"
        - id: status
          name: Status
          formula: "[Deals/Status]"
        - id: list_amount
          name: List Amount
          formula: "[Deals/List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Deals/Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: discount_requested
          name: Discount Requested
          formula: "[List Amount] * [Submitted Discount]"
          format:
            kind: currency
            decimals: 0
    - id: review
      name: Deal Decisions
      kind: sheet
      inputMode: edit
      source:
        kind: linked
        from: deals_base
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          key: deal_id
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: discount_requested
          name: Discount Requested
          formula: "[Discount Requested]"
          format:
            kind: currency
            decimals: 0
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: decided_by
          name: Decided By
          type: text
          readOnly: true
        - id: decided_at
          name: Decided At
          type: datetime
          readOnly: true
      rowActions:
        - id: approve
          text: Approve
          appearance: filled
          icon: check
          showWhen: IsNull([decision])
          effects:
            - effect: update-rows
              tableElementId: review
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Approved
                decided_by:
                  type: user
                  field: email
                decided_at:
                  type: now
            - effect: notify
              message: Deal approved
              level: success
        - id: reject
          text: Reject
          appearance: danger
          icon: x
          showWhen: IsNull([decision])
          confirm: Reject {{account}}?
          effects:
            - effect: update-rows
              tableElementId: review
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Rejected
                decided_by:
                  type: user
                  field: email
                decided_at:
                  type: now
            - effect: notify
              message: Deal rejected
              level: success
      display: cards
      card:
        title: account
        subtitle: owner
        status: decision
        fields:
          - region
          - list_amount
          - submitted_discount
    - id: region_filter
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: region
    - id: stage_filter
      kind: control
      controlId: stage_filter
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: stage
    - id: queue_cards
      name: Deals to Review
      kind: table
      actions:
        - id: open_deal
          trigger: on-select
          effects:
            - effect: set-control
              control: picked_deal
              value:
                type: selection
                columnId: deal_id
            - effect: open-overlay
              overlayId: deal_drawer
      source:
        kind: table
        elementId: review
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: list_amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: decision
          name: Decision
      filters:
        - id: pending_only
          kind: formula
          formula: IsNull([Decision])
      display: cards
      card:
        title: account
        subtitle: owner
        status: decision
        fields:
          - region
          - list_amount
          - submitted_discount
    - id: picked_deal
      kind: control
      controlId: picked_deal
      controlType: text
      label: Selected deal
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: deal_id
    - id: deal_detail
      name: Selected Deal Details
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: list_amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: discount_requested
          name: Discount Requested
          format:
            kind: currency
            decimals: 0
      filters:
        - id: selected_only
          kind: formula
          formula: "[Deal ID] = [picked_deal]"
    - id: pending_kpi
      name: Pending Deals
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: pending
          name: Pending Deals
          formula: CountIf([Status] = "Pending")
      value:
        columnId: pending
    - id: discount_kpi
      name: Total Discount Requested
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: discount_requested
          name: Discount Requested
          formula: Sum([Discount Requested])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: discount_requested
    - id: by_region
      name: Submitted Discount by Region
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: discount
          name: Submitted Discount
          formula: Sum([Discount Requested])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: region
        sort:
          by: discount
          direction: descending
      yAxis:
        columnIds:
          - discount
      color:
        by: single
        value: "#4661c9"
    - id: by_stage
      name: Submitted Discount by Stage
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: discount
          name: Submitted Discount
          formula: Sum([Discount Requested])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: stage
        sort:
          by: discount
          direction: descending
      yAxis:
        columnIds:
          - discount
      color:
        by: single
        value: "#4661c9"
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer_overlay
      text: Ask Discount Approval Assistant
      appearance: filled
      icon: sparkles
    - id: assistant_drawer
      kind: agent
      agentId: discount-approval-assistant-2
      placeholder: Ask about the discount approval queue or performance.
      height: 720
  pages:
    - id: queue
      name: Review Queue
      elements:
        - region_filter
        - stage_filter
        - ask_button
        - queue_cards
    - id: performance
      name: Approval Performance
      elements:
        - region_filter
        - stage_filter
        - pending_kpi
        - discount_kpi
        - by_region
        - by_stage
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deals_base
        - review
        - picked_deal
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="queue_cards" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="performance">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="pending_kpi" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="discount_kpi" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="by_region" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="by_stage" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="review" gridColumn="1 / 25" gridRow="13 / 25"/>
      <Element elementId="picked_deal" gridColumn="1 / 7" gridRow="25 / 27"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="deal_drawer">
      <Element elementId="picked_deal" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="deal_detail" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer_overlay">
      <Element elementId="assistant_drawer" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: deal_drawer
      kind: drawer
      title: Deal details
      size: large
      elements:
        - picked_deal
        - deal_detail
    - id: assistant_drawer_overlay
      kind: drawer
      title: Discount Approval Assistant
      size: large
      elements:
        - assistant_drawer
  settings:
    theme:
      preset: daylight
      palette: meridian
