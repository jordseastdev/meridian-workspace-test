workbookId: discount-approvals-9
name: Discount Approvals
description: Phone-friendly deal desk queue for reviewing pending discount requests, with filters, charts, drill-down details and an assistant.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals
      name: Discount requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
      filters:
        - id: pending
          kind: formula
          formula: '[Status] = "Pending"'
      visibleAsSource: true
    - id: f_region
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: request_cards
          columnId: region
    - id: f_stage
      kind: control
      controlId: stage_filter
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: request_cards
          columnId: stage
    - id: f_discount
      kind: control
      controlId: min_discount
      controlType: slider
      label: Minimum discount
      filters:
        - source:
            kind: table
            elementId: request_cards
          columnId: submitted_discount
      low: 0
      high: 1
      step: 0.05
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: ask_assistant
      text: Ask Discount Assistant
      appearance: filled
      icon: sparkles
    - id: pending_count
      name: Pending requests
      kind: kpi-chart
      source:
        kind: table
        elementId: request_cards
      columns:
        - id: count
          name: Pending requests
          formula: CountDistinct([Deal ID])
      value:
        columnId: count
    - id: request_cards
      name: Pending discount requests
      kind: sheet
      actions:
        - id: show_details
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_deal
              value:
                type: selection
                columnId: deal_id
            - effect: open-overlay
              overlayId: request_details
      inputMode: edit
      source:
        kind: linked
        from: deals
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          key: deal_id
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: reason
          name: Rejection Reason
          type: text
          multiline: true
        - id: reviewed_by
          name: Reviewed By
          type: text
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: datetime
          readOnly: true
      rowActions:
        - id: approve
          text: Approve
          appearance: filled
          icon: check
          showWhen: IsNull([decision])
          confirm: Approve {{account}}?
          effects:
            - effect: update-rows
              tableElementId: request_cards
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Approved
                reviewed_by:
                  type: user
                  field: email
                reviewed_at:
                  type: now
        - id: reject
          text: Reject
          appearance: danger
          icon: x
          showWhen: IsNull([decision])
          ask:
            label: Rejection reason
            placeholder: Explain why this request is rejected
            required: true
          effects:
            - effect: update-rows
              tableElementId: request_cards
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Rejected
                reason:
                  type: answer
                reviewed_by:
                  type: user
                  field: email
                reviewed_at:
                  type: now
      display: cards
      card:
        title: account
        subtitle: deal_id
        status: stage
        fields:
          - owner
          - region
          - list_amount
          - submitted_discount
          - age_days
    - id: selected_deal
      kind: control
      controlId: selected_deal
      controlType: text
      filters:
        - source:
            kind: table
            elementId: details
          columnId: deal_id
    - id: details
      name: Request details
      kind: table
      source:
        kind: table
        elementId: request_cards
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: owner_email
          name: Owner Email
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: list_amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
      filters:
        - id: selected
          kind: formula
          formula: "[Deal ID] = [selected_deal]"
    - id: charts_region
      kind: control
      controlId: charts_region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: deals
          columnId: region
    - id: charts_stage
      kind: control
      controlId: charts_stage_filter
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: deals
          columnId: stage
    - id: deal_trends
      name: Requests by stage
      kind: bar-chart
      source:
        kind: table
        elementId: deals
      columns:
        - id: stage
          name: Stage
        - id: requests
          name: Requests
          formula: CountDistinct([Deal ID])
      xAxis:
        columnId: stage
        sort:
          by: requests
          direction: descending
      yAxis:
        columnIds:
          - requests
      color:
        by: single
        value: "#0f766e"
      limit: 10
    - id: discount_by_region
      name: Average submitted discount by region
      kind: bar-chart
      source:
        kind: table
        elementId: deals
      columns:
        - id: region
          name: Region
        - id: avg_discount
          name: Average discount
          formula: Avg([Submitted Discount])
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: region
        sort:
          by: avg_discount
          direction: descending
      yAxis:
        columnIds:
          - avg_discount
      color:
        by: single
        value: "#0f766e"
      limit: 10
    - id: assistant
      kind: agent
      agentId: discount-assistant
      placeholder: Ask about discount requests, policy patterns, or approval priorities.
      height: 640
  pages:
    - id: queue
      name: Approval Queue
      elements:
        - f_region
        - f_stage
        - f_discount
        - ask_button
        - pending_count
        - request_cards
    - id: charts
      name: Charts
      elements:
        - charts_region
        - charts_stage
        - deal_trends
        - discount_by_region
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deals
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="f_region" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_stage" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_discount" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="19 / 23" gridRow="1 / 3"/>
      <Element elementId="pending_count" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="request_cards" gridColumn="1 / 25" gridRow="7 / 19"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="charts">
      <Element elementId="charts_region" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="charts_stage" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="deal_trends" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="discount_by_region" gridColumn="13 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deals" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="request_details">
      <Element elementId="selected_deal" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="details" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ask_assistant">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: request_details
      kind: drawer
      title: Discount request details
      size: large
      elements:
        - selected_deal
        - details
    - id: ask_assistant
      kind: drawer
      title: Discount Assistant
      size: large
      elements:
        - assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
