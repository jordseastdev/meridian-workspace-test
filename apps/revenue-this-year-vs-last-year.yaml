workbookId: revenue-this-year-vs-last-year
name: Revenue This Year vs Last Year
description: Compare monthly revenue in the current year with the same months last year, with year-to-date revenue KPIs.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
    - id: f_year
      kind: control
      controlId: year
      controlType: list
      label: Year
      options:
        - 2023
        - 2024
        - 2025
    - id: revenue_by_month
      name: "Monthly revenue: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month_num
          name: Month
          formula: DatePart("month", [Order Date])
        - id: revenue
          name: Revenue
          formula: SumIf([Revenue], DatePart("year", [Order Date]) = [year])
          format:
            kind: currency
            decimals: 0
        - id: revenue_last_year
          name: Revenue last year
          formula: SumIf([Revenue], DatePart("year", [Order Date]) = [year] - 1)
          format:
            kind: currency
            decimals: 0
      filters:
        - id: year_range
          kind: formula
          formula: DatePart("year", [Order Date]) = [year] or DatePart("year", [Order Date]) = [year] - 1
      xAxis:
        columnId: month_num
      yAxis:
        columnIds:
          - revenue
          - revenue_last_year
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue
          formula: SumIf([Revenue], DatePart("year", [Order Date]) = [year])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: kpi_change
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: change
          name: Change vs last year
          formula: SafeDivide(SumIf([Revenue], DatePart("year", [Order Date]) = [year]) - SumIf([Revenue], DatePart("year", [Order Date]) = [year] - 1), SumIf([Revenue], DatePart("year", [Order Date]) = [year] - 1))
          format:
            kind: percent
            decimals: 1
      value:
        columnId: change
  pages:
    - id: overview
      name: Revenue comparison
      elements:
        - f_year
        - kpi_revenue
        - kpi_change
        - revenue_by_month
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_year" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_change" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="revenue_by_month" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
