workbookId: order-value-spread-by-channel-4
name: Order Value Spread by Channel
description: Distribution of individual order-line values by sales channel.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Order Lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: order_value
          name: Order Value
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 2
      filters:
        - id: completed
          kind: formula
          formula: '[Orders/Status] = "Completed"'
    - id: order_values_by_channel
      name: Order Value Spread by Channel
      kind: box-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: overview
      name: Order Value Spread
      elements:
        - order_values_by_channel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="order_values_by_channel" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
