workbookId: retail-sales-overview-16
name: Retail Sales Overview
description: Interactive overview of retail revenue, profitability, order trends and product performance.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Retail order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail-obt
        elementId: order_lines
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: product_id
          name: Product ID
          formula: "[Product ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: cost
          name: Cost
          formula: "[Cost]"
        - id: profit
          name: Profit
          formula: "[Profit]"
        - id: category
          name: Category
          formula: "[Products/Category]"
        - id: product_name
          name: Product Name
          formula: "[Products/Product Name]"
      visibleAsSource: true
    - id: date_filter
      kind: control
      controlId: order_date_range
      controlType: date-range
      label: Order date
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: channel_filter
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: channel
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: status
    - id: revenue_kpi
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Revenue
          formula: "[Total Revenue]"
      value:
        columnId: value
    - id: profit_kpi
      name: Total Profit
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Profit
          formula: "[Total Profit]"
      value:
        columnId: value
    - id: orders_kpi
      name: Order Count
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: value
    - id: margin_kpi
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Gross Margin
          formula: "[Gross Margin]"
      value:
        columnId: value
    - id: monthly_sales
      name: Monthly Revenue Trend
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Order Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: category_sales
      name: Revenue by Product Category
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
      xAxis:
        columnId: category
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top Products by Revenue
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
    - id: order_detail
      name: Order Line Detail
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: category
          name: Category
          formula: "[Category]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
        - id: profit
          name: Profit
          formula: "[Profit]"
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - channel_filter
        - status_filter
        - revenue_kpi
        - profit_kpi
        - orders_kpi
        - margin_kpi
        - monthly_sales
        - channel_sales
        - category_sales
        - top_products
        - order_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="revenue_kpi" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="profit_kpi" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="orders_kpi" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="margin_kpi" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_sales" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="category_sales" gridColumn="1 / 13" gridRow="16 / 25"/>
      <Element elementId="top_products" gridColumn="13 / 25" gridRow="16 / 25"/>
      <Element elementId="order_detail" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
