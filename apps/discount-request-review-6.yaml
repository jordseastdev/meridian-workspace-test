workbookId: discount-request-review-6
name: Discount Request Review
description: Managers review CRM discount requests and record an approval or rejection with a note.
folderId: sales
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deal_source
      name: Deal request source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
    - id: request_queue
      name: Discount requests
      kind: table
      source:
        kind: table
        elementId: deal_source
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: CRM Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age (days)
          formula: "[Age Days]"
      sort:
        - columnId: age_days
          direction: descending
      limit: 500
    - id: decision_log
      name: Approval decision and note
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: deal_source
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          key: deal_id
        - id: account
          name: Account
          formula: "[Account]"
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: note
          name: Manager Note
          type: text
          multiline: true
  pages:
    - id: review
      name: Review Requests
      elements:
        - request_queue
        - decision_log
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deal_source
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="request_queue" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="decision_log" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deal_source" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
