workbookId: saas-revenue-growth
name: SaaS Revenue Growth
description: Explore billed revenue, account growth, signup cohorts, plan mix, and account-level billing.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts_base
      name: Account Revenue Base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account
          name: Account
          formula: "[Account Name]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: acquisition
          name: Acquisition Source
          formula: "[Acquisition Source]"
    - id: kpi_billed
      name: Lifetime Billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: value
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_avg
      name: Billed per Account
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Average Billed per Account
          formula: "[Average Billed per Account]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: billed_by_signup
      name: Billed by Signup Cohort
      kind: line-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: month
          name: Signup Month
          formula: DateTrunc("month", [Signup Date])
        - id: billed
          name: Lifetime Billed
          formula: Sum([Total Billed])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - billed
    - id: plan_mix
      name: Billed by Current Plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Total Billed
          formula: Sum([Total Billed])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: plan
        sort:
          by: billed
          direction: descending
      yAxis:
        columnIds:
          - billed
      limit: 10
    - id: account_detail
      name: Account Revenue Detail
      kind: table
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: account
          name: Account
        - id: signup_date
          name: Signup Date
        - id: plan
          name: Current Plan
        - id: status
          name: Status
        - id: total_billed
          name: Total Billed
          format:
            kind: currency
            decimals: 2
        - id: region
          name: Region
        - id: acquisition
          name: Acquisition Source
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
  pages:
    - id: growth
      name: Growth Overview
      elements:
        - kpi_billed
        - kpi_accounts
        - kpi_avg
        - billed_by_signup
        - plan_mix
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="growth">
      <Element elementId="kpi_billed" gridColumn="1 / 9" gridRow="1 / 5"/>
      <Element elementId="kpi_accounts" gridColumn="9 / 17" gridRow="1 / 5"/>
      <Element elementId="kpi_avg" gridColumn="17 / 25" gridRow="1 / 5"/>
      <Element elementId="billed_by_signup" gridColumn="1 / 13" gridRow="5 / 14"/>
      <Element elementId="plan_mix" gridColumn="13 / 25" gridRow="5 / 14"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="14 / 26"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
