workbookId: retail-sales-products-2
name: Retail Sales & Products
description: Sales performance overview and product revenue ranking, using the certified Retail model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: sales_base
      name: Sales base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: order_id
          name: Order ID
          formula: "[Orders/Order ID]"
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: product_name
          name: Product Name
          formula: "[Product/Product Name]"
      filters:
        - id: completed
          kind: formula
          formula: '[Status] = "Completed"'
    - id: f_order_date
      kind: control
      controlId: order_date_range
      controlType: date-range
      label: Order date range
      value:
        start: 2024-09-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: f_order_date_products
      kind: control
      controlId: order_date_range_products
      controlType: date-range
      label: Order date range
      value:
        start: 2024-09-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: kpi_revenue
      name: Total revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: value
    - id: kpi_orders
      name: Order count
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: value
    - id: kpi_aov
      name: Average order value
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Avg Order Value
          formula: "[Avg Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_margin
      name: Gross margin
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: revenue_trend
      name: Monthly revenue
      kind: line-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: month
          name: Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: sales_channel
      name: Revenue by channel
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top products by revenue
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
    - id: product_detail
      name: Product sales detail
      kind: table
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_product
          groupBy:
            - product
          calculations:
            - revenue
          sort:
            - columnId: revenue
              direction: descending
      limit: 50
  pages:
    - id: overview
      name: Overview
      elements:
        - f_order_date
        - kpi_revenue
        - kpi_orders
        - kpi_aov
        - kpi_margin
        - revenue_trend
        - sales_channel
    - id: products
      name: Products
      elements:
        - f_order_date_products
        - top_products
        - product_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - sales_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_order_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_orders" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_aov" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_margin" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="revenue_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="sales_channel" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="products">
      <Element elementId="f_order_date_products" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="3 / 12"/>
      <Element elementId="product_detail" gridColumn="1 / 25" gridRow="12 / 24"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="sales_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
