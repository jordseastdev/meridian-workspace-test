workbookId: customer-orders-9
name: Customer Orders
description: Browse customers and inspect their orders in a drawer.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_list
      name: Customers
      kind: table
      actions:
        - id: show_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: picked_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: customer_orders
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer Name
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: region
          name: Region
          formula: "[Customer Region]"
      order:
        - customer_name
        - segment
        - region
    - id: picked_customer
      kind: control
      controlId: picked_customer
      controlType: text
      label: Selected customer
      filters:
        - source:
            kind: table
            elementId: customer_order_lines
          columnId: customer_id
    - id: customer_order_lines
      name: Orders for selected customer
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
      sort:
        - columnId: order_date
          direction: descending
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customer_orders">
      <Element elementId="picked_customer" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="customer_order_lines" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
  overlays:
    - id: customer_orders
      kind: drawer
      title: Customer Orders
      elements:
        - picked_customer
        - customer_order_lines
  settings:
    theme:
      preset: daylight
      palette: meridian
