workbookId: saas-churn-dashboard-5
name: SaaS Account Churn Dashboard
description: Review churned, at-risk, and healthy SaaS accounts.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts_base
      name: Accounts Base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: churn_reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: unpaid_invoice_count
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
    - id: churned_count
      name: Churned Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: v
          name: Accounts
          formula: Count()
      filters:
        - id: churned
          kind: formula
          formula: "[Churned Date] != null"
      value:
        columnId: v
    - id: churned_reason
      name: Churn by Reason
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: accounts
          name: Accounts
          formula: Count()
      filters:
        - id: churned
          kind: formula
          formula: "[Churned Date] != null"
      xAxis:
        columnId: reason
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
      limit: 10
    - id: churned_accounts
      name: Churned Account Details
      kind: table
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: account
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: date
          name: Churned Date
          formula: "[Churned Date]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
      filters:
        - id: churned
          kind: formula
          formula: "[Churned Date] != null"
      sort:
        - columnId: date
          direction: descending
      limit: 500
    - id: risk_count
      name: At-Risk Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: v
          name: Accounts
          formula: Count()
      filters:
        - id: active
          kind: formula
          formula: "[Churned Date] = null"
        - id: quiet
          kind: formula
          formula: '[Last Feature Use Date] < "2025-09-27"'
        - id: unpaid
          kind: formula
          formula: "[Unpaid Invoice Count] > 0"
      value:
        columnId: v
    - id: risk_accounts
      name: At-Risk Account Details
      kind: table
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: account
          name: Account
          formula: "[Account Name]"
        - id: owner
          name: Region
          formula: "[Region]"
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: last_use
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: adopted
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: unpaid
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
      filters:
        - id: active
          kind: formula
          formula: "[Churned Date] = null"
        - id: quiet
          kind: formula
          formula: '[Last Feature Use Date] < "2025-09-27"'
        - id: unpaid
          kind: formula
          formula: "[Unpaid Invoice Count] > 0"
      sort:
        - columnId: last_use
          direction: ascending
      limit: 500
    - id: healthy_count
      name: Healthy Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: v
          name: Accounts
          formula: Count()
      filters:
        - id: active
          kind: formula
          formula: "[Churned Date] = null"
        - id: recent
          kind: formula
          formula: '[Last Feature Use Date] >= "2025-09-27"'
        - id: paid
          kind: formula
          formula: "[Unpaid Invoice Count] = 0"
      value:
        columnId: v
    - id: healthy_plan
      name: Healthy Accounts by Plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: Count()
      filters:
        - id: active
          kind: formula
          formula: "[Churned Date] = null"
        - id: recent
          kind: formula
          formula: '[Last Feature Use Date] >= "2025-09-27"'
        - id: paid
          kind: formula
          formula: "[Unpaid Invoice Count] = 0"
      xAxis:
        columnId: plan
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
      limit: 10
    - id: healthy_accounts
      name: Healthy Account Details
      kind: table
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: account
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: last_use
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: adopted
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
      filters:
        - id: active
          kind: formula
          formula: "[Churned Date] = null"
        - id: recent
          kind: formula
          formula: '[Last Feature Use Date] >= "2025-09-27"'
        - id: paid
          kind: formula
          formula: "[Unpaid Invoice Count] = 0"
      sort:
        - columnId: last_use
          direction: descending
      limit: 500
    - id: signup_plan_filter
      kind: control
      controlId: signup_plan
      controlType: list
      label: Plan
      filters:
        - source:
            kind: table
            elementId: accounts_base
          columnId: current_plan
    - id: signups_by_month
      name: Signups by Month
      kind: line-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: signup_month
          name: Signup Month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: Count()
      filters:
        - id: valid_signup_date
          kind: formula
          formula: "[Signup Date] != null"
      xAxis:
        columnId: signup_month
        sort:
          by: signup_month
          direction: ascending
      yAxis:
        columnIds:
          - signups
  pages:
    - id: churned
      name: Churned Accounts
      elements:
        - churned_count
        - churned_reason
        - churned_accounts
    - id: at_risk
      name: At-Risk Accounts
      elements:
        - risk_count
        - risk_accounts
    - id: healthy
      name: Healthy Accounts
      elements:
        - healthy_count
        - healthy_plan
        - healthy_accounts
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts_base
    - id: signups
      name: Signups
      elements:
        - signup_plan_filter
        - signups_by_month
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="churned">
      <Element elementId="churned_count" gridColumn="1 / 25" gridRow="1 / 5"/>
      <Element elementId="churned_reason" gridColumn="1 / 25" gridRow="5 / 14"/>
      <Element elementId="churned_accounts" gridColumn="1 / 25" gridRow="14 / 26"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="at_risk">
      <Element elementId="risk_count" gridColumn="1 / 25" gridRow="1 / 5"/>
      <Element elementId="risk_accounts" gridColumn="1 / 25" gridRow="5 / 17"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="healthy">
      <Element elementId="healthy_count" gridColumn="1 / 25" gridRow="1 / 5"/>
      <Element elementId="healthy_plan" gridColumn="1 / 25" gridRow="5 / 14"/>
      <Element elementId="healthy_accounts" gridColumn="1 / 25" gridRow="14 / 26"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="signups">
      <Element elementId="signup_plan_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="signups_by_month" gridColumn="1 / 25" gridRow="3 / 12"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
