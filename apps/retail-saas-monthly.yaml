workbookId: retail-saas-monthly
name: Retail Revenue & SaaS MRR
description: Monthly retail revenue and SaaS MRR trends shown side by side.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: retail_base
      name: Retail Monthly Source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: monthly
          groupBy:
            - order_month
          calculations:
            - revenue
    - id: saas_base
      name: SaaS Account Source
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: last_invoice_date
          name: Invoice Month
          formula: DateTrunc("month", [Last Invoice Date])
        - id: mrr
          name: SaaS MRR
          formula: SafeDivide(Sum([Total Billed]), 12)
          format:
            kind: currency
            decimals: 2
      groupings:
        - id: monthly
          groupBy:
            - last_invoice_date
          calculations:
            - mrr
    - id: retail_date
      kind: control
      controlId: retail_date
      controlType: date-range
      label: Retail date range
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: retail_base
          columnId: order_month
    - id: saas_date
      kind: control
      controlId: saas_date
      controlType: date-range
      label: SaaS date range
      value:
        start: 2022-04-01
        end: 2025-09-01
      filters:
        - source:
            kind: table
            elementId: saas_base
          columnId: last_invoice_date
    - id: retail_monthly
      name: Retail Revenue by Month
      kind: line-chart
      source:
        kind: table
        elementId: retail_base
        groupingId: monthly
      columns:
        - id: month
          name: Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: saas_monthly
      name: SaaS MRR by Month
      kind: line-chart
      source:
        kind: table
        elementId: saas_base
        groupingId: monthly
      columns:
        - id: month
          name: Month
          formula: "[Invoice Month]"
        - id: mrr
          name: MRR
          formula: "[SaaS MRR]"
          format:
            kind: currency
            decimals: 2
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - mrr
  pages:
    - id: overview
      name: Monthly Comparison
      elements:
        - retail_date
        - saas_date
        - retail_monthly
        - saas_monthly
    - id: data
      name: Data
      visibility: hidden
      elements:
        - retail_base
        - saas_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="retail_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="saas_date" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="retail_monthly" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="saas_monthly" gridColumn="13 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="retail_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="saas_base" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
