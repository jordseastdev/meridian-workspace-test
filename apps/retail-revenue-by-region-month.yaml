workbookId: retail-revenue-by-region-month
name: Retail Revenue by Region and Month
description: Revenue summarized by store region and order month.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: month
          name: Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      visibleAsSource: true
    - id: region_month_revenue
      name: Revenue by Region and Month
      kind: pivot-table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: month
          name: Month
          formula: "[Month]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      rowsBy:
        - columnId: region
      columnsBy:
        - columnId: month
      values:
        - revenue
      showTotals: true
  pages:
    - id: pivot
      name: Revenue Pivot
      elements:
        - region_month_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="pivot">
      <Element elementId="region_month_revenue" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
