workbookId: support-ticket-triage-6
name: Support Ticket Triage
description: Mobile-friendly support queue and ticket performance analytics.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_base
      name: Ticket records
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: channel
          name: Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: status
          name: Status
          formula: "[Support Tickets/Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
      visibleAsSource: true
    - id: date_filter
      kind: control
      controlId: opened_range
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: opened_at
    - id: priority_filter
      kind: control
      controlId: priority
      controlType: list
      label: Priority
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: priority
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Ticket Assistant
      appearance: filled
      icon: sparkles
    - id: open_count
      name: Open tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: value
          name: Open tickets
          formula: CountDistinct([Ticket ID])
      filters:
        - id: only_open
          kind: formula
          formula: '[Status] = "Open"'
      value:
        columnId: value
    - id: ticket_queue
      name: Open ticket queue
      kind: table
      actions:
        - id: ticket_details
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: channel
          name: Channel
        - id: agent
          name: Agent
      filters:
        - id: only_open_queue
          kind: formula
          formula: '[Status] = "Open"'
      sort:
        - columnId: opened_at
          direction: descending
      limit: 100
      rowActions:
        - id: assign_to_me
          text: Assign to me
          appearance: outline
          icon: assign
          effects:
            - effect: notify
              message: Assignment requires a writeback field; the source ticket is read-only.
              level: info
        - id: close_ticket
          text: Close
          appearance: danger
          icon: archive
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: notify
              message: Ticket source is read-only; close was not recorded.
              level: warning
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - opened_at
          - channel
          - agent
    - id: total_tickets
      name: Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: value
          name: Tickets
          formula: "[Ticket Count]"
      value:
        columnId: value
    - id: median_response
      name: Median first response
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: value
          name: Median minutes
          formula: "[Median First Response (min)]"
          format:
            kind: number
            decimals: 0
      value:
        columnId: value
    - id: by_category
      name: Tickets by category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: category
          name: Category
        - id: count
          name: Tickets
          formula: "[Ticket Count]"
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      limit: 10
    - id: by_priority
      name: Tickets by priority
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: priority
          name: Priority
        - id: count
          name: Tickets
          formula: "[Ticket Count]"
      xAxis:
        columnId: priority
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
    - id: resolution_trend
      name: Average resolution time over time
      kind: line-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Opened At])
        - id: hours
          name: Avg Resolution Hours
          formula: Avg([Resolution Hours])
          format:
            kind: number
            decimals: 1
      filters:
        - id: resolved_only
          kind: formula
          formula: IsNotNull([Resolution Hours])
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - hours
    - id: selected_ticket
      kind: control
      controlId: selected_ticket
      controlType: text
      label: Selected ticket
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: ticket_id
    - id: ticket_details
      name: Ticket details
      kind: table
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: status
          name: Status
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: channel
          name: Contact Channel
        - id: agent
          name: Agent
        - id: first_response
          name: First Response Minutes
        - id: resolution_hours
          name: Resolution Hours
      filters:
        - id: selected
          kind: formula
          formula: "[Ticket ID] = [selected_ticket]"
      limit: 1
    - id: assistant
      kind: agent
      agentId: ticket-triage-assistant-2
      placeholder: Ask about ticket volume, priority, categories, response and resolution times.
      height: 700
  pages:
    - id: queue
      name: Queue
      elements:
        - date_filter
        - priority_filter
        - ask_button
        - open_count
        - ticket_queue
    - id: analytics
      name: Analytics
      elements:
        - date_filter
        - priority_filter
        - total_tickets
        - median_response
        - by_category
        - by_priority
        - resolution_trend
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="open_count" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="ticket_queue" gridColumn="1 / 25" gridRow="7 / 19"/>
      <Element elementId="ticket_base" gridColumn="1 / 25" gridRow="19 / 31"/>
      <Element elementId="selected_ticket" gridColumn="1 / 7" gridRow="31 / 33"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="total_tickets" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="median_response" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="by_category" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="by_priority" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="resolution_trend" gridColumn="1 / 25" gridRow="16 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_drawer">
      <Element elementId="ticket_details" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Ticket Assistant
      size: large
      elements:
        - assistant
    - id: ticket_drawer
      kind: drawer
      title: Ticket details
      size: large
      elements:
        - ticket_details
  settings:
    theme:
      preset: daylight
      palette: meridian
