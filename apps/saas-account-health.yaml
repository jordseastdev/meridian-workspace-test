workbookId: saas-account-health
name: SaaS Account Health
description: Account-level health overview with adoption, billing, and an assistant for account questions.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account Base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: acquisition_source
          name: Acquisition Source
          formula: "[Acquisition Source]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: adopted_features
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: paid_invoices
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
      visibleAsSource: true
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: region
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Status
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: status
    - id: plan_filter
      kind: control
      controlId: plan
      controlType: list
      label: Current Plan
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: current_plan
    - id: signup_filter
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup Date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: signup_date
    - id: ask_button
      kind: button
      actions:
        - id: open_account_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: ask_account_drawer
      text: Ask Account Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total Billed
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_adoption
      name: Feature Adoption
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Feature Adoption
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: kpi_paid
      name: Paid Invoice Rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: health_by_status
      name: Accounts by Status
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
    - id: adoption_by_plan
      name: Feature Adoption by Current Plan
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: adoption
          name: Feature Adoption
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: current_plan
        sort:
          by: adoption
          direction: descending
      yAxis:
        columnIds:
          - adoption
    - id: account_detail
      name: Account Health Detail
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: adopted_features
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Records
          formula: "[Feature Record Count]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: unpaid_invoices
          name: Unpaid Invoices
          formula: "[Unpaid Invoice Count]"
        - id: last_feature_use
          name: Last Feature Use
          formula: "[Last Feature Use Date]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
    - id: account_assistant
      kind: agent
      agentId: saas-account-assistant
      placeholder: Ask about account health, adoption, billing, or a specific account.
      height: 720
  pages:
    - id: overview
      name: Account Health
      elements:
        - region_filter
        - status_filter
        - plan_filter
        - signup_filter
        - ask_button
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - health_by_status
        - adoption_by_plan
        - account_detail
    - id: account_data
      name: Data
      visibility: hidden
      elements:
        - account_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="plan_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="signup_filter" gridColumn="19 / 25" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="1 / 5" gridRow="3 / 5"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="5 / 9"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="5 / 9"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="5 / 9"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="5 / 9"/>
      <Element elementId="health_by_status" gridColumn="1 / 13" gridRow="9 / 18"/>
      <Element elementId="adoption_by_plan" gridColumn="13 / 25" gridRow="9 / 18"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="18 / 30"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="account_data">
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ask_account_drawer">
      <Element elementId="account_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ask_account_drawer
      kind: drawer
      title: Account Assistant
      size: large
      elements:
        - account_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
