workbookId: revenue-year-over-year
name: Revenue This Year vs Last Year
description: Compare monthly net revenue for the selected year with the prior year, with headline revenue and year-over-year change.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: monthly_data
      name: Monthly revenue comparison
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: year
          name: Year
          formula: DatePart("year", [Order Month])
        - id: month_number
          name: Month Number
          formula: DatePart("month", [Order Month])
        - id: revenue
          name: Revenue
          formula: Sum([Orders/Revenue])
          format:
            kind: currency
            decimals: 0
      filters:
        - id: completed
          kind: formula
          formula: '[Status] = "Completed"'
      groupings:
        - id: by_month
          groupBy:
            - order_month
            - year
            - month_number
          calculations:
            - revenue
    - id: fiscal_year
      kind: control
      controlId: fiscal_year
      controlType: number
      label: Comparison year
      value: 2025
      low: 2023
      high: 2025
      step: 1
    - id: revenue_this_year
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: monthly_data
        groupingId: by_month
      columns:
        - id: value
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: selected_year
          kind: formula
          formula: "[Year] = [fiscal_year]"
      value:
        columnId: value
    - id: revenue_last_year
      name: Revenue last year
      kind: kpi-chart
      source:
        kind: table
        elementId: monthly_data
        groupingId: by_month
      columns:
        - id: value
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: prior_year
          kind: formula
          formula: "[Year] = [fiscal_year] - 1"
      value:
        columnId: value
    - id: revenue_change
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: monthly_data
        groupingId: by_month
      columns:
        - id: current_revenue
          name: This year revenue
          formula: SumIf([Revenue], [Year] = [fiscal_year])
          format:
            kind: currency
            decimals: 0
        - id: prior_revenue
          name: Last year revenue
          formula: SumIf([Revenue], [Year] = [fiscal_year] - 1)
          format:
            kind: currency
            decimals: 0
        - id: change_pct
          name: Change vs last year
          formula: SafeDivide([This year revenue] - [Last year revenue], [Last year revenue])
          format:
            kind: percent
            decimals: 1
      value:
        columnId: change_pct
    - id: monthly_comparison
      name: Monthly revenue by year
      kind: line-chart
      source:
        kind: table
        elementId: monthly_data
        groupingId: by_month
      columns:
        - id: month_number
          name: Month
          formula: "[Month Number]"
        - id: year
          name: Year
          formula: "[Year]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: selected_years
          kind: formula
          formula: "[Year] = [fiscal_year] or [Year] = [fiscal_year] - 1"
      xAxis:
        columnId: month_number
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
  pages:
    - id: overview
      name: Revenue Overview
      elements:
        - fiscal_year
        - revenue_this_year
        - revenue_last_year
        - revenue_change
        - monthly_comparison
    - id: data
      name: Data
      visibility: hidden
      elements:
        - monthly_data
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="fiscal_year" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="revenue_this_year" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="revenue_last_year" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="revenue_change" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_comparison" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="monthly_data" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
