workbookId: saas-growth-command-center
name: SaaS Growth Command Center
description: Executive view of recurring revenue, customer growth, and MRR movement across the SaaS business.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: f_month
      kind: control
      controlId: month_range
      controlType: date-range
      label: Month range
      value:
        mode: last
        value: 12
        unit: month
      filters:
        - source:
            kind: table
            elementId: mrr_base
          columnId: month
    - id: mrr_base
      name: Monthly revenue base
      kind: table
      source:
        kind: data-model
        dataModelId: saas
        elementId: mrr_monthly
      columns:
        - id: month
          name: Month
          formula: "[Month]"
        - id: plan
          name: Plan
          formula: "[Plan]"
        - id: mrr
          name: MRR
          formula: "[MRR]"
        - id: arr
          name: ARR
          formula: "[ARR]"
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
    - id: kpi_mrr
      name: Total MRR
      kind: kpi-chart
      source:
        kind: table
        elementId: mrr_base
      columns:
        - id: v
          name: MRR
          formula: "[Total MRR]"
      value:
        columnId: v
    - id: kpi_arr
      name: Total ARR
      kind: kpi-chart
      source:
        kind: table
        elementId: mrr_base
      columns:
        - id: v
          name: ARR
          formula: "[Total ARR]"
      value:
        columnId: v
    - id: kpi_customers
      name: Paying Customers
      kind: kpi-chart
      source:
        kind: table
        elementId: mrr_base
      columns:
        - id: v
          name: Paying Customers
          formula: "[Paying Customers]"
      value:
        columnId: v
    - id: trend_mrr
      name: MRR trend
      kind: line-chart
      source:
        kind: table
        elementId: mrr_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Month])
        - id: mrr
          name: MRR
          formula: "[Total MRR]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - mrr
    - id: movement_mix
      name: MRR movements
      kind: bar-chart
      source:
        kind: data-model
        dataModelId: saas
        elementId: mrr_movements
      columns:
        - id: movement_type
          name: Movement Type
          formula: "[Movement Type]"
        - id: amount
          name: Net New MRR
          formula: "[Net New MRR]"
      xAxis:
        columnId: movement_type
        sort:
          by: amount
          direction: descending
      yAxis:
        columnIds:
          - amount
      orientation: horizontal
    - id: segment_mrr
      name: MRR by plan
      kind: bar-chart
      source:
        kind: table
        elementId: mrr_base
      columns:
        - id: plan
          name: Plan
          formula: "[Plan]"
        - id: mrr
          name: MRR
          formula: "[Total MRR]"
      xAxis:
        columnId: plan
        sort:
          by: mrr
          direction: descending
      yAxis:
        columnIds:
          - mrr
  pages:
    - id: overview
      name: Growth overview
      elements:
        - f_month
        - kpi_mrr
        - kpi_arr
        - kpi_customers
        - trend_mrr
        - movement_mix
        - segment_mrr
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_month" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_mrr" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_arr" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_customers" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="trend_mrr" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="movement_mix" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="segment_mrr" gridColumn="1 / 25" gridRow="16 / 25"/>
      <Element elementId="mrr_base" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
