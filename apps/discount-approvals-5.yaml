workbookId: discount-approvals-5
name: Discount Approvals
description: Sales manager queue to review pending discount requests, with request analytics and an assistant.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Discount Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
      filters:
        - id: pending
          kind: list
          columnId: status
          mode: include
          values:
            - Pending
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: region
    - id: stage_filter
      kind: control
      controlId: stage
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: stage
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Discount Assistant
      appearance: filled
      icon: sparkles
    - id: deal_cards
      name: Pending Discount Requests
      kind: input-table
      actions:
        - id: show_deal
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_deal
              value:
                type: selection
                columnId: deal_id
            - effect: open-overlay
              overlayId: deal_drawer
      inputMode: edit
      source:
        kind: linked
        from: deals_base
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          key: deal_id
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: note
          name: Rejection Note
          type: text
          multiline: true
        - id: reviewed_by
          name: Reviewed By
          type: text
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: datetime
          readOnly: true
      rowActions:
        - id: approve
          text: Approve
          appearance: filled
          icon: check
          showWhen: IsNull([decision])
          confirm: Approve {{deal_id}}?
          effects:
            - effect: update-rows
              tableElementId: deal_cards
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Approved
                reviewed_by:
                  type: user
                  field: email
                reviewed_at:
                  type: now
            - effect: notify
              message: Request approved
              level: success
        - id: reject
          text: Reject
          appearance: danger
          icon: x
          showWhen: IsNull([decision])
          confirm: Reject {{deal_id}}? Enter a rejection note in the card first.
          effects:
            - effect: update-rows
              tableElementId: deal_cards
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Rejected
                reviewed_by:
                  type: user
                  field: email
                reviewed_at:
                  type: now
            - effect: notify
              message: Request rejected
              level: success
      display: cards
      card:
        title: account
        subtitle: owner
        status: decision
        fields:
          - region
          - stage
          - list_amount
          - submitted_discount
          - age_days
          - note
    - id: decisions
      kind: input-table
      inputMode: edit
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: status
          name: Status
          type: text
          values:
            - Approved
            - Rejected
        - id: note
          name: Rejection Note
          type: text
          multiline: true
        - id: reviewed_by
          name: Reviewed By
          type: text
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: datetime
          readOnly: true
    - id: pending_count
      name: Pending Requests
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: pending
          name: Pending Requests
          formula: CountIf([Status] = "Pending")
      filters:
        - id: count_pending
          kind: formula
          formula: '[Status] = "Pending"'
      value:
        columnId: pending
    - id: deal_details
      name: Selected Deal Details
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: owner_email
          name: Owner Email
          formula: "[Owner Email]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
      filters:
        - id: selected
          kind: formula
          formula: "[Deal ID] = [selected_deal]"
    - id: selected_deal
      kind: control
      controlId: selected_deal
      controlType: text
      label: Selected Deal
      filters:
        - source:
            kind: table
            elementId: deal_details
          columnId: deal_id
    - id: requests_by_region
      name: Requests by Region
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: requests
          name: Requests
          formula: CountDistinct([Deal ID])
      xAxis:
        columnId: region
        sort:
          by: requests
          direction: descending
      yAxis:
        columnIds:
          - requests
    - id: requests_by_stage
      name: Requests by Stage
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: requests
          name: Requests
          formula: CountDistinct([Deal ID])
      xAxis:
        columnId: stage
        sort:
          by: requests
          direction: descending
      yAxis:
        columnIds:
          - requests
    - id: discount_assistant
      kind: agent
      agentId: discount-approvals-assistant-3
      placeholder: Ask about pending requests, owners, regions, or stages.
      height: 600
  pages:
    - id: queue
      name: Approval Queue
      elements:
        - region_filter
        - stage_filter
        - ask_button
        - pending_count
        - deal_cards
    - id: analytics
      name: Analytics
      elements:
        - region_filter
        - stage_filter
        - requests_by_region
        - requests_by_stage
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="pending_count" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="deal_cards" gridColumn="1 / 25" gridRow="7 / 19"/>
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="19 / 31"/>
      <Element elementId="decisions" gridColumn="1 / 25" gridRow="31 / 43"/>
      <Element elementId="selected_deal" gridColumn="1 / 7" gridRow="43 / 45"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="requests_by_region" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="requests_by_stage" gridColumn="13 / 25" gridRow="3 / 12"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="deal_drawer">
      <Element elementId="deal_details" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="discount_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: deal_drawer
      kind: drawer
      title: Deal Details
      size: large
      elements:
        - deal_details
    - id: assistant_drawer
      kind: drawer
      title: Discount Assistant
      size: large
      elements:
        - discount_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
