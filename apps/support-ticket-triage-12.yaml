workbookId: support-ticket-triage-12
name: Support Ticket Triage
description: Triage open support tickets, assign ownership, and close resolved tickets.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets
      name: Support Tickets Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Support Tickets/Customer ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: contact_channel
          name: Contact Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: ticket_status
          name: Ticket Status
          formula: "[Support Tickets/Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
      limit: 500
    - id: ticket_review
      name: Ticket Assignment and Closure
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: tickets
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: checkbox
    - id: f_opened
      kind: control
      controlId: opened_range
      controlType: date-range
      label: Opened date
      value:
        start: 2025-01-01
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: tickets
          columnId: opened_at
    - id: ask_assistant
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Assistant
      appearance: filled
      icon: sparkles
    - id: assistant
      kind: agent
      agentId: support-ticket-triage-assistant
      placeholder: Ask about ticket priorities, backlog, or next steps
      height: 700
    - id: kpi_open
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_review
      columns:
        - id: value
          name: Open Tickets
          formula: CountIf(IsNull([closed]) and [Ticket Status] != "Solved")
      value:
        columnId: value
    - id: kpi_status
      name: Tickets by Status
      kind: bar-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: status
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: category_chart
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#0f766e"
      limit: 10
    - id: ticket_cards
      name: Open Ticket Queue
      kind: table
      actions:
        - id: select_ticket
          trigger: on-select
          effects:
            - effect: open-overlay
              overlayId: ticket_drawer
      source:
        kind: table
        elementId: ticket_review
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: assigned_to
          name: Assigned To
          formula: "[Assigned To]"
      filters:
        - id: pending
          kind: formula
          formula: IsNull([Closed]) and [Ticket Status] != "Solved"
      rowActions:
        - id: assign
          text: Assign
          appearance: outline
          icon: assign
          showWhen: IsNull([Assigned To])
          ask:
            label: Assign to
            placeholder: Name or email
            required: true
          effects:
            - effect: update-rows
              tableElementId: ticket_review
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                assigned_to:
                  type: answer
        - id: close
          text: Close
          appearance: filled
          icon: archive
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_review
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                closed:
                  type: constant
                  value: true
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: priority
        fields:
          - opened_at
          - ticket_status
          - agent
          - assigned_to
    - id: ticket_detail
      name: Ticket Details
      kind: table
      source:
        kind: table
        elementId: tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: agent
          name: Agent
          formula: "[Agent]"
  pages:
    - id: triage
      name: Ticket Triage
      elements:
        - f_opened
        - ask_assistant
        - kpi_open
        - kpi_status
        - category_chart
        - ticket_cards
    - id: data
      name: Data
      visibility: hidden
      elements:
        - tickets
        - ticket_review
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="f_opened" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ask_assistant" gridColumn="7 / 11" gridRow="1 / 3"/>
      <Element elementId="kpi_open" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="kpi_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="category_chart" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="ticket_cards" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="tickets" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_review" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_drawer">
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Support Assistant
      size: large
      elements:
        - assistant
    - id: ticket_drawer
      kind: drawer
      title: Ticket Details
      size: large
      elements:
        - ticket_detail
  settings:
    theme:
      preset: daylight
      palette: meridian
