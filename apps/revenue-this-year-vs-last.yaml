workbookId: revenue-this-year-vs-last
name: Revenue This Year vs Last Year
description: Compare monthly revenue in the current year with the prior year, with year-over-year KPIs.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Orders data
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: years
          kind: formula
          formula: '[Order Date] >= DateAdd("year", -2, DateTrunc("year", Today())) AND [Order Date] < DateTrunc("year", Today())'
    - id: revenue_trend
      name: "Monthly revenue: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
    - id: revenue_kpi
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Revenue
          formula: SumIf([Revenue], [Order Date] >= DateTrunc("year", DateAdd("year", -1, Today())) AND [Order Date] < DateTrunc("year", Today()))
          format:
            kind: currency
            decimals: 0
      filters:
        - id: prior_available_year
          kind: formula
          formula: '[Order Date] >= DateAdd("year", -2, DateTrunc("year", Today())) AND [Order Date] < DateTrunc("year", Today())'
      value:
        columnId: revenue
    - id: revenue_delta_kpi
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Revenue change vs last year
          formula: SafeDivide(SumIf([Revenue], [Order Date] >= DateTrunc("year", DateAdd("year", -1, Today())) AND [Order Date] < DateTrunc("year", Today())) - SumIf([Revenue], [Order Date] >= DateTrunc("year", DateAdd("year", -2, Today())) AND [Order Date] < DateTrunc("year", DateAdd("year", -1, Today()))), SumIf([Revenue], [Order Date] >= DateTrunc("year", DateAdd("year", -2, Today())) AND [Order Date] < DateTrunc("year", DateAdd("year", -1, Today()))))
          format:
            kind: percent
            decimals: 1
      filters:
        - id: prior_available_year
          kind: formula
          formula: '[Order Date] >= DateAdd("year", -2, DateTrunc("year", Today())) AND [Order Date] < DateTrunc("year", Today())'
      value:
        columnId: revenue
  pages:
    - id: overview
      name: Revenue comparison
      elements:
        - revenue_trend
        - revenue_kpi
        - revenue_delta_kpi
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="revenue_trend" gridColumn="1 / 25" gridRow="1 / 10"/>
      <Element elementId="revenue_kpi" gridColumn="1 / 13" gridRow="10 / 14"/>
      <Element elementId="revenue_delta_kpi" gridColumn="13 / 25" gridRow="10 / 14"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
