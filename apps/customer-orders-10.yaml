workbookId: customer-orders-10
name: Customer Orders
description: Customer directory with a customer order drill-down drawer.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_list
      name: Customers
      kind: table
      actions:
        - id: show_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: orders_drawer
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: region
          name: Region
          formula: "[Customer Region]"
      limit: 500
    - id: orders_base
      name: Customer Orders Data
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      sort:
        - columnId: order_date
          direction: descending
    - id: selected_customer_control
      kind: control
      controlId: selected_customer
      controlType: text
      label: Selected customer
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: customer_id
    - id: customer_orders
      name: Orders
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_id
          name: Order ID
        - id: order_date
          name: Order Date
        - id: channel
          name: Channel
        - id: status
          name: Status
        - id: quantity
          name: Quantity
        - id: revenue
          name: Revenue
          format:
            kind: currency
            decimals: 0
      sort:
        - columnId: order_date
          direction: descending
      limit: 200
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="orders_drawer">
      <Element elementId="selected_customer_control" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="customer_orders" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
  overlays:
    - id: orders_drawer
      kind: drawer
      title: Customer orders
      elements:
        - selected_customer_control
        - customer_orders
  settings:
    theme:
      preset: daylight
      palette: meridian
