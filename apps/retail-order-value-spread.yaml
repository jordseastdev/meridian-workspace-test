workbookId: retail-order-value-spread
name: Order Value Spread by Channel
description: Box plot of individual order-line net values by sales channel.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: channel_filter
      name: Channel
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      value:
        - Online
        - In Store
        - Mobile
        - Marketplace
      source:
        kind: source
        source:
          kind: table
          elementId: orders_base
        columnId: channel
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: channel
    - id: orders_base
      name: Order line values
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: order_value
          name: Order Value
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 2
      visibleAsSource: true
    - id: order_values
      name: Order Value Distribution by Channel
      kind: box-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      color:
        by: single
        value: "#4661c9"
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: overview
      name: Order Value Spread
      elements:
        - channel_filter
        - order_values
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="channel_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="order_values" gridColumn="1 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
