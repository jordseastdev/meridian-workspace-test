workbookId: revenue-year-over-year-3
name: Revenue This Year vs Last Year
description: Monthly revenue comparison for the current year and prior year, with KPIs showing year-over-year change.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
      filters:
        - id: completed_only
          kind: formula
          formula: '[Status] = "Completed"'
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date range
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: revenue_this_year
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      filters:
        - id: this_year
          kind: formula
          formula: DatePart("year", [Order Date]) = 2025
      value:
        columnId: v
      comparison:
        period: previous-period
        label: vs last year
      trend:
        columnId: m
    - id: revenue_last_year
      name: Revenue last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      filters:
        - id: last_year
          kind: formula
          formula: DatePart("year", [Order Date]) = 2024
      value:
        columnId: v
    - id: revenue_change
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue change
          formula: SafeDivide(SumIf([Revenue], DatePart("year", [Order Date]) = 2025) - SumIf([Revenue], DatePart("year", [Order Date]) = 2024), SumIf([Revenue], DatePart("year", [Order Date]) = 2024))
          format:
            kind: percent
            decimals: 1
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: v
      trend:
        columnId: m
    - id: monthly_revenue
      name: Monthly revenue by year
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      filters:
        - id: comparison_years
          kind: formula
          formula: DatePart("year", [Order Date]) >= 2024 and DatePart("year", [Order Date]) <= 2025
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
  pages:
    - id: overview
      name: Revenue Overview
      elements:
        - date_filter
        - revenue_this_year
        - revenue_last_year
        - revenue_change
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="revenue_this_year" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="revenue_last_year" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="revenue_change" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
