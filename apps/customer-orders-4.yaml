workbookId: customer-orders-4
name: Customer Orders
description: Browse customers and open a drawer to see their order lines.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_base
      name: Customer base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: loyalty_tier
          name: Loyalty Tier
          formula: "[Loyalty Tier]"
        - id: region
          name: Region
          formula: "[Customer Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
    - id: orders_base
      name: Order base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Units
          formula: "[Quantity]"
        - id: unit_price
          name: Unit Price
          formula: "[Unit Price]"
          format:
            kind: currency
            decimals: 2
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: cost
          name: Cost
          formula: "[Cost]"
          format:
            kind: currency
            decimals: 2
        - id: profit
          name: Profit
          formula: "[Profit]"
          format:
            kind: currency
            decimals: 2
    - id: customer_list
      name: Customers
      description: Select a customer to open their order history.
      kind: table
      actions:
        - id: view_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: orders_drawer
      source:
        kind: table
        elementId: customer_base
      columns:
        - id: customer_id
          name: Customer ID
        - id: customer_name
          name: Customer
        - id: segment
          name: Segment
        - id: loyalty_tier
          name: Loyalty Tier
        - id: region
          name: Region
        - id: signup_date
          name: Signup Date
      sort:
        - columnId: customer_name
          direction: ascending
      limit: 500
    - id: customer_orders
      name: Orders
      description: Order lines for the selected customer.
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_id
          name: Order ID
        - id: order_date
          name: Order Date
        - id: channel
          name: Channel
        - id: status
          name: Status
        - id: quantity
          name: Units
        - id: unit_price
          name: Unit Price
          format:
            kind: currency
            decimals: 2
        - id: revenue
          name: Revenue
          format:
            kind: currency
            decimals: 2
        - id: cost
          name: Cost
          format:
            kind: currency
            decimals: 2
        - id: profit
          name: Profit
          format:
            kind: currency
            decimals: 2
      filters:
        - id: selected_customer_filter
          kind: formula
          formula: "[Customer ID] = [selected_customer]"
    - id: selected_customer_control
      kind: control
      controlId: selected_customer
      controlType: text
      label: Selected customer
      value: ""
  pages:
    - id: customers
      name: Customers
      elements:
        - selected_customer_control
        - customer_list
    - id: data
      name: Data
      visibility: hidden
      elements:
        - customer_base
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="selected_customer_control" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="customer_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="orders_drawer">
      <Element elementId="customer_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
  overlays:
    - id: orders_drawer
      kind: drawer
      title: Customer Orders
      elements:
        - customer_orders
  settings:
    theme:
      preset: daylight
      palette: meridian
