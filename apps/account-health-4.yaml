workbookId: account-health-4
name: Account Health
description: Account-level overview of customer lifecycle, feature adoption, billing and account details, with an assistant for account questions.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account-level health data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: adopted_features
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: adoption_rate
          name: Adoption Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: paid_invoice_count
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
        - id: paid_rate
          name: Paid Invoice Rate
          formula: SafeDivide([Paid Invoice Count], [Invoice Count])
          format:
            kind: percent
            decimals: 1
        - id: last_feature_use
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: last_paid_date
          name: Last Paid Date
          formula: "[Last Paid Date]"
      visibleAsSource: true
    - id: f_region
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: region
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Account status
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: status
    - id: f_signup
      kind: control
      controlId: signup_date_filter
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: signup_date
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Account Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: v
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: v
    - id: kpi_adoption
      name: Feature adoption
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: v
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: health_by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
    - id: adoption_by_plan
      name: Feature adoption by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: adoption
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: plan
        sort:
          by: adoption
          direction: descending
      yAxis:
        columnIds:
          - adoption
    - id: account_detail
      name: Account health details
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: adoption_rate
          name: Adoption Rate
          formula: SafeDivide([Adopted Feature Count], [Feature Record Count])
          format:
            kind: percent
            decimals: 1
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: last_feature_use
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
      sort:
        - columnId: billed
          direction: descending
      limit: 100
    - id: account_assistant
      kind: agent
      agentId: account-health-assistant
      placeholder: Ask about an account, adoption, billing, or lifecycle health.
      height: 640
  pages:
    - id: overview
      name: Account Health
      elements:
        - f_region
        - f_status
        - f_signup
        - ask_button
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - health_by_status
        - adoption_by_plan
        - account_detail
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_region" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_signup" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="19 / 23" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="health_by_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="adoption_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="16 / 28"/>
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="28 / 40"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="account_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Account Assistant
      size: large
      elements:
        - account_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
