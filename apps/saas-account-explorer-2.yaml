workbookId: saas-account-explorer-2
name: SaaS Account Explorer
description: Explore account-level SaaS lifecycle, billing, and feature adoption.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted_features
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Records
          formula: "[Feature Record Count]"
        - id: paid_invoices
          name: Paid Invoices
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
    - id: f_signup
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: signup_date
    - id: f_region
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: region
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Account status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: kpi_accounts
      name: Account share
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Account Count
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
      value:
        columnId: value
    - id: kpi_adoption
      name: Adopted feature rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: accounts_by_plan
      name: Accounts by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: plan
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
      color:
        by: single
        value: "#4661c9"
    - id: account_detail
      name: Account details
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted_features
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: paid_invoices
          name: Paid Invoices
          formula: "[Paid Invoice Count]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
  pages:
    - id: overview
      name: Overview
      elements:
        - f_signup
        - f_region
        - f_status
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - account_detail
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_signup" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_region" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="7 / 19"/>
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="19 / 31"/>
      <Element elementId="accounts_by_plan" gridColumn="1 / 25" gridRow="31 / 40"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
