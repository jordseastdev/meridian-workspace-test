workbookId: discount-request-review
name: Discount Request Review
description: Managers review open discount requests and record an approval or rejection with a note.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Discount requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
      filters:
        - id: open_only
          kind: list
          columnId: status
          mode: include
          values:
            - Open
    - id: request_queue
      name: Open discount requests
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: list_amount
          name: List Amount
        - id: submitted_discount
          name: Submitted Discount
        - id: age_days
          name: Age Days
      sort:
        - columnId: age_days
          direction: descending
      limit: 100
    - id: decision_form
      name: Record decision
      kind: input-table
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Manager Note
          type: text
          multiline: true
          required: true
        - id: reviewer
          name: Reviewer
          type: text
          default:
            kind: user
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: datetime
          default:
            kind: now
          readOnly: true
  pages:
    - id: review
      name: Review Requests
      elements:
        - request_queue
        - decision_form
    - id: helpers
      name: Helpers
      visibility: hidden
      elements:
        - deals_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="request_queue" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="decision_form" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="helpers">
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
