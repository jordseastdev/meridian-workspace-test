workbookId: revenue-region-channel
name: Revenue by Region & Channel
description: Explore net revenue across sales regions and channels, with an order-date filter.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: date_filter
      kind: control
      controlId: order_date_filter
      controlType: date-range
      label: Order date
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: orders_base
      name: Orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
    - id: revenue_region
      name: Revenue by Region
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: region
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
    - id: revenue_channel
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
    - id: region_channel
      name: Revenue by Region and Channel
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_region_channel
          groupBy:
            - region
            - channel
          calculations:
            - revenue
          sort:
            - columnId: revenue
              direction: descending
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - revenue_region
        - revenue_channel
        - region_channel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="revenue_region" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="revenue_channel" gridColumn="13 / 25" gridRow="3 / 12"/>
      <Element elementId="region_channel" gridColumn="1 / 25" gridRow="12 / 24"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
