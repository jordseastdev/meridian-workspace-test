workbookId: saas-account-overview-3
name: SaaS Account Overview
description: Explore SaaS account lifecycle, billing, feature adoption, and account-level details.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Filtered account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted_features
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid_invoices
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
    - id: f_region
      kind: control
      controlId: region
      controlType: list
      label: Region
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: region
    - id: f_status
      kind: control
      controlId: status
      controlType: list
      label: Account status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: status
    - id: f_signup
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: signup_date
    - id: k_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: k_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Total billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: k_adoption
      name: Adopted feature rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Adopted feature rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: k_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Paid invoice rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: accounts_by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
      color:
        by: single
        value: "#4661c9"
    - id: billed_by_plan
      name: Billed by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Total billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      xAxis:
        columnId: plan
        sort:
          by: billed
          direction: descending
      yAxis:
        columnIds:
          - billed
      color:
        by: single
        value: "#0f766e"
    - id: account_detail
      name: Account detail
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account_name
          name: Account Name
        - id: region
          name: Region
        - id: status
          name: Status
        - id: current_plan
          name: Current Plan
        - id: signup_date
          name: Signup Date
        - id: billed
          name: Total Billed
        - id: adopted_features
          name: Adopted Feature Count
        - id: feature_records
          name: Feature Record Count
        - id: paid_invoices
          name: Paid Invoice Count
        - id: account_owner
          name: Account Owner
        - id: csm
          name: CSM
      sort:
        - columnId: billed
          direction: descending
      limit: 100
    - id: f_plan
      kind: control
      controlId: plan
      controlType: list
      label: Current plan
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: current_plan
    - id: signups_by_month
      name: Signups by month
      kind: line-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: month
          name: Signup month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: "[Account Count]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - signups
  pages:
    - id: overview
      name: Overview
      elements:
        - f_region
        - f_status
        - f_signup
        - f_plan
        - k_accounts
        - k_billed
        - k_adoption
        - k_paid
        - accounts_by_status
        - billed_by_plan
        - signups_by_month
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - account_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_region" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_signup" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="f_plan" gridColumn="19 / 25" gridRow="1 / 3"/>
      <Element elementId="k_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="k_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="k_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="k_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="accounts_by_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="billed_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="signups_by_month" gridColumn="1 / 25" gridRow="16 / 25"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
