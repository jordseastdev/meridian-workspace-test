workbookId: support-ticket-triage-7
name: Support Ticket Triage
description: Triage open support tickets, track status and category, and get help from an assistant.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets_base
      name: Support Tickets Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Support Tickets/Customer ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: channel
          name: Contact Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: status
          name: Ticket Status
          formula: "[Support Tickets/Ticket Status]"
        - id: first_response_minutes
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat_score
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
    - id: ticket_state
      name: Ticket Assignments and Closures
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: tickets_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: checkbox
      rowActions:
        - id: assign_to_me
          text: Assign
          appearance: filled
          icon: assign
          effects:
            - effect: update-rows
              tableElementId: ticket_state
              whichRows:
                type: selected
              values:
                assigned_to:
                  type: user
                  field: email
        - id: close_ticket
          text: Close
          appearance: outline
          icon: archive
          showWhen: IsNull([closed]) or [closed] = False
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_state
              whichRows:
                type: selected
              values:
                closed:
                  type: constant
                  value: true
    - id: kpi_open
      name: Open Ticket Count
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_state
      columns:
        - id: open_count
          name: Open Tickets
          formula: CountIf(IsNull([closed]) or [closed] = False)
      value:
        columnId: open_count
    - id: kpi_status
      name: Tickets by Status
      kind: bar-chart
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: ticket_count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: status
      yAxis:
        columnIds:
          - ticket_count
    - id: category_chart
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: ticket_count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
      limit: 10
    - id: ticket_queue
      name: Open Tickets
      kind: table
      actions:
        - id: select_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: picked_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: open_ticket_drawer
      source:
        kind: table
        elementId: ticket_state
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: assigned_to
          name: Assigned To
          formula: "[Assigned To]"
        - id: ticket_category
          name: Category
          formula: "[Ticket Category]"
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
        - id: closed
          name: Closed
          formula: "[Closed]"
      filters:
        - id: still_open
          kind: formula
          formula: IsNull([Closed]) or [Closed] = False
      sort:
        - columnId: opened_at
          direction: ascending
      rowActions:
        - id: assign
          text: Assign
          appearance: filled
          icon: assign
          effects:
            - effect: update-rows
              tableElementId: ticket_state
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                assigned_to:
                  type: user
                  field: email
        - id: close
          text: Close
          appearance: outline
          icon: archive
          showWhen: IsNull([closed]) or [closed] = False
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_state
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                closed:
                  type: constant
                  value: true
      display: cards
      card:
        title: ticket_id
        subtitle: ticket_category
        status: priority
        fields:
          - opened_at
          - ticket_status
          - assigned_to
    - id: picked_ticket
      kind: control
      controlId: picked_ticket
      controlType: text
      label: Selected Ticket
    - id: ticket_detail
      name: Ticket Details
      kind: table
      source:
        kind: table
        elementId: tickets_base
      columns:
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
      filters:
        - id: selected_ticket_filter
          kind: formula
          formula: "[Ticket ID] = [picked_ticket]"
    - id: assistant
      name: Support Assistant
      kind: agent
      agentId: support-ticket-assistant
      placeholder: Ask about ticket priorities, workload, or support trends.
      height: 480
  pages:
    - id: triage
      name: Ticket Triage
      elements:
        - kpi_open
        - kpi_status
        - category_chart
        - ticket_queue
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="kpi_open" gridColumn="1 / 25" gridRow="1 / 5"/>
      <Element elementId="kpi_status" gridColumn="1 / 13" gridRow="5 / 14"/>
      <Element elementId="category_chart" gridColumn="13 / 25" gridRow="5 / 14"/>
      <Element elementId="ticket_queue" gridColumn="1 / 25" gridRow="14 / 26"/>
      <Element elementId="tickets_base" gridColumn="1 / 25" gridRow="26 / 38"/>
      <Element elementId="ticket_state" gridColumn="1 / 25" gridRow="38 / 50"/>
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="50 / 68"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="open_ticket_drawer">
      <Element elementId="picked_ticket" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
  overlays:
    - id: open_ticket_drawer
      kind: drawer
      title: Ticket Details
      size: large
      elements:
        - picked_ticket
        - ticket_detail
  settings:
    theme:
      preset: daylight
      palette: meridian
