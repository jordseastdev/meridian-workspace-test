workbookId: account-health
name: Account Health
description: Account health overview with lifecycle, billing, feature adoption and an assistant for account questions.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account Health Data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid_invoice_rate
          name: Paid Invoice Rate
          formula: SafeDivide([Paid Invoice Count], [Invoice Count])
          format:
            kind: percent
            decimals: 1
    - id: signup_filter
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: signup_date
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: region
    - id: plan_filter
      kind: control
      controlId: current_plan
      controlType: list
      label: Current plan
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: current_plan
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Account Health Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Total billed
          formula: "[Total Billed Across Accounts]"
      value:
        columnId: value
    - id: kpi_adoption
      name: Feature adoption rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Adoption rate
          formula: "[Adopted Feature Rate]"
      value:
        columnId: value
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Paid invoice rate
          formula: "[Paid Invoice Rate]"
      value:
        columnId: value
    - id: status_chart
      name: Accounts by status
      kind: donut-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: accounts
      category:
        columnId: status
    - id: region_chart
      name: Accounts by region
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: region
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
    - id: plan_chart
      name: Accounts by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: plan
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
    - id: account_table
      name: Account health details
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account_name
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: plan
          name: Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: owner
          name: Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: paid_rate
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
      limit: 100
    - id: account_assistant
      kind: agent
      agentId: account-health-assistant
      placeholder: Ask about an account, its billing, adoption or lifecycle health.
      height: 700
  pages:
    - id: overview
      name: Overview
      elements:
        - signup_filter
        - region_filter
        - plan_filter
        - ask_button
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - status_chart
        - region_chart
        - plan_chart
        - account_table
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="signup_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="region_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="plan_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="19 / 23" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="status_chart" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="region_chart" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="plan_chart" gridColumn="1 / 25" gridRow="16 / 25"/>
      <Element elementId="account_table" gridColumn="1 / 25" gridRow="25 / 37"/>
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="37 / 49"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="account_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Account Health Assistant
      size: large
      elements:
        - account_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
