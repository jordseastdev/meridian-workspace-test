workbookId: order-value-spread-by-channel-7
name: Order Value Spread by Channel
description: Box plot of order-line values across sales channels, using net line revenue as order value.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base_orders
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: line_value
          name: Order Value
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 2
      filters:
        - id: completed
          kind: formula
          formula: '[Orders/Status] = "Completed"'
      visibleAsSource: true
    - id: order_value_by_channel
      name: Order value spread by channel
      kind: box-chart
      source:
        kind: table
        elementId: base_orders
      columns:
        - id: channel
          name: Channel
        - id: line_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: line_value
      category:
        columnId: channel
  pages:
    - id: analysis
      name: Order Value Spread
      elements:
        - order_value_by_channel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base_orders
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analysis">
      <Element elementId="order_value_by_channel" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
