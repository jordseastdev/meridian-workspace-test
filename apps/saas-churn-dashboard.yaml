workbookId: saas-churn-dashboard
name: SaaS Account Churn Dashboard
description: Explore churned, at-risk, and healthy SaaS accounts using account lifecycle, billing, and feature adoption data.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: churn_reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
        - id: adopted_features
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Records
          formula: "[Feature Record Count]"
        - id: last_feature_use
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: unpaid_invoices
          name: Unpaid Invoice Count
          formula: "[Unpaid Invoice Count]"
      visibleAsSource: false
    - id: lifecycle_filter
      kind: control
      controlId: lifecycle_date
      controlType: date-range
      label: Churn date range
      value:
        start: 2022-07-01
        end: 2025-09-01
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: churned_date
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: region
    - id: status_filter
      kind: control
      controlId: account_status
      controlType: list
      label: Account status
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: account_totals
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: v
    - id: billed_total
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
      value:
        columnId: v
    - id: adoption_rate
      name: Adopted feature rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: v
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
      value:
        columnId: v
    - id: accounts_by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: n
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: n
          direction: descending
      yAxis:
        columnIds:
          - n
    - id: churn_reasons
      name: Churned accounts by reason
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: reason
          name: Churn Reason
          formula: "[Churn Reason]"
        - id: n
          name: Churned Accounts
          formula: "[Account Count]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
      xAxis:
        columnId: reason
        sort:
          by: n
          direction: descending
      yAxis:
        columnIds:
          - n
      limit: 10
    - id: churned_accounts
      name: Churned accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
        - id: region
          name: Region
        - id: current_plan
          name: Current Plan
        - id: churned_date
          name: Churned Date
        - id: churn_reason
          name: Churn Reason
        - id: account_owner
          name: Account Owner
        - id: csm
          name: CSM
        - id: billed
          name: Total Billed
      sort:
        - columnId: churned_date
          direction: descending
      limit: 100
    - id: at_risk_accounts
      name: At-risk accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: account_name
          name: Account Name
        - id: region
          name: Region
        - id: current_plan
          name: Current Plan
        - id: status
          name: Status
        - id: last_feature_use
          name: Last Feature Use Date
        - id: adopted_features
          name: Adopted Features
        - id: feature_records
          name: Feature Records
        - id: unpaid_invoices
          name: Unpaid Invoice Count
        - id: account_owner
          name: Account Owner
        - id: csm
          name: CSM
      sort:
        - columnId: last_feature_use
          direction: ascending
      limit: 100
    - id: healthy_accounts
      name: Healthy accounts
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
        - id: account_name
          name: Account Name
        - id: region
          name: Region
        - id: current_plan
          name: Current Plan
        - id: status
          name: Status
        - id: last_feature_use
          name: Last Feature Use Date
        - id: adopted_features
          name: Adopted Features
        - id: feature_records
          name: Feature Records
        - id: billed
          name: Total Billed
        - id: account_owner
          name: Account Owner
        - id: csm
          name: CSM
      sort:
        - columnId: adopted_features
          direction: descending
      limit: 100
  pages:
    - id: churn_dashboard
      name: Churn Dashboard
      elements:
        - lifecycle_filter
        - region_filter
        - status_filter
        - account_totals
        - billed_total
        - adoption_rate
        - accounts_by_status
        - churn_reasons
        - churned_accounts
        - at_risk_accounts
        - healthy_accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="churn_dashboard">
      <Element elementId="lifecycle_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="region_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="account_totals" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="billed_total" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="adoption_rate" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="accounts_by_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="churn_reasons" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="churned_accounts" gridColumn="1 / 25" gridRow="16 / 28"/>
      <Element elementId="at_risk_accounts" gridColumn="1 / 25" gridRow="28 / 40"/>
      <Element elementId="healthy_accounts" gridColumn="1 / 25" gridRow="40 / 52"/>
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="52 / 64"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
