workbookId: retail-revenue-yoy
name: "Retail Revenue: This Year vs Last Year"
description: Monthly revenue comparison with year-over-year KPIs, defaulting to the latest complete year available.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: f_year
      kind: control
      controlId: year
      controlType: list
      label: Compare year
      value: 2024
      options:
        - 2024
        - 2025
    - id: base_orders
      name: Order data
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
      filters:
        - id: completed_only
          kind: list
          columnId: status
          mode: include
          values:
            - Completed
      visibleAsSource: true
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: v
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
      filters:
        - id: current_year
          kind: list
          columnId: order_date
          mode: include
          values:
            - 2024-01-01
            - 2024-12-31
      value:
        columnId: v
    - id: kpi_change
      name: Change vs last year
      kind: kpi-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: change
          name: Change vs last year
          formula: SafeDivide(SumIf([Revenue], DatePart("year", [Order Date]) = 2024) - SumIf([Revenue], DatePart("year", [Order Date]) = 2023), SumIf([Revenue], DatePart("year", [Order Date]) = 2023))
          format:
            kind: percent
            decimals: 1
      value:
        columnId: change
    - id: monthly_revenue
      name: Revenue by month
      kind: line-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: month
          name: Order Month
          formula: DateFormat([Order Month], "%b")
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: selected_years
          kind: list
          columnId: year
          mode: include
          values:
            - 2023
            - 2024
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
  pages:
    - id: revenue_compare
      name: Revenue comparison
      elements:
        - f_year
        - kpi_revenue
        - kpi_change
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base_orders
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="revenue_compare">
      <Element elementId="f_year" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_change" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
