workbookId: retail-revenue-region-category-heatmap
name: Revenue by Region and Product Category
description: Heatmap of retail revenue by sales region and product category.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Orders with Region and Category
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_region_category
          groupBy:
            - region
            - category
          calculations:
            - revenue
    - id: revenue_heatmap
      name: Revenue by Region and Product Category
      kind: heatmap-chart
      source:
        kind: table
        elementId: orders_base
        groupingId: by_region_category
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: category
          name: Product Category
          formula: "[Product Category]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
      value:
        columnId: revenue
      category:
        columnId: region
  pages:
    - id: overview
      name: Revenue Heatmap
      elements:
        - revenue_heatmap
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="revenue_heatmap" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
