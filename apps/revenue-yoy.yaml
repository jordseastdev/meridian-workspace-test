workbookId: revenue-yoy
name: Revenue This Year vs Last Year
description: Monthly net revenue comparison for the current year and prior year, with year-over-year KPI comparisons.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: f_date
      name: Order date range
      kind: control
      controlId: order_date_range
      controlType: date-range
      label: Order date range
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: orders_base
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: order_id
          name: Order ID
          formula: "[Orders/Order ID]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
      visibleAsSource: true
    - id: kpi_revenue
      name: Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: m
          name: Month
          formula: "[Order Month]"
      value:
        columnId: v
      comparison:
        period: previous-period
        label: vs last year
      trend:
        columnId: m
    - id: kpi_orders
      name: Order lines
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Order Count
          formula: "[Order Count]"
        - id: m
          name: Month
          formula: "[Order Month]"
      value:
        columnId: v
      comparison:
        period: previous-period
        label: vs last year
      trend:
        columnId: m
    - id: monthly_revenue
      name: "Monthly revenue: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month of year
          formula: DatePart("month", [Order Month])
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: target_years
          kind: formula
          formula: DatePart("year", [Order Date]) >= 2024 and DatePart("year", [Order Date]) <= 2025
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
  pages:
    - id: overview
      name: Revenue YoY
      elements:
        - f_date
        - kpi_revenue
        - kpi_orders
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_orders" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
