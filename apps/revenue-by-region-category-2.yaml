workbookId: revenue-by-region-category-2
name: Revenue by Region and Product Category
description: Revenue heatmap across sales regions and product categories using the Retail model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: region_revenue_base
      name: Revenue by Region and Category
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_region_category
          groupBy:
            - region
            - category
          calculations:
            - revenue
    - id: revenue_heatmap
      name: Revenue by Region and Product Category
      kind: heatmap-chart
      source:
        kind: table
        elementId: region_revenue_base
        groupingId: by_region_category
      columns:
        - id: region
          name: Region
        - id: category
          name: Product Category
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
      color:
        by: scale
        column: revenue
        scheme: blues
      value:
        columnId: revenue
      category:
        columnId: region
      limit: 10
  pages:
    - id: overview
      name: Revenue Heatmap
      elements:
        - revenue_heatmap
    - id: data
      name: Data
      visibility: hidden
      elements:
        - region_revenue_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="revenue_heatmap" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="region_revenue_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
