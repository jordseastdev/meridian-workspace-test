workbookId: discount-approvals-4
name: Discount Approvals
description: Sales team workspace to review discount requests and monitor approval progress.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Deals base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deals/Deal ID]"
        - id: account
          name: Account
          formula: "[Deals/Account]"
        - id: owner
          name: Owner
          formula: "[Deals/Owner]"
        - id: region
          name: Region
          formula: "[Deals/Region]"
        - id: stage
          name: Stage
          formula: "[Deals/Stage]"
        - id: status
          name: Status
          formula: "[Deals/Status]"
        - id: list_amount
          name: List Amount
          formula: "[Deals/List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Deals/Submitted Discount]"
          format:
            kind: percent
            decimals: 0
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      source:
        kind: source
        source:
          kind: table
          elementId: deals_base
        columnId: region
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: region
    - id: stage_filter
      kind: control
      controlId: stage
      controlType: list
      label: Stage
      source:
        kind: source
        source:
          kind: table
          elementId: deals_base
        columnId: stage
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: stage
    - id: ask_assistant
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Discount Approvals Assistant
      appearance: filled
      icon: sparkles
    - id: review_queue
      name: Deal review queue
      kind: sheet
      actions:
        - id: open_deal
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_deal
              value:
                type: selection
                columnId: deal_id
            - effect: open-overlay
              overlayId: deal_drawer
      inputMode: edit
      source:
        kind: linked
        from: deals_base
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          key: deal_id
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: decided_by
          name: Decided By
          type: text
          readOnly: true
        - id: decided_at
          name: Decided At
          type: datetime
          readOnly: true
      rowActions:
        - id: approve
          text: Approve
          appearance: filled
          icon: check
          showWhen: IsNull([decision])
          effects:
            - effect: update-rows
              tableElementId: review_queue
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Approved
                decided_by:
                  type: user
                  field: email
                decided_at:
                  type: now
            - effect: notify
              message: Deal approved
              level: success
        - id: reject
          text: Reject
          appearance: outline
          icon: x
          showWhen: IsNull([decision])
          confirm: Reject {{account}}?
          effects:
            - effect: update-rows
              tableElementId: review_queue
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Rejected
                decided_by:
                  type: user
                  field: email
                decided_at:
                  type: now
            - effect: notify
              message: Deal rejected
              level: success
      display: cards
      card:
        title: account
        subtitle: owner
        status: decision
        fields:
          - region
          - list_amount
          - submitted_discount
    - id: selected_deal
      kind: control
      controlId: selected_deal
      controlType: text
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: deal_id
    - id: deal_details
      name: Selected deal details
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
      filters:
        - id: selected_only
          kind: formula
          formula: "[Deal ID] = [selected_deal]"
    - id: pending_kpi
      name: Pending deals
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: v
          name: Pending Deals
          formula: CountDistinct([Deal ID])
      filters:
        - id: pending
          kind: formula
          formula: '[Status] = "Pending"'
      value:
        columnId: v
    - id: discount_kpi
      name: Total discount requested
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: v
          name: Total Discount Requested
          formula: Sum([List Amount] * [Submitted Discount])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: discount_region
      name: Submitted discount by region
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: v
          name: Submitted Discount
          formula: Sum([Submitted Discount])
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: region
        sort:
          by: v
          direction: descending
      yAxis:
        columnIds:
          - v
    - id: discount_stage
      name: Submitted discount by stage
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: v
          name: Submitted Discount
          formula: Sum([Submitted Discount])
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: stage
        sort:
          by: v
          direction: descending
      yAxis:
        columnIds:
          - v
    - id: approval_agent
      kind: agent
      agentId: discount-approvals-assistant-2
      placeholder: Ask about discount requests and approval progress.
      height: 560
  pages:
    - id: queue
      name: Review Queue
      elements:
        - region_filter
        - stage_filter
        - ask_assistant
        - review_queue
    - id: analytics
      name: Approval Analytics
      elements:
        - region_filter
        - stage_filter
        - pending_kpi
        - discount_kpi
        - discount_region
        - discount_stage
    - id: helper
      name: Helper data
      visibility: hidden
      elements:
        - deals_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_assistant" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="review_queue" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="selected_deal" gridColumn="1 / 7" gridRow="15 / 17"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="pending_kpi" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="discount_kpi" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="discount_region" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="discount_stage" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="helper">
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="deal_drawer">
      <Element elementId="deal_details" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="approval_agent" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: deal_drawer
      kind: drawer
      title: Deal details
      size: large
      elements:
        - deal_details
    - id: assistant_drawer
      kind: drawer
      title: Discount Approvals Assistant
      size: large
      elements:
        - approval_agent
  settings:
    theme:
      preset: daylight
      palette: meridian
