workbookId: revenue-yoy-by-month
name: Revenue YoY by Month
description: Compare monthly net revenue this calendar year with the same months last year, with year-over-year KPI context.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
        - id: total_revenue
          name: Total Revenue
          formula: "[Total Revenue]"
    - id: f_dates
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Revenue
          formula: SumIf([Revenue], DatePart("year", [Order Date]) = 2025)
          format:
            kind: currency
            decimals: 0
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: revenue
      trend:
        columnId: month
    - id: kpi_yoy
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: revenue
          name: Revenue this year
          formula: SumIf([Revenue], DatePart("year", [Order Date]) = 2025)
          format:
            kind: currency
            decimals: 0
        - id: prior
          name: Revenue last year
          formula: SumIf([Revenue], DatePart("year", [Order Date]) = 2024)
          format:
            kind: currency
            decimals: 0
        - id: change
          name: YoY change
          formula: SafeDivide(SumIf([Revenue], DatePart("year", [Order Date]) = 2025) - SumIf([Revenue], DatePart("year", [Order Date]) = 2024), SumIf([Revenue], DatePart("year", [Order Date]) = 2024))
          format:
            kind: percent
            decimals: 1
      value:
        columnId: change
    - id: monthly
      name: Monthly revenue by year
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DatePart("month", [Order Date])
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
      filters:
        - id: year_window
          kind: formula
          formula: DatePart("year", [Order Date]) >= 2024 and DatePart("year", [Order Date]) <= 2025
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
  pages:
    - id: overview
      name: Revenue YoY
      elements:
        - f_dates
        - kpi_revenue
        - kpi_yoy
        - monthly
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_dates" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_yoy" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
