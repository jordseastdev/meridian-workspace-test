workbookId: retail-sales-overview-10
name: Retail Sales Overview
description: Sales performance overview and top product rankings based on the Retail semantic model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: sales_base
      name: Sales Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: order_id
          name: Order ID
          formula: "[Orders/Order ID]"
        - id: profit
          name: Profit
          formula: "[Orders/Profit]"
          format:
            kind: currency
            decimals: 0
        - id: product_id
          name: Product ID
          formula: "[Orders/Product ID]"
        - id: product_name
          name: Product Name
          formula: "[Product/Product Name]"
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: channel_filter
      kind: control
      controlId: sales_channel
      controlType: list
      label: Channel
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: channel
    - id: kpi_revenue
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: value
      trend:
        columnId: month
    - id: kpi_orders
      name: Order Count
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: value
    - id: kpi_aov
      name: Avg Order Value
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Avg Order Value
          formula: "[Avg Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_margin
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: value
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: monthly_sales
      name: Monthly Revenue
      kind: line-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top Products by Revenue
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
    - id: product_detail
      name: Product Revenue Detail
      kind: table
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      groupings:
        - id: by_product
          groupBy:
            - product
          calculations:
            - revenue
          sort:
            - columnId: revenue
              direction: descending
      limit: 10
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - channel_filter
        - kpi_revenue
        - kpi_orders
        - kpi_aov
        - kpi_margin
        - monthly_sales
        - channel_sales
    - id: products
      name: Products
      elements:
        - date_filter
        - channel_filter
        - top_products
        - product_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - sales_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_orders" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_aov" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_margin" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_sales" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="products">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="3 / 12"/>
      <Element elementId="product_detail" gridColumn="1 / 25" gridRow="12 / 24"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="sales_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
