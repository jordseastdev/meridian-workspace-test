workbookId: account-health-7
name: Account Health
description: Account portfolio overview with adoption, billing and account-level details.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts_base
      name: Account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: total_monthly_active_users
          name: Total Monthly Active Users
          formula: "[Total Monthly Active Users]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
      visibleAsSource: true
    - id: signup_filter
      kind: control
      controlId: signup_range
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts_base
          columnId: signup_date
    - id: status_filter
      kind: control
      controlId: account_status
      controlType: list
      label: Status
      filters:
        - source:
            kind: table
            elementId: accounts_base
          columnId: status
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: ask_assistant
      text: Ask Account Health Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Total billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_adoption
      name: Feature adoption
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Adoption rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: health_by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
    - id: billed_by_plan
      name: Billed by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      xAxis:
        columnId: plan
        sort:
          by: billed
          direction: descending
      yAxis:
        columnIds:
          - billed
    - id: account_details
      name: Account details
      kind: table
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: account_owner
          name: Account Owner
          formula: "[Account Owner]"
        - id: csm
          name: CSM
          formula: "[CSM]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
    - id: account_assistant
      kind: agent
      agentId: account-health-assistant
      placeholder: Ask about accounts, adoption, billing, or lifecycle.
      height: 600
  pages:
    - id: overview
      name: Overview
      elements:
        - signup_filter
        - status_filter
        - ask_button
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - health_by_status
        - billed_by_plan
        - account_details
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="signup_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="health_by_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="billed_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_details" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ask_assistant">
      <Element elementId="account_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ask_assistant
      kind: drawer
      title: Account Health Assistant
      size: large
      elements:
        - account_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
