workbookId: retail-sales-overview-8
name: Retail Sales Overview
description: Sales KPIs, revenue trends, channel performance and top products using the certified Retail model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: sales_base
      name: Sales data
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Order Month]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: profit
          name: Profit
          formula: "[Profit]"
          format:
            kind: currency
            decimals: 0
        - id: product
          name: Product
          formula: "[Products/Product Name]"
      visibleAsSource: true
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: revenue
      name: Total revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: orders
      name: Order count
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: v
    - id: margin
      name: Gross margin
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: monthly_sales
      name: Monthly revenue trend
      kind: line-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: channel_sales
      name: Revenue by channel
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top products by revenue
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: product
          name: Product
          formula: "[Product]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - revenue
        - orders
        - margin
        - monthly_sales
        - channel_sales
    - id: products
      name: Products
      elements:
        - top_products
    - id: data
      name: Data
      visibility: hidden
      elements:
        - sales_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="revenue" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="orders" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="margin" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_sales" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="products">
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="sales_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
