workbookId: support-ticket-triage-5
name: Support Ticket Triage
description: Triage open support tickets and monitor ticket volume and resolution times.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_base
      name: Ticket source
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: category
          name: Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: status
          name: Status
          formula: "[Support Tickets/Ticket Status]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
    - id: date_filter
      kind: control
      controlId: opened_dates
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: opened_at
    - id: priority_filter
      kind: control
      controlId: ticket_priority
      controlType: list
      label: Priority
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: priority
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Triage Assistant
      appearance: filled
      icon: sparkles
    - id: open_tickets
      name: Open Tickets
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: ticket_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: category
          name: Category
          formula: "[Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          type: text
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: status
          name: Status
          type: text
          default:
            kind: constant
            value: Open
        - id: assigned_by
          name: Assigned By
          type: text
        - id: closed_by
          name: Closed By
          type: text
      rowActions:
        - id: assign_to_me
          text: Assign to me
          appearance: filled
          icon: assign
          showWhen: IsNull([assigned_by])
          effects:
            - effect: update-rows
              tableElementId: open_tickets
              whichRows:
                type: selected
              values:
                agent:
                  type: user
                  field: name
                assigned_by:
                  type: user
                  field: email
        - id: close_ticket
          text: Close
          appearance: outline
          icon: check
          showWhen: '[status] = "Open"'
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: open_tickets
              whichRows:
                type: selected
              values:
                status:
                  type: constant
                  value: Closed
                closed_by:
                  type: user
                  field: email
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - priority
          - agent
          - opened_at
    - id: tickets_category
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: ticket_count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
    - id: tickets_priority
      name: Tickets by Priority
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: ticket_count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
    - id: resolution_trend
      name: Average Resolution Hours Over Time
      kind: line-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: opened_month
          name: Month
          formula: DateTrunc("month", [Opened At])
        - id: avg_resolution
          name: Avg Resolution Hours
          formula: Avg([Resolution Hours])
          format:
            kind: number
            decimals: 1
      xAxis:
        columnId: opened_month
      yAxis:
        columnIds:
          - avg_resolution
    - id: support_assistant
      kind: agent
      agentId: support-triage-assistant
      placeholder: Ask about ticket trends or triage
      height: 520
  pages:
    - id: triage
      name: Triage
      elements:
        - date_filter
        - priority_filter
        - ask_button
        - open_tickets
    - id: analytics
      name: Analytics
      elements:
        - date_filter
        - priority_filter
        - tickets_category
        - tickets_priority
        - resolution_trend
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="open_tickets" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="ticket_base" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="tickets_category" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="tickets_priority" gridColumn="13 / 25" gridRow="3 / 12"/>
      <Element elementId="resolution_trend" gridColumn="1 / 25" gridRow="12 / 21"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="support_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Support Triage Assistant
      size: large
      elements:
        - support_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
