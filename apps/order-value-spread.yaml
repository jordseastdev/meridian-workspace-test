workbookId: order-value-spread
name: Order Value Spread by Channel
description: Distribution of order-line net values across sales channels.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: order_lines
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
      visibleAsSource: true
    - id: order_value_spread
      name: Order Value Spread by Channel
      kind: box-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: overview
      name: Overview
      elements:
        - order_value_spread
    - id: data
      name: Data
      visibility: hidden
      elements:
        - order_lines
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="order_value_spread" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="order_lines" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
