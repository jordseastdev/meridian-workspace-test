workbookId: retail-sales-overview-17
name: Retail Sales Overview
description: Sales overview of retail order lines with date, channel and status filters.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: sales_base
      name: Filtered order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Orders/Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: quantity
          name: Quantity
          formula: "[Orders/Quantity]"
        - id: cost
          name: Cost
          formula: "[Orders/Cost]"
          format:
            kind: currency
            decimals: 0
        - id: profit
          name: Profit
          formula: "[Orders/Profit]"
          format:
            kind: currency
            decimals: 0
        - id: category
          name: Category
          formula: "[Product/Category]"
      visibleAsSource: true
    - id: date_filter
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: order_date
    - id: channel_filter
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: channel
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: sales_base
          columnId: status
    - id: revenue_kpi
      name: Total Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: orders_kpi
      name: Order Lines
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Order Count
          formula: "[Order Count]"
      value:
        columnId: v
    - id: aov_kpi
      name: Revenue per Order Line
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Avg Order Value
          formula: "[Avg Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: v
    - id: margin_kpi
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: v
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: revenue_trend
      name: Monthly Revenue Trend
      kind: line-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: month
          name: Order Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: channel_sales
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
    - id: category_sales
      name: Revenue by Product Category
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
    - id: sales_detail
      name: Sales Detail
      kind: table
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: order_id
          name: Order ID
        - id: order_date
          name: Order Date
        - id: channel
          name: Channel
        - id: status
          name: Status
        - id: category
          name: Category
        - id: quantity
          name: Quantity
        - id: revenue
          name: Revenue
        - id: profit
          name: Profit
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
    - id: region_sales
      name: Revenue by Region
      kind: bar-chart
      source:
        kind: table
        elementId: sales_base
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: revenue
          name: Total Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: region
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      color:
        by: single
        value: "#4661c9"
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - channel_filter
        - status_filter
        - revenue_kpi
        - orders_kpi
        - aov_kpi
        - margin_kpi
        - revenue_trend
        - channel_sales
        - category_sales
        - region_sales
        - sales_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - sales_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="channel_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="status_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="revenue_kpi" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="orders_kpi" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="aov_kpi" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="margin_kpi" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="revenue_trend" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="channel_sales" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="category_sales" gridColumn="1 / 13" gridRow="16 / 25"/>
      <Element elementId="region_sales" gridColumn="13 / 25" gridRow="16 / 25"/>
      <Element elementId="sales_detail" gridColumn="1 / 25" gridRow="25 / 37"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="sales_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
