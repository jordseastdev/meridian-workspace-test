workbookId: retail-profit-update
name: Retail Profit Update
description: A concise profit update using the Retail semantic model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: profit_kpi
      name: Total Profit
      kind: kpi-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: profit
          name: Profit
          formula: Sum([Profit])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: profit
  pages:
    - id: overview
      name: Profit
      elements:
        - profit_kpi
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="profit_kpi" gridColumn="1 / 25" gridRow="1 / 5"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
