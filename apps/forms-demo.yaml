workbookId: forms-demo
name: Forms demo
description: Support triage with a request form and an edit form in the ticket drawer.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets_base
      name: Support Tickets
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Support Tickets/Ticket ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Support Tickets/Customer ID]"
        - id: opened_at
          name: Opened At
          formula: "[Support Tickets/Opened At]"
        - id: contact_channel
          name: Contact Channel
          formula: "[Support Tickets/Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Support Tickets/Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Support Tickets/Priority]"
        - id: agent
          name: Agent
          formula: "[Support Tickets/Agent]"
        - id: ticket_status
          name: Ticket Status
          formula: "[Support Tickets/Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[Support Tickets/First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Support Tickets/Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[Support Tickets/CSAT Score]"
      limit: 500
    - id: ticket_work
      name: Ticket Assignment and Closure
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: tickets_base
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: contact_channel
          name: Contact Channel
          formula: "[Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: original_agent
          name: Original Agent
          formula: "[Agent]"
        - id: ticket_status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: first_response
          name: First Response Minutes
          formula: "[First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Resolution Hours]"
        - id: csat
          name: CSAT Score
          formula: "[CSAT Score]"
        - id: assigned_to
          name: Assigned To
          type: text
        - id: closed
          name: Closed
          type: text
          values:
            - Closed
        - id: note
          name: Note
          type: text
          multiline: true
        - id: follow_up
          name: Follow up on
          type: date
    - id: status_filter
      kind: control
      controlId: status_filter
      controlType: list
      label: Ticket status
      selectionMode: multiple
      source:
        kind: source
        source:
          kind: table
          elementId: ticket_work
        columnId: ticket_status
      filters:
        - source:
            kind: table
            elementId: ticket_work
          columnId: ticket_status
    - id: ask_assistant
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Triage Assistant
      appearance: filled
      icon: sparkles
    - id: open_count
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: count
          name: Open Tickets
          formula: CountDistinct([Ticket ID])
      filters:
        - id: not_closed
          kind: formula
          formula: IsNull([closed]) and [Ticket Status] != "Solved"
      value:
        columnId: count
    - id: status_counts
      name: Tickets by Status
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: status
          name: Ticket Status
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: status
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: category_chart
      name: Open Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: category
          name: Ticket Category
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      filters:
        - id: not_closed
          kind: formula
          formula: IsNull([closed]) and [Ticket Status] != "Solved"
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
      limit: 10
    - id: ticket_cards
      name: Open Ticket Queue
      kind: table
      actions:
        - id: select_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: ticket_selected
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: customer_id
          name: Customer ID
        - id: opened_at
          name: Opened At
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
        - id: original_agent
          name: Current Agent
          formula: "[Original Agent]"
        - id: assigned_to
          name: Assigned To
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
      filters:
        - id: not_closed
          kind: formula
          formula: IsNull([closed]) and [Ticket Status] != "Solved"
      rowActions:
        - id: assign
          text: Assign
          appearance: filled
          icon: assign
          ask:
            label: Assign to
            placeholder: Enter assignee
            required: true
          effects:
            - effect: update-rows
              tableElementId: ticket_work
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                assigned_to:
                  type: answer
            - effect: notify
              message: Ticket assigned
              level: success
        - id: close_ticket
          text: Close
          appearance: outline
          icon: archive
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: update-rows
              tableElementId: ticket_work
              whichRows:
                type: column-match
                columnId: ticket_id
                value:
                  type: selection
                  columnId: ticket_id
              values:
                closed:
                  type: constant
                  value: Closed
            - effect: notify
              message: Ticket closed
              level: success
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: ticket_status
        fields:
          - opened_at
          - priority
          - original_agent
          - assigned_to
    - id: ticket_selected
      kind: control
      controlId: ticket_selected
      controlType: text
      label: Selected ticket
    - id: ticket_detail
      name: Ticket Details
      kind: table
      source:
        kind: table
        elementId: ticket_work
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: customer_id
          name: Customer ID
        - id: opened_at
          name: Opened At
        - id: contact_channel
          name: Contact Channel
        - id: category
          name: Ticket Category
        - id: priority
          name: Priority
        - id: original_agent
          name: Current Agent
          formula: "[Original Agent]"
        - id: assigned_to
          name: Assigned To
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
        - id: first_response
          name: First Response Minutes
        - id: resolution_hours
          name: Resolution Hours
        - id: csat
          name: CSAT Score
      filters:
        - id: selected
          kind: formula
          formula: "[Ticket ID] = [ticket_selected]"
    - id: support_agent
      kind: agent
      agentId: support-triage-assistant
      placeholder: Ask about ticket priority, patterns, or triage recommendations.
      height: 600
    - id: ticket_edit
      kind: form
      title: Update this ticket
      tableElementId: ticket_work
      fields:
        - assigned_to
        - columnId: closed
          label: Close it
        - columnId: note
          placeholder: What did you find?
        - follow_up
      submitText: Save changes
      editRow:
        control: ticket_selected
        columnId: ticket_id
    - id: requests
      name: Requests
      kind: input-table
      inputMode: edit
      source:
        kind: empty
        connectionId: default
      columns:
        - id: title
          name: Title
          type: text
          required: true
        - id: category
          name: Category
          type: text
          values:
            - Hardware
            - Software
            - Access
            - Other
          required: true
        - id: priority
          name: Priority
          type: text
          values:
            - Low
            - Medium
            - High
          default:
            kind: constant
            value: Medium
        - id: needed_by
          name: Needed by
          type: date
        - id: cost
          name: Estimated cost
          type: number
          min: 0
        - id: details
          name: Details
          type: text
          multiline: true
        - id: requested_by
          name: Requested by
          type: text
          default:
            kind: user
          readOnly: true
    - id: request_form
      kind: form
      title: Request something
      tableElementId: requests
      fields:
        - title
        - category
        - priority
        - needed_by
        - columnId: cost
          help: In dollars, if you know it
        - columnId: details
          placeholder: Anything we should know
      submitText: Send request
  pages:
    - id: triage
      name: Triage
      elements:
        - status_filter
        - ask_assistant
        - open_count
        - status_counts
        - category_chart
        - ticket_cards
    - id: req
      name: Requests
      elements:
        - request_form
        - requests
    - id: helper
      name: Helper
      visibility: hidden
      elements:
        - tickets_base
        - ticket_work
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="status_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ask_assistant" gridColumn="7 / 11" gridRow="1 / 3"/>
      <Element elementId="open_count" gridColumn="1 / 25" gridRow="3 / 7"/>
      <Element elementId="status_counts" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="category_chart" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="ticket_cards" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="req">
      <Element elementId="request_form" gridColumn="1 / 25" gridRow="1 / 9"/>
      <Element elementId="requests" gridColumn="1 / 25" gridRow="9 / 21"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="helper">
      <Element elementId="tickets_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_work" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_drawer">
      <Element elementId="ticket_selected" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ticket_edit" gridColumn="1 / 25" gridRow="3 / 11"/>
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="11 / 23"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="support_agent" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ticket_drawer
      kind: drawer
      title: Ticket Details
      size: large
      elements:
        - ticket_selected
        - ticket_edit
        - ticket_detail
    - id: assistant_drawer
      kind: drawer
      title: Support Triage Assistant
      size: large
      elements:
        - support_agent
  settings:
    theme:
      preset: daylight
      palette: meridian
