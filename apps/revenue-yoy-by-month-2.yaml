workbookId: revenue-yoy-by-month-2
name: Revenue YoY by Month
description: Monthly net revenue this year compared with last year, with year-over-year KPIs.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: completed
          kind: formula
          formula: '[Orders/Status] = "Completed"'
    - id: f_year
      kind: control
      controlId: year
      controlType: number
      label: Year
      value: 2025
      low: 2023
      high: 2025
      step: 1
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: value
          name: Revenue
          formula: Sum(If(DatePart("year", [Order Date]) = [year], [Revenue], 0))
          format:
            kind: currency
            decimals: 0
      value:
        columnId: value
    - id: kpi_yoy
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: change
          name: Revenue change
          formula: SafeDivide(Sum(If(DatePart("year", [Order Date]) = [year], [Revenue], 0)) - Sum(If(DatePart("year", [Order Date]) = [year] - 1, [Revenue], 0)), Sum(If(DatePart("year", [Order Date]) = [year] - 1, [Revenue], 0)))
          format:
            kind: percent
            decimals: 1
      value:
        columnId: change
    - id: monthly_revenue
      name: "Monthly revenue: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DatePart("month", [Order Date])
        - id: this_year
          name: This year
          formula: Sum(If(DatePart("year", [Order Date]) = [year], [Revenue], 0))
          format:
            kind: currency
            decimals: 0
        - id: last_year
          name: Last year
          formula: Sum(If(DatePart("year", [Order Date]) = [year] - 1, [Revenue], 0))
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - this_year
          - last_year
  pages:
    - id: overview
      name: Revenue YoY
      elements:
        - f_year
        - kpi_revenue
        - kpi_yoy
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_year" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_yoy" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
