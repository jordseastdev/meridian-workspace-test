workbookId: product-category-return-rates
name: Product Category Return Rates
description: Ranked view of product categories with the highest share of returned order lines.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: return_rate_by_category
      name: Return Rate by Product Category
      kind: bar-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: return_rate
          name: Return Rate
          formula: "[Return Rate]"
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: category
        sort:
          by: return_rate
          direction: descending
      yAxis:
        columnIds:
          - return_rate
      color:
        by: single
        value: "#c2410c"
      orientation: horizontal
      legend:
        visibility: hidden
      dataLabel:
        labels: shown
        labelDisplay: all
      limit: 10
  pages:
    - id: overview
      name: Overview
      elements:
        - id: return_rate_by_category
          width: 24
          height: 12
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="return_rate_by_category" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
