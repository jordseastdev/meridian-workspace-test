workbookId: revenue-year-comparison
name: "Revenue: This Year vs Last Year"
description: Compare completed-order revenue by month for the current and prior calendar years, with year-over-year change KPIs.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Completed order lines
      description: Completed order-line revenue with calendar year and month fields.
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: completed
          kind: formula
          formula: '[Orders/Status] = "Completed"'
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      filters:
        - id: this_year
          kind: formula
          formula: DatePart("year", [Order Date]) = 2025
      value:
        columnId: v
      comparison:
        period: previous-period
        label: vs last year
      trend:
        columnId: m
    - id: kpi_revenue_ly
      name: Revenue last year
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      filters:
        - id: last_year
          kind: formula
          formula: DatePart("year", [Order Date]) = 2024 AND [Order Date] <= "2024-09-27"
      value:
        columnId: v
      trend:
        columnId: m
    - id: monthly_revenue
      name: "Monthly revenue: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DatePart("month", [Order Date])
        - id: year
          name: Year
          formula: DatePart("year", [Order Date])
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      filters:
        - id: year_window
          kind: formula
          formula: DatePart("year", [Order Date]) >= 2024 AND DatePart("year", [Order Date]) <= 2025
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: year
        scheme: tableau
      legend:
        position: top
  pages:
    - id: overview
      name: Revenue Overview
      elements:
        - kpi_revenue
        - kpi_revenue_ly
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="1 / 5"/>
      <Element elementId="kpi_revenue_ly" gridColumn="13 / 25" gridRow="1 / 5"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="5 / 14"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
