workbookId: retail-region-category-revenue
name: Revenue by Region and Product Category
description: Heatmap of retail order revenue across sales regions and product categories.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base_orders
      name: Order Revenue Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
    - id: revenue_heatmap
      name: Revenue by Region and Product Category
      kind: heatmap-chart
      source:
        kind: table
        elementId: base_orders
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: category
          name: Product Category
          formula: "[Product Category]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
      value:
        columnId: revenue
      category:
        columnId: region
  pages:
    - id: overview
      name: Revenue Heatmap
      elements:
        - revenue_heatmap
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base_orders
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="revenue_heatmap" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
