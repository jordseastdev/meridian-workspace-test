workbookId: retail-revenue-region-category
name: Revenue by Region and Product Category
description: Explore net revenue across sales regions and product categories.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Order revenue with region and product category
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      visibleAsSource: true
    - id: heatmap
      name: Revenue by Region and Product Category
      kind: heatmap-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: region
          name: Region
        - id: category
          name: Product Category
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
      color:
        by: scale
        column: revenue
        scheme: blues
      value:
        columnId: revenue
      category:
        columnId: region
  pages:
    - id: overview
      name: Revenue Heatmap
      elements:
        - heatmap
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="heatmap" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
