workbookId: account-region-plan-flow-6
name: "Account Flow: Region to Current Plan"
description: Shows account counts flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
    - id: account_flow
      name: "Accounts: Region to Current Plan"
      kind: sankey-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: CountDistinct([Account ID])
          format:
            kind: number
            decimals: 0
      value:
        columnId: accounts
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: account_flow
      name: Account Flow
      elements:
        - account_flow
    - id: data
      name: Data
      visibility: hidden
      elements:
        - account_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="account_flow">
      <Element elementId="account_flow" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
