workbookId: eval-wb-group-by-muxxj03i
name: Eval Sales Command Center
description: Executive revenue view on the Retail data model. Slice by region, channel and date. All tiles recompute from one governed Orders table.
folderId: sales
tags:
  - sales
  - executive
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: title
      kind: text
      body: |
        # Sales Command Center
        {{CountDistinct([Orders/Order ID]) | number}} order lines, {{Sum([Orders/Revenue]) | currency}} net revenue in the current selection.
    - id: ctl_region
      kind: control
      controlId: region
      controlType: list
      label: Region
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders
          columnId: region
    - id: ctl_channel
      kind: control
      controlId: channel
      controlType: segmented
      label: Channel
      filters:
        - source:
            kind: table
            elementId: orders
          columnId: channel
    - id: ctl_dates
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      filters:
        - source:
            kind: table
            elementId: orders
          columnId: order_date
    - id: kpi_revenue
      name: Net Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: rev
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: month
          name: Month
          formula: "[Order Month]"
      value:
        columnId: rev
      comparison:
        period: previous-period
        label: vs prior month
      trend:
        columnId: month
    - id: kpi_orders
      name: Order Count
      kind: kpi-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: n
          name: Orders
          formula: CountDistinct([Order ID])
        - id: month
          name: Month
          formula: "[Order Month]"
      value:
        columnId: n
      trend:
        columnId: month
    - id: kpi_aov
      name: Avg Order Value
      kind: kpi-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: aov
          name: AOV
          formula: SafeDivide(Sum([Revenue]), CountDistinct([Order ID]))
          format:
            kind: currency
            decimals: 2
        - id: month
          name: Month
          formula: "[Order Month]"
      value:
        columnId: aov
      trend:
        columnId: month
    - id: kpi_margin
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: gm
          name: Gross Margin
          formula: SafeDivide(Sum([Profit]), Sum([Revenue]))
          format:
            kind: percent
            decimals: 1
        - id: month
          name: Month
          formula: "[Order Month]"
      value:
        columnId: gm
      trend:
        columnId: month
    - id: rev_trend
      name: Revenue by month and channel
      kind: line-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: month
          name: Month
          formula: "[Order Month]"
        - id: rev
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: channel
          name: Channel
          formula: "[Channel]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - rev
      color:
        by: category
        column: channel
    - id: rev_category
      name: Revenue by category
      kind: bar-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: rev
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
        sort:
          by: rev
          direction: descending
      yAxis:
        columnIds:
          - rev
      orientation: horizontal
    - id: rev_region
      name: Revenue mix by channel
      kind: donut-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: rev
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: rev
      category:
        columnId: channel
    - id: region_channel
      name: Region x channel
      kind: pivot-table
      source:
        kind: table
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: rev
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: gm
          name: Margin
          formula: SafeDivide(Sum([Profit]), Sum([Revenue]))
          format:
            kind: percent
            decimals: 1
      rowsBy:
        - columnId: region
      columnsBy:
        - columnId: channel
      values:
        - rev
        - gm
      showTotals: true
      conditionalFormats:
        - type: colorScale
          columnIds:
            - rev
    - id: to_explore
      kind: button
      actions:
        - id: go_explore
          trigger: on-click
          effects:
            - effect: navigate
              target:
                type: page
                pageId: explore
      text: Explore order lines
      appearance: outline
    - id: orders
      name: Orders
      description: Governed order lines from the Retail data model, enriched through relationships.
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Orders/Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
          hidden: true
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: store
          name: Store
          formula: "[Store/Store Name]"
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: category
          name: Category
          formula: "[Product/Category]"
        - id: segment
          name: Segment
          formula: "[Customer/Segment]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
        - id: quantity
          name: Quantity
          formula: "[Orders/Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: cost
          name: Cost
          formula: "[Orders/Cost]"
          hidden: true
          format:
            kind: currency
            decimals: 2
        - id: profit
          name: Profit
          formula: "[Revenue] - [Cost]"
          format:
            kind: currency
            decimals: 2
      sort:
        - columnId: order_date
          direction: descending
      conditionalFormats:
        - type: dataBars
          columnIds:
            - revenue
    - id: leaderboard
      name: Store leaderboard
      kind: table
      source:
        kind: table
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: store
          name: Store
          formula: "[Store]"
        - id: rev
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: n
          name: Orders
          formula: CountDistinct([Order ID])
        - id: gm
          name: Margin
          formula: SafeDivide(Sum([Profit]), Sum([Revenue]))
          format:
            kind: percent
            decimals: 1
      groupings:
        - id: by_region
          groupBy:
            - region
        - id: by_store
          groupBy:
            - store
          calculations:
            - rev
            - n
            - gm
          sort:
            - columnId: rev
              direction: descending
  pages:
    - id: overview
      name: Overview
    - id: explore
      name: Explore
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="title" gridColumn="1 / 13" gridRow="1 / 3"/>
      <Element elementId="ctl_region" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="ctl_channel" gridColumn="17 / 21" gridRow="1 / 3"/>
      <Element elementId="ctl_dates" gridColumn="21 / 25" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 7" gridRow="3 / 6"/>
      <Element elementId="kpi_orders" gridColumn="7 / 13" gridRow="3 / 6"/>
      <Element elementId="kpi_aov" gridColumn="13 / 19" gridRow="3 / 6"/>
      <Element elementId="kpi_margin" gridColumn="19 / 25" gridRow="3 / 6"/>
      <Element elementId="rev_trend" gridColumn="1 / 17" gridRow="6 / 14"/>
      <Element elementId="rev_region" gridColumn="17 / 25" gridRow="6 / 14"/>
      <Element elementId="rev_category" gridColumn="1 / 10" gridRow="14 / 22"/>
      <Element elementId="region_channel" gridColumn="10 / 25" gridRow="14 / 22"/>
      <Element elementId="to_explore" gridColumn="1 / 6" gridRow="22 / 23"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="explore">
      <Element elementId="leaderboard" gridColumn="1 / 9" gridRow="1 / 20"/>
      <Element elementId="orders" gridColumn="9 / 25" gridRow="1 / 20"/>
    </Page>
  settings:
    theme:
      preset: daylight
