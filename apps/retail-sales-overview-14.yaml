workbookId: retail-sales-overview-14
name: Retail Sales Overview
description: Sales performance overview using the certified Retail model, with date and channel filters.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Filtered order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Orders/Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: status
          name: Status
          formula: "[Orders/Status]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
        - id: profit
          name: Profit
          formula: "[Orders/Profit]"
        - id: category
          name: Category
          formula: "[Product/Category]"
        - id: product_name
          name: Product Name
          formula: "[Product/Product Name]"
      filters:
        - id: completed
          kind: formula
          formula: '[Status] = "Completed"'
    - id: f_dates
      kind: control
      controlId: order_dates
      controlType: date-range
      label: Order date
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: order_date
    - id: f_channel
      kind: control
      controlId: channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders_base
          columnId: channel
    - id: kpi_revenue
      name: Net Revenue
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: v
      trend:
        columnId: m
    - id: kpi_orders
      name: Order Lines
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Order Lines
          formula: "[Order Count]"
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: v
      trend:
        columnId: m
    - id: kpi_margin
      name: Gross Margin
      kind: kpi-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: v
          name: Gross Margin
          formula: "[Gross Margin]"
          format:
            kind: percent
            decimals: 1
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: v
      trend:
        columnId: m
    - id: trend_revenue
      name: Monthly Revenue Trend
      kind: line-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
    - id: sales_channel
      name: Revenue by Channel
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: sales_category
      name: Revenue by Category
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: category
          name: Category
          formula: "[Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
    - id: top_products
      name: Top Products by Revenue
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: product
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: product
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
      orientation: horizontal
      limit: 10
    - id: data_orders
      name: Order Detail
      kind: table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: order_id
          name: Order ID
        - id: order_date
          name: Order Date
        - id: channel
          name: Channel
        - id: category
          name: Category
        - id: product_name
          name: Product
          formula: "[Product Name]"
        - id: revenue
          name: Revenue
          format:
            kind: currency
            decimals: 0
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
    - id: sales_region
      name: Revenue by Region
      kind: bar-chart
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: region
        sort:
          by: revenue
          direction: descending
      yAxis:
        columnIds:
          - revenue
  pages:
    - id: overview
      name: Overview
      elements:
        - f_dates
        - f_channel
        - kpi_revenue
        - kpi_orders
        - kpi_margin
        - trend_revenue
        - sales_channel
        - sales_category
        - sales_region
        - top_products
        - data_orders
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_dates" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_channel" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 9" gridRow="3 / 7"/>
      <Element elementId="kpi_orders" gridColumn="9 / 17" gridRow="3 / 7"/>
      <Element elementId="kpi_margin" gridColumn="17 / 25" gridRow="3 / 7"/>
      <Element elementId="trend_revenue" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="sales_channel" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="sales_category" gridColumn="1 / 13" gridRow="16 / 25"/>
      <Element elementId="sales_region" gridColumn="13 / 25" gridRow="16 / 25"/>
      <Element elementId="top_products" gridColumn="1 / 25" gridRow="25 / 34"/>
      <Element elementId="data_orders" gridColumn="1 / 25" gridRow="34 / 46"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
