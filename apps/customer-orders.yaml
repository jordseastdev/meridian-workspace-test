workbookId: customer-orders
name: Customer Orders
description: Browse customers and inspect their order history.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_list
      name: Customers
      kind: table
      actions:
        - id: open_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: customer_orders
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer Name
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: loyalty_tier
          name: Loyalty Tier
          formula: "[Loyalty Tier]"
        - id: region
          name: Region
          formula: "[Customer Region]"
      sort:
        - columnId: customer_name
          direction: ascending
      limit: 500
    - id: customer_orders_table
      name: Customer Orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
          hidden: true
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      sort:
        - columnId: order_date
          direction: descending
      limit: 500
    - id: selected_customer_control
      kind: control
      controlId: selected_customer
      controlType: text
      label: Selected customer
      filters:
        - source:
            kind: table
            elementId: customer_orders_table
          columnId: customer_id
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customer_orders">
      <Element elementId="selected_customer_control" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="customer_orders_table" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
  overlays:
    - id: customer_orders
      kind: drawer
      title: Customer Orders
      size: large
      elements:
        - selected_customer_control
        - customer_orders_table
  settings:
    theme:
      preset: daylight
      palette: meridian
