workbookId: support-ticket-triage-8
name: Support Ticket Triage
description: Triage open support tickets, track status, and review ticket details with an assistant.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: tickets
      name: Support Tickets
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: contact_channel
          name: Contact Channel
          formula: "[Contact Channel]"
        - id: category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: ticket_status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: first_response_minutes
          name: First Response Minutes
          formula: "[First Response Minutes]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Resolution Hours]"
        - id: csat_score
          name: CSAT Score
          formula: "[CSAT Score]"
    - id: ticket_state
      name: Ticket Triage State
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: tickets
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          key: ticket_id
        - id: ticket_category
          name: Ticket Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: ticket_status
          name: Ticket Status
          formula: "[Ticket Status]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: assigned_to
          name: Assigned To
          type: text
        - id: triage_status
          name: Triage Status
          type: text
          values:
            - Open
            - Closed
      rowActions:
        - id: assign
          text: Assign
          appearance: outline
          icon: assign
          ask:
            label: Assign to
            placeholder: Name or email
            required: true
          effects:
            - effect: update-rows
              tableElementId: ticket_state
              whichRows:
                type: selected
              values:
                assigned_to:
                  type: answer
        - id: close
          text: Close
          appearance: filled
          icon: archive
          showWhen: IsNull([triage_status]) or [triage_status] != "Closed"
          effects:
            - effect: update-rows
              tableElementId: ticket_state
              whichRows:
                type: selected
              values:
                triage_status:
                  type: constant
                  value: Closed
    - id: kpi_open
      name: Open Tickets
      kind: kpi-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: value
          name: Open Tickets
          formula: CountIf([Ticket Status] = "Open")
      value:
        columnId: value
    - id: kpi_status
      name: Tickets by Status
      kind: kpi-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: value
          name: Tickets
          formula: CountDistinct([Ticket ID])
      value:
        columnId: value
    - id: category_chart
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: tickets
      columns:
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: count
          direction: descending
      yAxis:
        columnIds:
          - count
      color:
        by: single
        value: "#4661c9"
    - id: ticket_cards
      name: Open Ticket Queue
      kind: table
      actions:
        - id: select_ticket
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      source:
        kind: table
        elementId: ticket_state
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: ticket_category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: assigned_to
          name: Assigned To
        - id: triage_status
          name: Triage Status
      filters:
        - id: open_only
          kind: formula
          formula: ([Ticket Status] = "Open" or IsNull([triage_status]) or [triage_status] != "Closed")
      rowActions:
        - id: open_ticket
          text: View ticket
          appearance: outline
          icon: archive
          effects:
            - effect: set-control
              control: selected_ticket
              value:
                type: selection
                columnId: ticket_id
            - effect: open-overlay
              overlayId: ticket_drawer
      display: cards
      card:
        title: ticket_id
        subtitle: ticket_category
        status: priority
        fields:
          - agent
          - assigned_to
    - id: selected_ticket
      kind: control
      controlId: selected_ticket
      controlType: text
      label: Selected ticket
    - id: ticket_detail
      name: Selected Ticket Details
      kind: table
      source:
        kind: table
        elementId: tickets
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: opened_at
          name: Opened At
        - id: contact_channel
          name: Contact Channel
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: ticket_status
          name: Status
          formula: "[Ticket Status]"
        - id: first_response_minutes
          name: First Response Minutes
        - id: resolution_hours
          name: Resolution Hours
        - id: csat_score
          name: CSAT Score
      filters:
        - id: selected_row
          kind: formula
          formula: "[Ticket ID] = [selected_ticket]"
    - id: ask_assistant
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Support Assistant
      appearance: filled
      icon: sparkles
    - id: assistant
      kind: agent
      agentId: support-assistant
      placeholder: Ask about ticket triage or support trends.
      height: 720
  pages:
    - id: triage
      name: Triage
      elements:
        - kpi_open
        - kpi_status
        - category_chart
        - ticket_cards
        - ask_assistant
    - id: data
      name: Data
      visibility: hidden
      elements:
        - tickets
        - ticket_state
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage">
      <Element elementId="kpi_open" gridColumn="1 / 13" gridRow="1 / 5"/>
      <Element elementId="kpi_status" gridColumn="13 / 25" gridRow="1 / 5"/>
      <Element elementId="category_chart" gridColumn="1 / 25" gridRow="5 / 14"/>
      <Element elementId="ticket_cards" gridColumn="1 / 25" gridRow="14 / 26"/>
      <Element elementId="ask_assistant" gridColumn="1 / 5" gridRow="26 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="tickets" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_state" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="ticket_drawer">
      <Element elementId="selected_ticket" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="ticket_detail" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: ticket_drawer
      kind: drawer
      title: Ticket details
      elements:
        - selected_ticket
        - ticket_detail
    - id: assistant_drawer
      kind: drawer
      title: Support assistant
      elements:
        - assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
