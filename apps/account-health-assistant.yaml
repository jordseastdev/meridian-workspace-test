workbookId: account-health-assistant
name: Account Health
description: Account health overview with filtered account, billing, adoption, and invoice metrics plus an account assistant.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts_base
      name: Accounts base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: employee_count
          name: Employee Count
          formula: "[Employee Count]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid_invoice_count
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
        - id: last_feature_use_date
          name: Last Feature Use Date
          formula: "[Last Feature Use Date]"
        - id: churned_date
          name: Churned Date
          formula: "[Churned Date]"
    - id: date_filter
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts_base
          columnId: signup_date
    - id: industry_filter
      kind: control
      controlId: industry
      controlType: list
      label: Industry
      filters:
        - source:
            kind: table
            elementId: accounts_base
          columnId: industry
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: accounts_base
          columnId: region
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Account Health Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
      value:
        columnId: value
    - id: kpi_adoption
      name: Adopted feature rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
      value:
        columnId: value
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: value
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
      value:
        columnId: value
    - id: health_by_plan
      name: Accounts by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: plan
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
      color:
        by: single
        value: "#4661c9"
    - id: adoption_by_industry
      name: Adopted feature rate by industry
      kind: bar-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: adopted
          name: Adopted Feature Count
          formula: Sum([Adopted Feature Count])
        - id: records
          name: Feature Record Count
          formula: Sum([Feature Record Count])
        - id: rate
          name: Adopted Feature Rate
          formula: SafeDivide(Sum([Adopted Feature Count]), Sum([Feature Record Count]))
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: industry
        sort:
          by: rate
          direction: descending
      yAxis:
        columnIds:
          - rate
      color:
        by: single
        value: "#0f766e"
      limit: 10
    - id: account_details
      name: Account health details
      kind: table
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: account_name
          name: Account
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
        - id: adopted
          name: Adopted Features
          formula: "[Adopted Feature Count]"
        - id: last_use
          name: Last Feature Use
          formula: "[Last Feature Use Date]"
        - id: churned
          name: Churned Date
          formula: "[Churned Date]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
    - id: account_assistant
      kind: agent
      agentId: account-health-assistant-agent
      placeholder: Ask about accounts, adoption, billing, and account health.
      height: 520
  pages:
    - id: overview
      name: Overview
      elements:
        - date_filter
        - industry_filter
        - region_filter
        - ask_button
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - health_by_plan
        - adoption_by_industry
        - account_details
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="industry_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="region_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="19 / 23" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="health_by_plan" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="adoption_by_industry" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_details" gridColumn="1 / 25" gridRow="16 / 28"/>
      <Element elementId="accounts_base" gridColumn="1 / 25" gridRow="28 / 40"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="account_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Account Health Assistant
      size: large
      elements:
        - account_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
