workbookId: saas-account-health-2
name: SaaS Account Health
description: Account health overview with adoption, billing, and an assistant for account questions.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_base
      name: Account base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: employee_count
          name: Employee Count
          formula: "[Employee Count]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_records
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoices
          name: Invoice Count
          formula: "[Invoice Count]"
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: status
    - id: f_region
      kind: control
      controlId: region_filter
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: region
    - id: f_signup
      kind: control
      controlId: signup_filter
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: account_base
          columnId: signup_date
    - id: ask_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Account Assistant
      appearance: filled
      icon: sparkles
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Account Share
          formula: SafeDivide([Account Count], [Account Count])
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_adoption
      name: Adopted feature rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: value
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: health_by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: status
          name: Status
          formula: "[Status]"
        - id: accounts
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: status
        sort:
          by: accounts
          direction: descending
      yAxis:
        columnIds:
          - accounts
    - id: billed_by_plan
      name: Billed by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: account_base
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      xAxis:
        columnId: plan
        sort:
          by: billed
          direction: descending
      yAxis:
        columnIds:
          - billed
    - id: account_detail
      name: Account detail
      kind: table
      source:
        kind: table
        elementId: account_base
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: signup
          name: Signup Date
          formula: "[Signup Date]"
        - id: billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adoption
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: active_users
          name: Total Monthly Active Users
          formula: "[Total Monthly Active Users]"
      sort:
        - columnId: billed
          direction: descending
      limit: 100
    - id: assistant
      kind: agent
      agentId: saas-account-health-assistant
      placeholder: Ask about an account, adoption, billing, or lifecycle health.
      height: 600
  pages:
    - id: overview
      name: Account Health
      elements:
        - f_status
        - f_region
        - f_signup
        - ask_button
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - health_by_status
        - billed_by_plan
        - account_detail
    - id: assistant_page
      name: Assistant drawer content
      visibility: hidden
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_status" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_region" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_signup" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="ask_button" gridColumn="19 / 23" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="health_by_status" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="billed_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="16 / 28"/>
      <Element elementId="account_base" gridColumn="1 / 25" gridRow="28 / 40"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_page"/>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: assistant_drawer
      kind: drawer
      title: Account Assistant
      size: large
      elements:
        - assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
