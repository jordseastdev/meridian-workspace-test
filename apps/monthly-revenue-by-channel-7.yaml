workbookId: monthly-revenue-by-channel-7
name: Monthly Revenue by Channel
description: Monthly net revenue trends by sales channel with date and channel filters.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
    - id: f_date
      kind: control
      controlId: order_date_range
      controlType: date-range
      label: Order date range
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: orders
          columnId: order_date
    - id: f_channel
      kind: control
      controlId: sales_channel
      controlType: list
      label: Channel
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: orders
          columnId: channel
    - id: revenue_by_month_channel
      name: Monthly Revenue by Channel
      kind: line-chart
      source:
        kind: table
        elementId: orders
      columns:
        - id: month
          name: Order Month
          formula: "[Order Month]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
      color:
        by: category
        column: channel
        scheme: tableau
      legend:
        position: bottom
  pages:
    - id: overview
      name: Overview
      elements:
        - f_date
        - f_channel
        - revenue_by_month_channel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_channel" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="revenue_by_month_channel" gridColumn="1 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
