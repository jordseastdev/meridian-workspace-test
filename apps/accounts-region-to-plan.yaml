workbookId: accounts-region-to-plan
name: "Accounts: Region to Current Plan"
description: Shows account counts flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: account_data
      name: Account data
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
      visibleAsSource: true
    - id: region_plan_flow
      name: Accounts by Region and Current Plan
      kind: sankey-chart
      source:
        kind: table
        elementId: account_data
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: accounts
          name: Accounts
          formula: CountDistinct([Account ID])
      value:
        columnId: accounts
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: flow
      name: Account Flow
      elements:
        - region_plan_flow
    - id: data
      name: Data
      visibility: hidden
      elements:
        - account_data
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="flow">
      <Element elementId="region_plan_flow" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="account_data" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
