workbookId: revenue-region-month
name: Revenue by Region and Month
description: Monthly revenue by sales region.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: orders_base
      name: Orders Base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
        - id: region
          name: Region
          formula: "[Store/Region]"
    - id: revenue_region_month
      name: Revenue by Region and Month
      kind: pivot-table
      source:
        kind: table
        elementId: orders_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: order_month
          name: Month
          formula: "[Order Month]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      rowsBy:
        - columnId: region
      columnsBy:
        - columnId: order_month
      values:
        - revenue
      showTotals: true
  pages:
    - id: pivot
      name: Revenue Pivot
      elements:
        - revenue_region_month
    - id: data
      name: Data
      visibility: hidden
      elements:
        - orders_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="pivot">
      <Element elementId="revenue_region_month" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="orders_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
