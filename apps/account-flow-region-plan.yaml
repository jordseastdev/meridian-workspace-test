workbookId: account-flow-region-plan
name: "Account Flow: Region to Current Plan"
description: Shows account volume flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts_base
      name: Accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
    - id: region_to_plan
      name: Accounts by Region → Current Plan
      kind: sankey-chart
      source:
        kind: table
        elementId: accounts_base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: CountDistinct([Account ID])
      value:
        columnId: account_count
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: overview
      name: Account Flow
      elements:
        - region_to_plan
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="region_to_plan" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
