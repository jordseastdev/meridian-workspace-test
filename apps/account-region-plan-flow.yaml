workbookId: account-region-plan-flow
name: "Account Flow: Region to Current Plan"
description: Shows account counts flowing from region to current plan.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base
      name: Account Base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: Count()
    - id: region_plan
      name: Accounts by Region → Current Plan
      kind: sankey-chart
      source:
        kind: table
        elementId: base
      columns:
        - id: region
          name: Region
          formula: "[Region]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: account_count
          name: Account Count
          formula: Count()
      value:
        columnId: account_count
      from:
        columnId: region
      to:
        columnId: current_plan
  pages:
    - id: flow
      name: Account Flow
      elements:
        - region_plan
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="flow">
      <Element elementId="region_plan" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
