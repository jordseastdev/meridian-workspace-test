workbookId: card-list-table-demo
name: "Card list demo: deals as cards"
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals
      name: Deal requests
      kind: table
      actions:
        - id: picked
          trigger: on-select
          effects:
            - effect: notify
              message: Deal selected
              level: info
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[DEALS/Deal Id]"
        - id: account
          name: Account
          formula: "[DEALS/Account]"
        - id: owner
          name: Owner
          formula: "[DEALS/Owner]"
        - id: discount
          name: Discount
          formula: "[DEALS/Submitted Discount]"
          format:
            kind: percent
            decimals: 0
      rowActions:
        - id: flag
          text: Flag
          appearance: outline
          effects:
            - effect: notify
              message: Flagged
              level: info
      display: cards
      card:
        title: account
        subtitle: deal_id
        fields:
          - owner
          - discount
    - id: review
      name: Approve discounts
      kind: input-table
      inputMode: edit
      source:
        kind: linked
        from: deals
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          key: deal_id
        - id: account
          name: Account
          formula: "[Account]"
        - id: discount
          name: Discount
          formula: "[Discount]"
          format:
            kind: percent
            decimals: 0
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: reviewed_by
          name: Reviewed by
          type: text
          readOnly: true
        - id: reviewed_at
          name: Reviewed at
          type: datetime
          readOnly: true
      rowActions:
        - id: approve
          text: Approve
          appearance: filled
          icon: check
          showWhen: IsNull([decision])
          effects:
            - effect: update-rows
              tableElementId: review
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Approved
                reviewed_by:
                  type: user
                  field: email
                reviewed_at:
                  type: now
            - effect: notify
              message: Approved
              level: success
        - id: reject
          text: Reject
          appearance: outline
          icon: x
          showWhen: IsNull([decision])
          confirm: Reject {{deal_id}}?
          effects:
            - effect: update-rows
              tableElementId: review
              whichRows:
                type: selected
              values:
                decision:
                  type: constant
                  value: Rejected
                reviewed_by:
                  type: user
                  field: email
                reviewed_at:
                  type: now
            - effect: notify
              message: Rejected
              level: success
      display: cards
      card:
        title: account
        subtitle: deal_id
        status: decision
        fields:
          - discount
          - reviewed_by
          - reviewed_at
  pages:
    - id: p1
      name: Approvals
  layout: <Page id="p1" type="grid" gridTemplateColumns="repeat(24, 1fr)"><Element elementId="review" gridColumn="1 / 25" gridRow="1 / 14"/><Element elementId="deals" gridColumn="1 / 25" gridRow="14 / 24"/></Page>
