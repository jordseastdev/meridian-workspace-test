workbookId: discount-approvals
name: Discount Approvals
description: Sales team queue for reviewing discount requests and monitoring approval progress.
folderId: sales
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deals_base
      name: Deal Data
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
      visibleAsSource: true
    - id: decisions
      name: Deal Decisions
      kind: input-table
      inputMode: edit
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: account
          name: Account
          type: text
          readOnly: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
        - id: decided_by
          name: Decided By
          type: text
          readOnly: true
        - id: decided_at
          name: Decided At
          type: datetime
          readOnly: true
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: region
    - id: stage_filter
      kind: control
      controlId: stage
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: deals_base
          columnId: stage
    - id: deal_queue
      name: Review Queue
      kind: table
      actions:
        - id: open_details
          trigger: on-select
          effects:
            - effect: open-overlay
              overlayId: deal_details
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: list_amount
          name: List Amount
        - id: submitted_discount
          name: Submitted Discount
      rowActions:
        - id: approve
          text: Approve
          appearance: filled
          icon: check
          effects:
            - effect: insert-rows
              tableElementId: decisions
              values:
                deal_id:
                  type: selection
                  columnId: deal_id
                account:
                  type: selection
                  columnId: account
                decision:
                  type: constant
                  value: Approved
                decided_by:
                  type: user
                  field: email
                decided_at:
                  type: now
            - effect: notify
              message: Deal approved
              level: success
        - id: reject
          text: Reject
          appearance: danger
          icon: x
          confirm: Reject {{account}}?
          effects:
            - effect: insert-rows
              tableElementId: decisions
              values:
                deal_id:
                  type: selection
                  columnId: deal_id
                account:
                  type: selection
                  columnId: account
                decision:
                  type: constant
                  value: Rejected
                decided_by:
                  type: user
                  field: email
                decided_at:
                  type: now
            - effect: notify
              message: Deal rejected
              level: success
      display: cards
      card:
        title: account
        subtitle: owner
        fields:
          - region
          - list_amount
          - submitted_discount
    - id: pending_kpi
      name: Pending Deals
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: v
          name: Pending Deals
          formula: CountIf([Status] = "Open")
      value:
        columnId: v
    - id: discount_kpi
      name: Total Discount Requested
      kind: kpi-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: v
          name: Total Discount Requested
          formula: Sum([List Amount] * [Submitted Discount])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: v
    - id: discount_region
      name: Submitted Discount by Region
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: region
          name: Region
        - id: discount
          name: Submitted Discount
          formula: Avg([Submitted Discount])
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: region
        sort:
          by: discount
          direction: descending
      yAxis:
        columnIds:
          - discount
      color:
        by: single
        value: "#4661c9"
    - id: discount_stage
      name: Submitted Discount by Stage
      kind: bar-chart
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: stage
          name: Stage
        - id: discount
          name: Submitted Discount
          formula: Avg([Submitted Discount])
          format:
            kind: percent
            decimals: 1
      xAxis:
        columnId: stage
        sort:
          by: discount
          direction: descending
      yAxis:
        columnIds:
          - discount
      color:
        by: single
        value: "#4661c9"
    - id: deal_details
      name: Deal Details
      kind: table
      source:
        kind: table
        elementId: deals_base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: list_amount
          name: List Amount
        - id: submitted_discount
          name: Submitted Discount
    - id: ask_assistant_button
      kind: button
      actions:
        - id: ask
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: assistant_drawer
      text: Ask Deal Review Assistant
      appearance: filled
      icon: sparkles
    - id: deal_assistant
      kind: agent
      agentId: discount-approvals-assistant
      placeholder: Ask about the discount queue or approval trends
      height: 600
  pages:
    - id: review
      name: Review Queue
      elements:
        - region_filter
        - stage_filter
        - ask_assistant_button
        - deal_queue
    - id: analytics
      name: Approval Analytics
      elements:
        - region_filter
        - stage_filter
        - pending_kpi
        - discount_kpi
        - discount_region
        - discount_stage
    - id: helper_data
      name: Helper Data
      visibility: hidden
      elements:
        - deals_base
        - decisions
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_assistant_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="deal_queue" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="region_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="stage_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="pending_kpi" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="discount_kpi" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="discount_region" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="discount_stage" gridColumn="13 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="helper_data">
      <Element elementId="deals_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="decisions" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="deal_details">
      <Element elementId="deal_details" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Overlay>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="assistant_drawer">
      <Element elementId="deal_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: deal_details
      kind: drawer
      title: Deal Details
      size: large
      elements:
        - deal_details
    - id: assistant_drawer
      kind: drawer
      title: Deal Review Assistant
      size: large
      elements:
        - deal_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
