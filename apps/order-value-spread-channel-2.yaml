workbookId: order-value-spread-channel-2
name: Order Value Spread by Channel
description: Distribution of net order-line values across sales channels.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: order_lines
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
      limit: 50000
    - id: f_order_date
      kind: control
      controlId: order_date_range
      controlType: date-range
      label: Order date
      value:
        start: 2023-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: order_lines
          columnId: order_date
    - id: order_value_by_channel
      name: Order line value distribution by channel
      kind: box-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_value
          name: Order Value
          formula: "[Order Value]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: order_value
      category:
        columnId: channel
  pages:
    - id: overview
      name: Order Value Spread
      elements:
        - f_order_date
        - order_value_by_channel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - order_lines
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_order_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="order_value_by_channel" gridColumn="1 / 25" gridRow="3 / 12"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="order_lines" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
