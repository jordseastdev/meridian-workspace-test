workbookId: customer-orders-8
name: Customer Orders
description: Browse customers and open their order history.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_list
      name: Customers
      kind: table
      actions:
        - id: open_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: picked_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: orders_drawer
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: region
          name: Region
          formula: "[Customer Region]"
      sort:
        - columnId: customer_name
          direction: ascending
    - id: picked_customer
      kind: control
      controlId: picked_customer
      controlType: text
      label: Selected customer
      filters:
        - source:
            kind: table
            elementId: order_list
          columnId: customer_id
    - id: order_list
      name: Customer Orders
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_id
          name: Order ID
          formula: "[Order ID]"
        - id: order_date
          name: Order Date
          formula: "[Order Date]"
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: quantity
          name: Quantity
          formula: "[Quantity]"
        - id: revenue
          name: Revenue
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 2
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
      filters:
        - id: selected_customer
          kind: formula
          formula: "[Customer ID] = [picked_customer]"
      sort:
        - columnId: order_date
          direction: descending
      limit: 100
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="orders_drawer">
      <Element elementId="picked_customer" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="order_list" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Overlay>
  overlays:
    - id: orders_drawer
      kind: drawer
      title: Customer order history
      elements:
        - picked_customer
        - order_list
  settings:
    theme:
      preset: daylight
      palette: meridian
