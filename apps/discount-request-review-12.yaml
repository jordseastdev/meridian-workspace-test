workbookId: discount-request-review-12
name: Discount Request Review
description: Managers review CRM discount requests and record an approval or rejection with a note.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: intro
      kind: text
      body: Review each discount request below. Record a decision and note in the decision table.
    - id: base
      name: Discount Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age
          name: Age Days
          formula: "[Age Days]"
      sort:
        - columnId: age
          direction: descending
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      filters:
        - source:
            kind: table
            elementId: base
          columnId: status
    - id: f_stage
      kind: control
      controlId: stage_filter
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: base
          columnId: stage
    - id: requests
      name: Requests
      kind: table
      source:
        kind: table
        elementId: base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: age
          name: Age Days
      sort:
        - columnId: age
          direction: descending
    - id: decision
      name: Decision notes
      kind: sheet
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
          required: true
        - id: reviewer
          name: Reviewer
          type: text
          default:
            kind: user
          readOnly: true
        - id: reviewed_at
          name: Reviewed At
          type: date
          default:
            kind: today
          readOnly: true
  pages:
    - id: review
      name: Review Requests
      elements:
        - intro
        - f_status
        - f_stage
        - requests
        - decision
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="intro" gridColumn="1 / 25" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="1 / 7" gridRow="3 / 5"/>
      <Element elementId="f_stage" gridColumn="7 / 13" gridRow="3 / 5"/>
      <Element elementId="requests" gridColumn="1 / 25" gridRow="5 / 17"/>
      <Element elementId="decision" gridColumn="1 / 25" gridRow="17 / 29"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
