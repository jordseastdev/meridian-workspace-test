workbookId: customer-orders-7
name: Customer Orders
description: Browse customers and open a drawer with their order history.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: customer_list
      name: Customers
      kind: table
      actions:
        - id: open_customer_orders
          trigger: on-select
          effects:
            - effect: set-control
              control: selected_customer
              value:
                type: selection
                columnId: customer_id
            - effect: open-overlay
              overlayId: customer_drawer
      source:
        kind: data-model
        dataModelId: retail
        elementId: customers
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[Customer ID]"
        - id: customer_name
          name: Customer
          formula: "[Customer Name]"
        - id: segment
          name: Segment
          formula: "[Segment]"
        - id: region
          name: Region
          formula: "[Customer Region]"
      sort:
        - columnId: customer_name
          direction: ascending
    - id: selected_customer
      kind: control
      controlId: selected_customer
      controlType: text
      label: Selected customer
      value: ""
  pages:
    - id: customers
      name: Customers
      elements:
        - customer_list
    - id: detail
      name: Customer Orders
      visibility: hidden
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customers">
      <Element elementId="customer_list" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="selected_customer" gridColumn="1 / 7" gridRow="13 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="detail"/>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="customer_drawer"/>
  overlays:
    - id: customer_drawer
      kind: drawer
      title: Customer Orders
  settings:
    theme:
      preset: daylight
      palette: meridian
