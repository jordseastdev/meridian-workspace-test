workbookId: regional-revenue-heatmap
name: Regional Revenue by Product Category
description: Explore net revenue across sales regions and product categories.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: revenue_heatmap
      name: Revenue by Region and Product Category
      kind: heatmap-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
      color:
        by: scale
        column: revenue
        scheme: blues
      value:
        columnId: revenue
      category:
        columnId: region
  pages:
    - id: overview
      name: Revenue Heatmap
      elements:
        - revenue_heatmap
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="revenue_heatmap" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
