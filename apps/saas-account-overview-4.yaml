workbookId: saas-account-overview-4
name: SaaS Account Overview
description: Account-level view of customer lifecycle, billing, and feature adoption.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Account base
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: company_size
          name: Company Size
          formula: "[Company Size]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
        - id: paid_invoice_count
          name: Paid Invoice Count
          formula: "[Paid Invoice Count]"
        - id: invoice_count
          name: Invoice Count
          formula: "[Invoice Count]"
    - id: status_filter
      kind: control
      controlId: status
      controlType: list
      label: Status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: region_filter
      kind: control
      controlId: region
      controlType: list
      label: Region
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: region
    - id: signup_filter
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: signup_date
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Total billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_adoption
      name: Feature adoption
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Feature Adoption Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: accounts_by_plan
      name: Accounts by current plan
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: value
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: plan
        sort:
          by: value
          direction: descending
      yAxis:
        columnIds:
          - value
      limit: 10
    - id: account_detail
      name: Account details
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Feature Count
          formula: "[Adopted Feature Count]"
        - id: feature_record_count
          name: Feature Record Count
          formula: "[Feature Record Count]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
    - id: plan_filter
      kind: control
      controlId: current_plan
      controlType: list
      label: Current plan
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: current_plan
    - id: signups_by_month
      name: Signups by month
      kind: line-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: signup_month
          name: Signup month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: "[Account Count]"
      xAxis:
        columnId: signup_month
      yAxis:
        columnIds:
          - signups
  pages:
    - id: overview
      name: Overview
      elements:
        - status_filter
        - region_filter
        - signup_filter
        - plan_filter
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - signups_by_month
        - accounts_by_plan
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="status_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="region_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="signup_filter" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="plan_filter" gridColumn="19 / 25" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="signups_by_month" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="accounts_by_plan" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
