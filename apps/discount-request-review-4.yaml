workbookId: discount-request-review-4
name: Discount Request Review
description: Managers review discount requests and record approval or rejection decisions with notes.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: deal_base
      name: Discount Requests
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: deals
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[Deal ID]"
        - id: account
          name: Account
          formula: "[Account]"
        - id: owner
          name: Owner
          formula: "[Owner]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: stage
          name: Stage
          formula: "[Stage]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: list_amount
          name: List Amount
          formula: "[List Amount]"
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          formula: "[Submitted Discount]"
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
          formula: "[Age Days]"
      sort:
        - columnId: age_days
          direction: descending
    - id: f_stage
      kind: control
      controlId: stage_filter
      controlType: list
      label: Stage
      filters:
        - source:
            kind: table
            elementId: deal_base
          columnId: stage
    - id: f_status
      kind: control
      controlId: status_filter
      controlType: list
      label: Status
      value: Open
      filters:
        - source:
            kind: table
            elementId: deal_base
          columnId: status
    - id: request_queue
      name: Discount Requests
      kind: table
      source:
        kind: table
        elementId: deal_base
      columns:
        - id: deal_id
          name: Deal ID
        - id: account
          name: Account
        - id: owner
          name: Owner
        - id: region
          name: Region
        - id: stage
          name: Stage
        - id: status
          name: Status
        - id: list_amount
          name: List Amount
          format:
            kind: currency
            decimals: 0
        - id: submitted_discount
          name: Submitted Discount
          format:
            kind: percent
            decimals: 0
        - id: age_days
          name: Age Days
      sort:
        - columnId: age_days
          direction: descending
      limit: 200
    - id: decision_panel
      name: Decision Notes
      kind: sheet
      inputMode: append
      source:
        kind: empty
        connectionId: default
      columns:
        - id: deal_id
          name: Deal ID
          type: text
          required: true
        - id: decision
          name: Decision
          type: text
          values:
            - Approved
            - Rejected
          required: true
        - id: note
          name: Note
          type: text
          multiline: true
          required: true
        - id: decided_by
          name: Decided By
          type: text
          default:
            kind: user
          readOnly: true
        - id: decided_at
          name: Decided At
          type: datetime
          default:
            kind: now
          readOnly: true
  pages:
    - id: review
      name: Review Requests
      elements:
        - f_stage
        - f_status
        - request_queue
        - decision_panel
    - id: data
      name: Data
      visibility: hidden
      elements:
        - deal_base
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="review">
      <Element elementId="f_stage" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="request_queue" gridColumn="1 / 25" gridRow="3 / 15"/>
      <Element elementId="decision_panel" gridColumn="1 / 25" gridRow="15 / 27"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="deal_base" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
