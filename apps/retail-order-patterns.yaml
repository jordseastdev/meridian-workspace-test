workbookId: retail-order-patterns
name: Retail Order Patterns
description: Explore revenue concentration, order-status flows, and order amount distributions across retail sales channels.
folderId: retail
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: order_lines
      name: Order Lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: channel
          name: Channel
          formula: "[Orders/Channel]"
        - id: product_category
          name: Product Category
          formula: "[Product/Category]"
        - id: order_status
          name: Order Status
          formula: "[Orders/Status]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
    - id: revenue_heatmap
      name: Revenue by Channel and Product Category
      kind: heatmap-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: product_category
          name: Product Category
          formula: "[Product Category]"
        - id: total_revenue
          name: Total Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: channel
      color:
        by: scale
        column: total_revenue
        scheme: blues
      value:
        columnId: total_revenue
      category:
        columnId: product_category
    - id: channel_status_flow
      name: "Revenue Flow: Channel to Order Status"
      kind: sankey-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_status
          name: Order Status
          formula: "[Order Status]"
        - id: total_revenue
          name: Total Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      value:
        columnId: total_revenue
      from:
        columnId: channel
      to:
        columnId: order_status
    - id: order_amount_distribution
      name: Order Amounts by Channel
      kind: box-chart
      source:
        kind: table
        elementId: order_lines
      columns:
        - id: channel
          name: Channel
          formula: "[Channel]"
        - id: order_amount
          name: Order Amount
          formula: "[Revenue]"
          format:
            kind: currency
            decimals: 0
      color:
        by: single
        value: "#4661c9"
      value:
        columnId: order_amount
      category:
        columnId: channel
  pages:
    - id: overview
      name: Overview
      elements:
        - revenue_heatmap
        - channel_status_flow
        - id: order_amount_distribution
          width: 24
    - id: data
      name: Data
      visibility: hidden
      elements:
        - order_lines
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="revenue_heatmap" gridColumn="1 / 13" gridRow="1 / 10"/>
      <Element elementId="channel_status_flow" gridColumn="13 / 25" gridRow="1 / 10"/>
      <Element elementId="order_amount_distribution" gridColumn="1 / 25" gridRow="10 / 19"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="order_lines" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
