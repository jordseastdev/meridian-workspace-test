workbookId: revenue-region-category-heatmap
name: Revenue by Region and Category
description: Revenue heatmap by store region and product category using the Retail semantic model.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: region_category_revenue
      name: Revenue by Region and Product Category
      kind: heatmap-chart
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: region
          name: Region
          formula: "[Store/Region]"
        - id: category
          name: Product Category
          formula: "[Product/Category]"
        - id: revenue
          name: Revenue
          formula: "[Total Revenue]"
          format:
            kind: currency
            decimals: 0
      xAxis:
        columnId: category
      color:
        by: scale
        column: revenue
        scheme: blues
      value:
        columnId: revenue
      category:
        columnId: region
  pages:
    - id: heatmap
      name: Revenue Heatmap
      elements:
        - region_category_revenue
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="heatmap">
      <Element elementId="region_category_revenue" gridColumn="1 / 25" gridRow="1 / 10"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
