workbookId: saas-account-overview-5
name: SaaS Account Overview
description: Account-level view of lifecycle, billing, and feature adoption.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: accounts
      name: Accounts
      kind: table
      source:
        kind: data-model
        dataModelId: saas-account-obt
        elementId: account_obt
      columns:
        - id: account_id
          name: Account ID
          formula: "[Account ID]"
        - id: account_name
          name: Account Name
          formula: "[Account Name]"
        - id: domain
          name: Domain
          formula: "[Domain]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Current Plan
          formula: "[Current Plan]"
        - id: employee_count
          name: Employees
          formula: "[Employee Count]"
        - id: total_billed
          name: Total Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Features
          formula: "[Adopted Feature Count]"
      visibleAsSource: true
    - id: f_signup
      kind: control
      controlId: signup_date
      controlType: date-range
      label: Signup date
      value:
        start: 2022-01-02
        end: 2025-09-28
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: signup_date
    - id: f_region
      kind: control
      controlId: region
      controlType: list
      label: Region
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: region
    - id: f_status
      kind: control
      controlId: status
      controlType: list
      label: Lifecycle status
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: status
    - id: kpi_accounts
      name: Accounts
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Accounts
          formula: "[Account Count]"
      value:
        columnId: value
    - id: kpi_billed
      name: Total billed
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Total Billed
          formula: "[Total Billed Across Accounts]"
          format:
            kind: currency
            decimals: 2
      value:
        columnId: value
    - id: kpi_adoption
      name: Adopted feature rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Adopted Feature Rate
          formula: "[Adopted Feature Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: kpi_paid
      name: Paid invoice rate
      kind: kpi-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: value
          name: Paid Invoice Rate
          formula: "[Paid Invoice Rate]"
          format:
            kind: percent
            decimals: 1
      value:
        columnId: value
    - id: by_status
      name: Accounts by status
      kind: bar-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: category
          name: Status
          formula: "[Status]"
        - id: value
          name: Accounts
          formula: "[Account Count]"
      xAxis:
        columnId: category
      yAxis:
        columnIds:
          - value
      color:
        by: single
        value: "#4661c9"
    - id: account_detail
      name: Account details
      kind: table
      source:
        kind: table
        elementId: accounts
      columns:
        - id: account_name
          name: Account
          formula: "[Account Name]"
        - id: region
          name: Region
          formula: "[Region]"
        - id: industry
          name: Industry
          formula: "[Industry]"
        - id: status
          name: Status
          formula: "[Status]"
        - id: current_plan
          name: Plan
          formula: "[Current Plan]"
        - id: signup_date
          name: Signup Date
          formula: "[Signup Date]"
        - id: total_billed
          name: Billed
          formula: "[Total Billed]"
          format:
            kind: currency
            decimals: 2
        - id: adopted_feature_count
          name: Adopted Features
          formula: "[Adopted Feature Count]"
      sort:
        - columnId: total_billed
          direction: descending
      limit: 100
    - id: f_plan
      kind: control
      controlId: plan
      controlType: list
      label: Plan
      selectionMode: multiple
      filters:
        - source:
            kind: table
            elementId: accounts
          columnId: current_plan
    - id: signup_monthly
      name: Signups by month
      kind: line-chart
      source:
        kind: table
        elementId: accounts
      columns:
        - id: month
          name: Signup month
          formula: DateTrunc("month", [Signup Date])
        - id: signups
          name: Signups
          formula: "[Account Count]"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - signups
  pages:
    - id: overview
      name: Overview
      elements:
        - f_signup
        - f_region
        - f_status
        - f_plan
        - kpi_accounts
        - kpi_billed
        - kpi_adoption
        - kpi_paid
        - signup_monthly
        - by_status
        - account_detail
    - id: data
      name: Data
      visibility: hidden
      elements:
        - accounts
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_signup" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="f_region" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="f_status" gridColumn="13 / 19" gridRow="1 / 3"/>
      <Element elementId="f_plan" gridColumn="19 / 25" gridRow="1 / 3"/>
      <Element elementId="kpi_accounts" gridColumn="1 / 7" gridRow="3 / 7"/>
      <Element elementId="kpi_billed" gridColumn="7 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_adoption" gridColumn="13 / 19" gridRow="3 / 7"/>
      <Element elementId="kpi_paid" gridColumn="19 / 25" gridRow="3 / 7"/>
      <Element elementId="signup_monthly" gridColumn="1 / 13" gridRow="7 / 16"/>
      <Element elementId="by_status" gridColumn="13 / 25" gridRow="7 / 16"/>
      <Element elementId="account_detail" gridColumn="1 / 25" gridRow="16 / 28"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="accounts" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
