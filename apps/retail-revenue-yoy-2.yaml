workbookId: retail-revenue-yoy-2
name: "Revenue: This Year vs Last Year"
description: Monthly revenue comparison for this year and last year, with year-over-year KPI context.
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: base_orders
      name: Order lines
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: orders
      columns:
        - id: order_date
          name: Order Date
          formula: "[Orders/Order Date]"
        - id: order_month
          name: Order Month
          formula: "[Orders/Order Month]"
        - id: revenue
          name: Revenue
          formula: "[Orders/Revenue]"
          format:
            kind: currency
            decimals: 0
      filters:
        - id: completed_only
          kind: formula
          formula: '[Orders/Status] = "Completed"'
    - id: f_order_date
      kind: control
      controlId: order_date
      controlType: date-range
      label: Order date
      value:
        start: 2025-01-01
        end: 2025-09-27
      filters:
        - source:
            kind: table
            elementId: base_orders
          columnId: order_date
    - id: kpi_revenue
      name: Revenue this year
      kind: kpi-chart
      source:
        kind: table
        elementId: base_orders
      columns:
        - id: v
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
        - id: m
          name: Month
          formula: DateTrunc("month", [Order Date])
      value:
        columnId: v
      trend:
        columnId: m
    - id: kpi_change
      name: Revenue change vs last year
      kind: kpi-chart
      source:
        kind: table
        elementId: base_orders
      columns:
        - id: v
          name: YoY change
          formula: SafeDivide(Sum([Revenue]) - SumIf([Revenue], DatePart("year", [Order Date]) = DatePart("year", DateAdd("year", -1, Today()))), SumIf([Revenue], DatePart("year", [Order Date]) = DatePart("year", DateAdd("year", -1, Today()))))
          format:
            kind: percent
            decimals: 1
      value:
        columnId: v
    - id: monthly_revenue
      name: "Monthly revenue: this year vs last year"
      kind: line-chart
      source:
        kind: table
        elementId: base_orders
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Order Date])
        - id: revenue
          name: Revenue
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
      filters:
        - id: current_and_prior
          kind: formula
          formula: DatePart("year", [Order Date]) >= DatePart("year", Today()) - 1
        - id: completed_only
          kind: formula
          formula: '[Status] = "Completed"'
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - revenue
  pages:
    - id: overview
      name: Revenue Overview
      elements:
        - f_order_date
        - kpi_revenue
        - kpi_change
        - monthly_revenue
    - id: data
      name: Data
      visibility: hidden
      elements:
        - base_orders
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="overview">
      <Element elementId="f_order_date" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="kpi_revenue" gridColumn="1 / 13" gridRow="3 / 7"/>
      <Element elementId="kpi_change" gridColumn="13 / 25" gridRow="3 / 7"/>
      <Element elementId="monthly_revenue" gridColumn="1 / 25" gridRow="7 / 16"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="base_orders" gridColumn="1 / 25" gridRow="1 / 13"/>
    </Page>
  settings:
    theme:
      preset: daylight
      palette: meridian
