workbookId: support-ticket-triage-2
name: Support Ticket Triage
description: Triage open support tickets and monitor ticket volume and resolution performance.
folderId: apps
contents:
  schemaVersion: 1
  kind: workbook
  elements:
    - id: ticket_base
      name: Ticket base
      kind: table
      source:
        kind: data-model
        dataModelId: retail
        elementId: support_tickets
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[Ticket ID]"
        - id: category
          name: Category
          formula: "[Ticket Category]"
        - id: priority
          name: Priority
          formula: "[Priority]"
        - id: agent
          name: Agent
          formula: "[Agent]"
        - id: opened_at
          name: Opened At
          formula: "[Opened At]"
        - id: status
          name: Status
          formula: "[Ticket Status]"
        - id: resolution_hours
          name: Resolution Hours
          formula: "[Resolution Hours]"
      visibleAsSource: true
    - id: ticket_actions
      name: Ticket actions
      kind: input-table
      inputMode: edit
      source:
        kind: empty
        connectionId: default
      columns:
        - id: ticket_id
          name: Ticket ID
          type: text
          required: true
        - id: action
          name: Action
          type: text
          values:
            - Assigned
            - Closed
          required: true
        - id: acted_by
          name: Acted By
          type: text
          required: true
        - id: acted_at
          name: Acted At
          type: datetime
          required: true
    - id: date_filter
      kind: control
      controlId: opened_dates
      controlType: date-range
      label: Opened date
      value:
        start: 2023-01-02
        end: 2025-10-07
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: opened_at
    - id: priority_filter
      kind: control
      controlId: priority
      controlType: list
      label: Priority
      mode: multi
      source:
        kind: source
        source:
          kind: table
          elementId: ticket_base
        columnId: priority
      filters:
        - source:
            kind: table
            elementId: ticket_base
          columnId: priority
    - id: ticket_cards
      name: Open Tickets
      kind: table
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: ticket_id
          name: Ticket ID
        - id: category
          name: Category
        - id: priority
          name: Priority
        - id: agent
          name: Agent
        - id: opened_at
          name: Opened At
        - id: status
          name: Status
      filters:
        - id: still_open
          kind: formula
          formula: '[Status] = "Open"'
      sort:
        - columnId: opened_at
          direction: ascending
      rowActions:
        - id: assign_to_me
          text: Assign to me
          appearance: filled
          icon: assign
          showWhen: '[status] = "Open"'
          effects:
            - effect: insert-rows
              tableElementId: ticket_actions
              values:
                ticket_id:
                  type: selection
                  columnId: ticket_id
                action:
                  type: constant
                  value: Assigned
                acted_by:
                  type: user
                  field: email
                acted_at:
                  type: now
            - effect: notify
              message: Assigned to you
              level: success
        - id: close_ticket
          text: Close
          appearance: outline
          icon: archive
          showWhen: '[status] = "Open"'
          confirm: Close ticket {{ticket_id}}?
          effects:
            - effect: insert-rows
              tableElementId: ticket_actions
              values:
                ticket_id:
                  type: selection
                  columnId: ticket_id
                action:
                  type: constant
                  value: Closed
                acted_by:
                  type: user
                  field: email
                acted_at:
                  type: now
            - effect: notify
              message: Ticket closed
              level: success
      display: cards
      card:
        title: ticket_id
        subtitle: category
        status: status
        fields:
          - priority
          - agent
          - opened_at
    - id: tickets_category
      name: Tickets by Category
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: category
          name: Category
        - id: ticket_count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: category
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
      color:
        by: single
        value: "#4661c9"
    - id: tickets_priority
      name: Tickets by Priority
      kind: bar-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: priority
          name: Priority
        - id: ticket_count
          name: Tickets
          formula: CountDistinct([Ticket ID])
      xAxis:
        columnId: priority
        sort:
          by: ticket_count
          direction: descending
      yAxis:
        columnIds:
          - ticket_count
      color:
        by: single
        value: "#4661c9"
    - id: resolution_trend
      name: Average Resolution Hours Over Time
      kind: line-chart
      source:
        kind: table
        elementId: ticket_base
      columns:
        - id: month
          name: Month
          formula: DateTrunc("month", [Opened At])
        - id: avg_resolution
          name: Avg Resolution Hours
          formula: Avg([Resolution Hours])
          format:
            kind: number
            decimals: 1
      filters:
        - id: resolved_only
          kind: formula
          formula: "[Resolution Hours] > 0"
      xAxis:
        columnId: month
      yAxis:
        columnIds:
          - avg_resolution
    - id: ask_triage_button
      kind: button
      actions:
        - id: open_assistant
          trigger: on-click
          effects:
            - effect: open-overlay
              overlayId: triage_assistant
      text: Ask Ticket Triage Assistant
      appearance: filled
      icon: sparkles
    - id: triage_assistant
      kind: agent
      agentId: ticket-triage-assistant
      placeholder: Ask about ticket trends or triage priorities
      height: 560
  pages:
    - id: queue
      name: Open Tickets
      elements:
        - date_filter
        - priority_filter
        - ask_triage_button
        - ticket_cards
    - id: analytics
      name: Ticket Analytics
      elements:
        - date_filter
        - priority_filter
        - tickets_category
        - tickets_priority
        - resolution_trend
    - id: data
      name: Data
      visibility: hidden
      elements:
        - ticket_base
        - ticket_actions
  layout: |
    <?xml version="1.0" encoding="utf-8"?>
    <!-- generated by Meridian from pages[].elements -->
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="queue">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="ask_triage_button" gridColumn="13 / 17" gridRow="1 / 3"/>
      <Element elementId="ticket_cards" gridColumn="1 / 25" gridRow="3 / 15"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="analytics">
      <Element elementId="date_filter" gridColumn="1 / 7" gridRow="1 / 3"/>
      <Element elementId="priority_filter" gridColumn="7 / 13" gridRow="1 / 3"/>
      <Element elementId="tickets_category" gridColumn="1 / 13" gridRow="3 / 12"/>
      <Element elementId="tickets_priority" gridColumn="13 / 25" gridRow="3 / 12"/>
      <Element elementId="resolution_trend" gridColumn="1 / 25" gridRow="12 / 21"/>
    </Page>
    <Page type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="data">
      <Element elementId="ticket_base" gridColumn="1 / 25" gridRow="1 / 13"/>
      <Element elementId="ticket_actions" gridColumn="1 / 25" gridRow="13 / 25"/>
    </Page>
    <Overlay type="grid" gridTemplateColumns="repeat(24, 1fr)" gridTemplateRows="auto" id="triage_assistant">
      <Element elementId="triage_assistant" gridColumn="1 / 25" gridRow="1 / 19"/>
    </Overlay>
  overlays:
    - id: triage_assistant
      kind: drawer
      title: Ticket Triage Assistant
      size: large
      elements:
        - triage_assistant
  settings:
    theme:
      preset: daylight
      palette: meridian
