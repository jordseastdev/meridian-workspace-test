    - id: nps_responses
      name: NPS Responses
      description: Quarterly in-app NPS survey responses.
      kind: table
      grain: response_id
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - SAAS
          - NPS_RESPONSES
      columns:
        - id: response_id
          name: Response ID
          formula: "[NPS_RESPONSES/RESPONSE_ID]"
          role: identifier
        - id: account_id
          name: Account ID
          formula: "[NPS_RESPONSES/ACCOUNT_ID]"
          hidden: true
          role: identifier
        - id: response_date
          name: Response Date
          formula: "[NPS_RESPONSES/RESPONSE_DATE]"
          role: time
        - id: score
          name: Score
          description: 0 to 10.
          formula: "[NPS_RESPONSES/SCORE]"
          role: measure
        - id: nps_category
          name: NPS Category
          description: Promoter (9-10), Passive (7-8) or Detractor (0-6).
          formula: "[NPS_RESPONSES/NPS_CATEGORY]"
          role: dimension
        - id: primary_theme
          name: Primary Theme
          formula: "[NPS_RESPONSES/PRIMARY_THEME]"
          role: dimension
        - id: respondent_role
          name: Respondent Role
          formula: "[NPS_RESPONSES/RESPONDENT_ROLE]"
          role: dimension
      metrics:
        - id: nps
          name: NPS
          formula: (SafeDivide(CountIf([NPS Category] = "Promoter"), Count()) - SafeDivide(CountIf([NPS Category] = "Detractor"), Count())) * 100
          format:
            kind: number
            decimals: 0
          timeline:
            columnId: response_date
            grain: quarter
          goal: increase
        - id: response_count
          name: Response Count
          formula: Count()
      relationships:
        - id: nps_responses_account
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: opportunities
      name: Opportunities
      description: "Sales pipeline: closed new business, plan changes, lost deals and open opportunities. Amount is annualized."
      kind: table
      grain: opportunity_id
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - SAAS
          - OPPORTUNITIES
      columns:
        - id: opportunity_id
          name: Opportunity ID
          formula: "[OPPORTUNITIES/OPPORTUNITY_ID]"
          role: identifier
        - id: account_id
          name: Account ID
          formula: "[OPPORTUNITIES/ACCOUNT_ID]"
          hidden: true
          role: identifier
        - id: opportunity_type
          name: Opportunity Type
          description: New Business, Expansion, Upgrade or Downgrade.
          formula: "[OPPORTUNITIES/OPPORTUNITY_TYPE]"
          role: dimension
        - id: stage
          name: Stage
          formula: "[OPPORTUNITIES/STAGE]"
          role: dimension
        - id: owner
          name: Owner
          formula: "[OPPORTUNITIES/OWNER]"
          role: dimension
        - id: created_date
          name: Created Date
          formula: "[OPPORTUNITIES/CREATED_DATE]"
          role: time
        - id: close_date
          name: Close Date
          description: Expected close date for open opportunities.
          formula: "[OPPORTUNITIES/CLOSE_DATE]"
          role: time
        - id: amount
          name: Amount
          description: Annualized contract value.
          formula: "[OPPORTUNITIES/AMOUNT]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: lead_source
          name: Lead Source
          formula: "[OPPORTUNITIES/LEAD_SOURCE]"
          role: dimension
        - id: loss_reason
          name: Loss Reason
          formula: "[OPPORTUNITIES/LOSS_REASON]"
          role: dimension
        - id: probability
          name: Probability
          formula: "[OPPORTUNITIES/PROBABILITY]"
          format:
            kind: percent
            decimals: 0
          role: measure
      metrics:
        - id: open_pipeline
          name: Open Pipeline
          formula: SumIf([Amount], [Stage] <> "Closed Won" And [Stage] <> "Closed Lost")
          format:
            kind: currency
            decimals: 0
          goal: increase
        - id: weighted_pipeline
          name: Weighted Pipeline
          formula: SumIf([Amount] * [Probability], [Stage] <> "Closed Won" And [Stage] <> "Closed Lost")
          format:
            kind: currency
            decimals: 0
          goal: increase
        - id: bookings
          name: Bookings
          formula: SumIf([Amount], [Stage] = "Closed Won")
          format:
            kind: currency
            decimals: 0
          timeline:
            columnId: close_date
            grain: month
          goal: increase
        - id: win_rate
          name: Win Rate
          formula: SafeDivide(CountIf([Stage] = "Closed Won"), CountIf([Stage] = "Closed Won" Or [Stage] = "Closed Lost"))
          format:
            kind: percent
            decimals: 1
          goal: increase
      relationships:
        - id: opportunities_account
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
