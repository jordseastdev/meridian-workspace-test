          hidden: true
          role: identifier
        - id: created_date
          name: Created Date
          formula: "[SUPPORT_TICKETS/CREATED_DATE]"
          role: time
        - id: category
          name: Category
          formula: "[SUPPORT_TICKETS/CATEGORY]"
          role: dimension
        - id: priority
          name: Priority
          description: Urgent, High, Normal or Low.
          formula: "[SUPPORT_TICKETS/PRIORITY]"
          role: dimension
        - id: channel
          name: Channel
          formula: "[SUPPORT_TICKETS/CHANNEL]"
          role: dimension
        - id: agent
          name: Agent
          formula: "[SUPPORT_TICKETS/AGENT]"
          role: dimension
        - id: status
          name: Status
          formula: "[SUPPORT_TICKETS/STATUS]"
          role: dimension
        - id: first_response_hours
          name: First Response Hours
