dataModelId: retail-obt
name: Retail Order One Big Table
description: Curated retail order-line model with governed sales, profitability, customer and product keys.
folderId: models
contents:
  schemaVersion: 1
  kind: data-model
  elements:
    - id: order_lines
      name: Retail Order Lines
      description: One row per retail order line. Customer and product keys relate to governed lookup tables in this model.
      kind: table
      grain: order_id
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - ORDERS
      columns:
        - id: order_id
          name: Order ID
          description: Unique order-line identifier.
          formula: "[ORDERS/ORDER_ID]"
          role: identifier
        - id: order_date
          name: Order Date
          description: Calendar date when the order was placed.
          formula: "[ORDERS/ORDER_DATE]"
          role: time
        - id: order_month
          name: Order Month
          description: Order date truncated to calendar month.
          formula: DateTrunc("month", [Order Date])
          role: time
        - id: customer_id
          name: Customer ID
          description: Identifier of the purchasing customer.
          formula: "[ORDERS/CUSTOMER_ID]"
          role: identifier
        - id: product_id
          name: Product ID
          description: Identifier of the purchased product.
          formula: "[ORDERS/PRODUCT_ID]"
          role: identifier
        - id: channel
          name: Channel
          description: Sales channel for the order line.
          formula: "[ORDERS/CHANNEL]"
          role: dimension
        - id: status
          name: Status
          description: Order-line status, such as Completed, Returned or Cancelled.
          formula: "[ORDERS/STATUS]"
          role: dimension
        - id: quantity
          name: Quantity
          description: Units purchased on the order line.
          formula: "[ORDERS/QUANTITY]"
          role: measure
        - id: unit_price
          name: Unit Price
          description: Net selling price per unit after discount.
          formula: "[ORDERS/UNIT_PRICE]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: discount
          name: Discount
          description: Discount rate applied to the order line.
          formula: "[ORDERS/DISCOUNT]"
          format:
            kind: percent
            decimals: 1
          role: measure
        - id: revenue
          name: Revenue
          description: Net revenue generated by the order line.
          formula: "[ORDERS/REVENUE]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: cost
          name: Cost
          description: Cost associated with the order line.
          formula: "[ORDERS/COST]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: profit
          name: Profit
          description: Revenue less cost for the order line.
          formula: "[Revenue] - [Cost]"
          format:
            kind: currency
            decimals: 2
          role: measure
      metrics:
        - id: total_revenue
          name: Total Revenue
          description: Total net revenue across order lines.
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
          goal: increase
        - id: total_profit
          name: Total Profit
          description: Total profit across order lines.
          formula: Sum([Profit])
          format:
            kind: currency
            decimals: 0
          goal: increase
        - id: order_count
          name: Order Count
          description: Number of distinct order lines.
          formula: CountDistinct([Order ID])
          goal: increase
        - id: customer_count
          name: Customer Count
          description: Number of distinct purchasing customers.
          formula: CountDistinct([Customer ID])
          goal: increase
        - id: units_sold
          name: Units Sold
          description: Total units sold.
          formula: Sum([Quantity])
          goal: increase
        - id: average_order_value
          name: Average Order Value
          description: Revenue per order line.
          formula: SafeDivide(Sum([Revenue]), CountDistinct([Order ID]))
          format:
            kind: currency
            decimals: 2
          goal: increase
        - id: gross_margin
          name: Gross Margin
          description: Profit as a percentage of revenue.
          formula: SafeDivide(Sum([Profit]), Sum([Revenue]))
          format:
            kind: percent
            decimals: 1
          goal: increase
        - id: return_rate
          name: Return Rate
          description: Share of order lines that were returned.
          formula: SafeDivide(CountIf([Status] = "Returned"), Count())
          format:
            kind: percent
            decimals: 1
          goal: decrease
      relationships:
        - id: order_customer
          name: Customer
          targetElementId: customers
          keys:
            - sourceColumnId: customer_id
              targetColumnId: customer_id
          cardinality: many-to-one
        - id: order_product
          name: Product
          targetElementId: products
          keys:
            - sourceColumnId: product_id
              targetColumnId: product_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: customers
      name: Customers
      description: One row per customer used as a governed lookup for retail order lines.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - CUSTOMERS
      columns:
        - id: customer_id
          name: Customer ID
          description: Unique customer identifier.
          formula: "[CUSTOMERS/CUSTOMER_ID]"
          role: identifier
        - id: customer_name
          name: Customer Name
          description: Full customer name.
          formula: "[CUSTOMERS/CUSTOMER_NAME]"
          role: attribute
        - id: segment
          name: Segment
          description: Commercial segment assigned to the customer.
          formula: "[CUSTOMERS/SEGMENT]"
          role: dimension
        - id: loyalty_tier
          name: Loyalty Tier
          description: Loyalty program tier.
          formula: "[CUSTOMERS/LOYALTY_TIER]"
          role: dimension
        - id: region
          name: Customer Region
          description: Customer geographic region.
          formula: "[CUSTOMERS/REGION]"
          role: geo
        - id: signup_date
          name: Signup Date
          description: Date the customer signed up.
          formula: "[CUSTOMERS/SIGNUP_DATE]"
          role: time
        - id: email
          name: Email
          description: Customer contact email.
          formula: "[CUSTOMERS/EMAIL]"
          role: attribute
      metrics:
        - id: customer_count
          name: Customer Count
          description: Number of distinct customers.
          formula: CountDistinct([Customer ID])
      columnSecurity:
        - columnIds:
            - email
          allow:
            teams:
              - PII
      visibleAsSource: false
    - id: products
      name: Products
      description: One row per product used as a governed lookup for retail order lines.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - PRODUCTS
      columns:
        - id: product_id
          name: Product ID
          description: Unique product identifier.
          formula: "[PRODUCTS/PRODUCT_ID]"
          role: identifier
        - id: product_name
          name: Product Name
          description: Product display name.
          formula: "[PRODUCTS/PRODUCT_NAME]"
          role: attribute
        - id: category
          name: Category
          description: Top-level product category.
          formula: "[PRODUCTS/CATEGORY]"
          role: dimension
        - id: subcategory
          name: Subcategory
          description: Product subcategory.
          formula: "[PRODUCTS/SUBCATEGORY]"
          role: dimension
        - id: list_price
          name: List Price
          description: Catalog list price per unit.
          formula: "[PRODUCTS/LIST_PRICE]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: unit_cost
          name: Unit Cost
          description: Standard cost per unit.
          formula: "[PRODUCTS/UNIT_COST]"
          format:
            kind: currency
            decimals: 2
          role: measure
      visibleAsSource: false
