dataModelId: saas-growth
name: SaaS Growth & Revenue
description: Governed SaaS analytics model for account lifecycle, recurring revenue, billing, MRR movements, and feature adoption.
folderId: saas
contents:
  schemaVersion: 1
  kind: data-model
  elements:
    - id: accounts
      name: Accounts
      description: One row per SaaS account, including lifecycle, firmographic, ownership, plan, and contract attributes.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - ACCOUNTS
      columns:
        - id: account_id
          name: Account ID
          description: Unique identifier for the account.
          formula: "[ACCOUNTS/ACCOUNT_ID]"
          role: identifier
        - id: account_name
          name: Account Name
          description: Display name of the account.
          formula: "[ACCOUNTS/ACCOUNT_NAME]"
          role: dimension
        - id: domain
          name: Domain
          description: Primary internet domain associated with the account.
          formula: "[ACCOUNTS/DOMAIN]"
          role: attribute
        - id: industry
          name: Industry
          description: Industry classification for the account.
          formula: "[ACCOUNTS/INDUSTRY]"
          role: dimension
        - id: company_size
          name: Company Size
          description: Employee-based company size band.
          formula: "[ACCOUNTS/COMPANY_SIZE]"
          role: dimension
        - id: employee_count
          name: Employee Count
          description: Number of employees at the customer company.
          formula: "[ACCOUNTS/EMPLOYEE_COUNT]"
          role: measure
        - id: region
          name: Region
          description: Commercial region assigned to the account.
          formula: "[ACCOUNTS/REGION]"
          role: geo
        - id: acquisition_source
          name: Acquisition Source
          description: Channel through which the account was acquired.
          formula: "[ACCOUNTS/ACQUISITION_SOURCE]"
          role: dimension
        - id: signup_date
          name: Signup Date
          description: Date the account first signed up.
          formula: "[ACCOUNTS/SIGNUP_DATE]"
          role: time
        - id: converted_date
          name: Converted Date
          description: Date the account converted to a paid subscription.
          formula: "[ACCOUNTS/CONVERTED_DATE]"
          role: time
        - id: churned_date
          name: Churned Date
          description: Date the account churned, when applicable.
          formula: "[ACCOUNTS/CHURNED_DATE]"
          role: time
        - id: starting_plan
          name: Starting Plan
          description: Subscription plan at initial conversion.
          formula: "[ACCOUNTS/STARTING_PLAN]"
          role: dimension
        - id: current_plan
          name: Current Plan
          description: Most recently assigned subscription plan.
          formula: "[ACCOUNTS/CURRENT_PLAN]"
          role: dimension
        - id: plan_changed_date
          name: Plan Changed Date
          description: Date of the most recent plan change.
          formula: "[ACCOUNTS/PLAN_CHANGED_DATE]"
          role: time
        - id: billing_period
          name: Billing Period
          description: Current billing cadence for the account.
          formula: "[ACCOUNTS/BILLING_PERIOD]"
          role: dimension
        - id: contract_discount
          name: Contract Discount
          description: Contract discount as a share of list price.
          formula: "[ACCOUNTS/CONTRACT_DISCOUNT]"
          format:
            kind: percent
            decimals: 1
          role: measure
        - id: starting_seats
          name: Starting Seats
          description: Number of licensed seats at initial conversion.
          formula: "[ACCOUNTS/STARTING_SEATS]"
          format:
            kind: number
            decimals: 0
          role: measure
        - id: status
          name: Account Status
          description: Current lifecycle status such as Free, Active, or Churned.
          formula: "[ACCOUNTS/STATUS]"
          role: dimension
        - id: churn_reason
          name: Churn Reason
          description: Reported reason for churn, when applicable.
          formula: "[ACCOUNTS/CHURN_REASON]"
          role: dimension
        - id: account_owner
          name: Account Owner
          description: Commercial owner responsible for the account.
          formula: "[ACCOUNTS/ACCOUNT_OWNER]"
          role: dimension
        - id: csm
          name: Customer Success Manager
          description: Customer success manager assigned to the account.
          formula: "[ACCOUNTS/CSM]"
          role: dimension
      metrics:
        - id: total_accounts
          name: Total Accounts
          description: Distinct number of accounts.
          formula: CountDistinct([Account ID])
          format:
            kind: number
            decimals: 0
        - id: active_accounts
          name: Active Accounts
          description: Number of accounts currently marked Active.
          formula: CountIf([Account Status] = "Active")
          format:
            kind: number
            decimals: 0
        - id: free_accounts
          name: Free Accounts
          description: Number of accounts currently marked Free.
          formula: CountIf([Account Status] = "Free")
          format:
            kind: number
            decimals: 0
        - id: churned_accounts
          name: Churned Accounts
          description: Number of accounts currently marked Churned.
          formula: CountIf([Account Status] = "Churned")
          format:
            kind: number
            decimals: 0
        - id: paid_account_share
          name: Paid Account Share
          description: Share of all accounts that are currently active paid accounts.
          formula: SafeDivide(CountIf([Account Status] = "Active"), CountDistinct([Account ID]))
          format:
            kind: percent
            decimals: 1
        - id: average_starting_seats
          name: Average Starting Seats
          description: Average initial seat count across accounts.
          formula: Avg([Starting Seats])
          format:
            kind: number
            decimals: 1
        - id: average_contract_discount
          name: Average Contract Discount
          description: Average contract discount across accounts.
          formula: Avg([Contract Discount])
          format:
            kind: percent
            decimals: 1
      visibleAsSource: true
    - id: mrr_monthly
      name: Monthly Recurring Revenue
      description: One row per account and month, representing recurring revenue, plan, seats, pricing, and tenure.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - MRR_MONTHLY
      columns:
        - id: month
          name: Month
          description: Month represented by the recurring revenue snapshot.
          formula: "[MRR_MONTHLY/MONTH]"
          role: time
        - id: account_id
          name: Account ID
          description: Account represented by the monthly snapshot.
          formula: "[MRR_MONTHLY/ACCOUNT_ID]"
          role: identifier
        - id: plan_name
          name: Plan Name
          description: Subscription plan held during the month.
          formula: "[MRR_MONTHLY/PLAN_NAME]"
          role: dimension
        - id: tier_rank
          name: Tier Rank
          description: Numeric ordering of the subscription plan tier.
          formula: "[MRR_MONTHLY/TIER_RANK]"
          role: attribute
        - id: billing_period
          name: Billing Period
          description: Billing cadence in effect during the month.
          formula: "[MRR_MONTHLY/BILLING_PERIOD]"
          role: dimension
        - id: seats
          name: Seats
          description: Licensed seats during the month.
          formula: "[MRR_MONTHLY/SEATS]"
          format:
            kind: number
            decimals: 0
          role: measure
        - id: price_per_seat
          name: Price per Seat
          description: Monthly list price per licensed seat.
          formula: "[MRR_MONTHLY/PRICE_PER_SEAT]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: contract_discount
          name: Contract Discount
          description: Contract discount applied during the month.
          formula: "[MRR_MONTHLY/CONTRACT_DISCOUNT]"
          format:
            kind: percent
            decimals: 1
          role: measure
        - id: months_since_conversion
          name: Months Since Conversion
          description: Completed months since paid conversion.
          formula: "[MRR_MONTHLY/MONTHS_SINCE_CONVERSION]"
          role: attribute
        - id: mrr
          name: MRR
          description: Monthly recurring revenue for the account and month.
          formula: "[MRR_MONTHLY/MRR]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: arr
          name: ARR
          description: Annualized recurring revenue for the account and month.
          formula: "[MRR_MONTHLY/ARR]"
          format:
            kind: currency
            decimals: 0
          role: measure
      metrics:
        - id: total_mrr
          name: Total MRR
          description: Total monthly recurring revenue in the selected context.
          formula: Sum([MRR])
          format:
            kind: currency
            decimals: 0
        - id: total_arr
          name: Total ARR
          description: Total annualized recurring revenue in the selected context.
          formula: Sum([ARR])
          format:
            kind: currency
            decimals: 0
        - id: recurring_revenue_accounts
          name: Recurring Revenue Accounts
          description: Distinct accounts contributing recurring revenue.
          formula: CountDistinct([Account ID])
          format:
            kind: number
            decimals: 0
        - id: total_seats
          name: Total Seats
          description: Total licensed seats in the selected context.
          formula: Sum([Seats])
          format:
            kind: number
            decimals: 0
        - id: average_revenue_per_account
          name: Average Revenue per Account
          description: Monthly recurring revenue divided by distinct accounts.
          formula: SafeDivide(Sum([MRR]), CountDistinct([Account ID]))
          format:
            kind: currency
            decimals: 0
        - id: average_price_per_seat
          name: Average Price per Seat
          description: Average monthly list price per seat.
          formula: Avg([Price per Seat])
          format:
            kind: currency
            decimals: 2
        - id: average_contract_discount
          name: Average Contract Discount
          description: Average contract discount across snapshots.
          formula: Avg([Contract Discount])
          format:
            kind: percent
            decimals: 1
      relationships:
        - id: account
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: mrr_movements
      name: MRR Movements
      description: One row per recurring-revenue movement, including new, expansion, contraction, upgrade, downgrade, and churn activity.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - MRR_MOVEMENTS
      columns:
        - id: movement_id
          name: Movement ID
          description: Unique identifier for the MRR movement.
          formula: "[MRR_MOVEMENTS/MOVEMENT_ID]"
          role: identifier
        - id: month
          name: Month
          description: Month in which the movement occurred.
          formula: "[MRR_MOVEMENTS/MONTH]"
          role: time
        - id: account_id
          name: Account ID
          description: Account associated with the movement.
          formula: "[MRR_MOVEMENTS/ACCOUNT_ID]"
          role: identifier
        - id: movement_type
          name: Movement Type
          description: Type of recurring-revenue movement.
          formula: "[MRR_MOVEMENTS/MOVEMENT_TYPE]"
          role: dimension
        - id: plan_before
          name: Plan Before
          description: Subscription plan before the movement.
          formula: "[MRR_MOVEMENTS/PLAN_BEFORE]"
          role: dimension
        - id: plan_after
          name: Plan After
          description: Subscription plan after the movement.
          formula: "[MRR_MOVEMENTS/PLAN_AFTER]"
          role: dimension
        - id: mrr_before
          name: MRR Before
          description: Monthly recurring revenue immediately before the movement.
          formula: "[MRR_MOVEMENTS/MRR_BEFORE]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: mrr_after
          name: MRR After
          description: Monthly recurring revenue immediately after the movement.
          formula: "[MRR_MOVEMENTS/MRR_AFTER]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: mrr_change
          name: MRR Change
          description: Signed change in monthly recurring revenue.
          formula: "[MRR_MOVEMENTS/MRR_CHANGE]"
          format:
            kind: currency
            decimals: 0
          role: measure
      metrics:
        - id: movement_count
          name: Movement Count
          description: Distinct number of MRR movements.
          formula: CountDistinct([Movement ID])
          format:
            kind: number
            decimals: 0
        - id: net_mrr_change
          name: Net MRR Change
          description: Net change in recurring revenue across selected movements.
          formula: Sum([MRR Change])
          format:
            kind: currency
            decimals: 0
        - id: new_mrr
          name: New MRR
          description: Recurring revenue added by new customers.
          formula: SumIf([MRR Change], [Movement Type] = "New")
          format:
            kind: currency
            decimals: 0
        - id: expansion_mrr
          name: Expansion MRR
          description: Recurring revenue added through expansion.
          formula: SumIf([MRR Change], [Movement Type] = "Expansion")
          format:
            kind: currency
            decimals: 0
        - id: upgrade_mrr
          name: Upgrade MRR
          description: Recurring revenue added through upgrades.
          formula: SumIf([MRR Change], [Movement Type] = "Upgrade")
          format:
            kind: currency
            decimals: 0
        - id: contraction_mrr
          name: Contraction MRR
          description: Signed recurring-revenue change from contraction.
          formula: SumIf([MRR Change], [Movement Type] = "Contraction")
          format:
            kind: currency
            decimals: 0
        - id: downgrade_mrr
          name: Downgrade MRR
          description: Signed recurring-revenue change from downgrades.
          formula: SumIf([MRR Change], [Movement Type] = "Downgrade")
          format:
            kind: currency
            decimals: 0
        - id: churned_mrr
          name: Churned MRR
          description: Signed recurring-revenue change from churn.
          formula: SumIf([MRR Change], [Movement Type] = "Churn")
          format:
            kind: currency
            decimals: 0
      relationships:
        - id: account
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: invoices
      name: Invoices
      description: One row per issued invoice, including billing, payment, amount, tax, and collection details.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - INVOICES
      columns:
        - id: invoice_id
          name: Invoice ID
          description: Unique identifier for the invoice.
          formula: "[INVOICES/INVOICE_ID]"
          role: identifier
        - id: account_id
          name: Account ID
          description: Account billed by the invoice.
          formula: "[INVOICES/ACCOUNT_ID]"
          role: identifier
        - id: invoice_date
          name: Invoice Date
          description: Date the invoice was issued.
          formula: "[INVOICES/INVOICE_DATE]"
          role: time
        - id: due_date
          name: Due Date
          description: Contractual payment due date.
          formula: "[INVOICES/DUE_DATE]"
          role: time
        - id: plan_name
          name: Plan Name
          description: Subscription plan billed.
          formula: "[INVOICES/PLAN_NAME]"
          role: dimension
        - id: billing_period
          name: Billing Period
          description: Billing cadence represented by the invoice.
          formula: "[INVOICES/BILLING_PERIOD]"
          role: dimension
        - id: payment_method
          name: Payment Method
          description: Payment method associated with the invoice.
          formula: "[INVOICES/PAYMENT_METHOD]"
          role: dimension
        - id: seats
          name: Seats
          description: Number of seats billed.
          formula: "[INVOICES/SEATS]"
          format:
            kind: number
            decimals: 0
          role: measure
        - id: amount
          name: Pre-Tax Amount
          description: Invoice amount before tax.
          formula: "[INVOICES/AMOUNT]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: tax
          name: Tax
          description: Tax charged on the invoice.
          formula: "[INVOICES/TAX]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: total
          name: Invoice Total
          description: Total invoice amount including tax.
          formula: "[INVOICES/TOTAL]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: paid_date
          name: Paid Date
          description: Date payment was received.
          formula: "[INVOICES/PAID_DATE]"
          role: time
        - id: status
          name: Invoice Status
          description: Current collection status of the invoice.
          formula: "[INVOICES/STATUS]"
          role: dimension
      metrics:
        - id: invoice_count
          name: Invoice Count
          description: Distinct number of invoices.
          formula: CountDistinct([Invoice ID])
          format:
            kind: number
            decimals: 0
        - id: invoiced_pre_tax_amount
          name: Invoiced Pre-Tax Amount
          description: Total invoice value before tax.
          formula: Sum([Pre-Tax Amount])
          format:
            kind: currency
            decimals: 0
        - id: invoiced_tax
          name: Invoiced Tax
          description: Total tax charged.
          formula: Sum([Tax])
          format:
            kind: currency
            decimals: 0
        - id: invoiced_total
          name: Invoiced Total
          description: Total invoiced value including tax.
          formula: Sum([Invoice Total])
          format:
            kind: currency
            decimals: 0
        - id: collected_total
          name: Collected Total
          description: Invoice total collected, including late payments.
          formula: SumIf([Invoice Total], [Invoice Status] = "Paid" or [Invoice Status] = "Paid Late")
          format:
            kind: currency
            decimals: 0
        - id: open_total
          name: Open Invoice Total
          description: Invoice total still open or past due.
          formula: SumIf([Invoice Total], [Invoice Status] = "Open" or [Invoice Status] = "Past Due")
          format:
            kind: currency
            decimals: 0
        - id: collection_rate
          name: Collection Rate
          description: Share of invoiced value collected.
          formula: SafeDivide(SumIf([Invoice Total], [Invoice Status] = "Paid" or [Invoice Status] = "Paid Late"), Sum([Invoice Total]))
          format:
            kind: percent
            decimals: 1
        - id: average_invoice_total
          name: Average Invoice Total
          description: Average total value per invoice.
          formula: Avg([Invoice Total])
          format:
            kind: currency
            decimals: 0
      relationships:
        - id: account
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: feature_adoption
      name: Feature Adoption
      description: One row per account and product feature, including eligibility, adoption, usage dates, and monthly active users.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - FEATURE_ADOPTION
      columns:
        - id: account_id
          name: Account ID
          description: Account evaluated for feature adoption.
          formula: "[FEATURE_ADOPTION/ACCOUNT_ID]"
          role: identifier
        - id: feature
          name: Feature
          description: Product feature being evaluated.
          formula: "[FEATURE_ADOPTION/FEATURE]"
          role: dimension
        - id: feature_category
          name: Feature Category
          description: Product area containing the feature.
          formula: "[FEATURE_ADOPTION/FEATURE_CATEGORY]"
          role: dimension
        - id: min_plan
          name: Minimum Plan
          description: Lowest plan that includes the feature.
          formula: "[FEATURE_ADOPTION/MIN_PLAN]"
          role: dimension
        - id: adopted
          name: Adopted
          description: Whether the account adopted the feature.
          formula: "[FEATURE_ADOPTION/ADOPTED]"
          role: dimension
        - id: first_used_date
          name: First Used Date
          description: Date the account first used the feature.
          formula: "[FEATURE_ADOPTION/FIRST_USED_DATE]"
          role: time
        - id: last_used_date
          name: Last Used Date
          description: Most recent date the account used the feature.
          formula: "[FEATURE_ADOPTION/LAST_USED_DATE]"
          role: time
        - id: monthly_active_users
          name: Monthly Active Users
          description: Monthly active users of the feature within the account.
          formula: "[FEATURE_ADOPTION/MONTHLY_ACTIVE_USERS]"
          format:
            kind: number
            decimals: 0
          role: measure
      metrics:
        - id: account_feature_pairs
          name: Account-Feature Pairs
          description: Number of account and feature combinations evaluated.
          formula: Count()
          format:
            kind: number
            decimals: 0
        - id: adopted_account_feature_pairs
          name: Adopted Account-Feature Pairs
          description: Number of account and feature combinations marked adopted.
          formula: CountIf([Adopted] = true)
          format:
            kind: number
            decimals: 0
        - id: feature_adoption_rate
          name: Feature Adoption Rate
          description: Share of account-feature combinations adopted.
          formula: SafeDivide(CountIf([Adopted] = true), Count())
          format:
            kind: percent
            decimals: 1
        - id: total_feature_monthly_active_users
          name: Total Feature Monthly Active Users
          description: Total monthly active users across account-feature combinations.
          formula: Sum([Monthly Active Users])
          format:
            kind: number
            decimals: 0
        - id: adopting_accounts
          name: Adopting Accounts
          description: Distinct accounts that adopted at least one selected feature.
          formula: CountDistinct(If([Adopted] = true, [Account ID], null))
          format:
            kind: number
            decimals: 0
      relationships:
        - id: account
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
