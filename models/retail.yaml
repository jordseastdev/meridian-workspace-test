  verifiedQueries:
    - question: Which marketing channels generate the most attributed revenue and the strongest return on ad spend?
      elementId: campaigns
      dimensions:
        - "[Channel]"
      measures:
        - Total Spend
        - Total Attributed Revenue
        - Return on Ad Spend
        - Conversion Rate
      notes: Compares campaign investment, revenue impact, efficiency, and funnel performance across marketing channels.
      verifiedBy: priya@meridian.dev
      verifiedAt: 2026-10-06
    - question: Which product categories and sales channels have the highest return rates and refund exposure?
      elementId: orders
      dimensions:
        - "[Product/Category]"
        - "[Channel]"
      measures:
        - Return Rate
        - Total Revenue
        - Order Count
      verifiedBy: priya@meridian.dev
      verifiedAt: 2026-10-06
