          formula: "[INVENTORY/REORDER_POINT]"
          role: measure
        - id: safety_stock
          name: Safety Stock
          description: Buffer units held to protect service levels
          formula: "[INVENTORY/SAFETY_STOCK]"
          role: measure
        - id: avg_daily_units
          name: Avg Daily Units
          description: Average daily unit demand
          formula: "[INVENTORY/AVG_DAILY_UNITS]"
