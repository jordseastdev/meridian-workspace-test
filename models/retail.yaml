          role: dimension
        - id: sessions
          name: Sessions
          formula: "[WEB_TRAFFIC/SESSIONS]"
          role: measure
        - id: users
          name: Users
          formula: "[WEB_TRAFFIC/USERS]"
          role: measure
        - id: bounces
          name: Bounces
          formula: "[WEB_TRAFFIC/BOUNCES]"
          role: measure
        - id: product_views
          name: Product Views
          formula: "[WEB_TRAFFIC/PRODUCT_VIEWS]"
          role: measure
        - id: add_to_carts
          name: Add to Carts
          formula: "[WEB_TRAFFIC/ADD_TO_CARTS]"
          role: measure
        - id: checkouts
          name: Checkouts
          formula: "[WEB_TRAFFIC/CHECKOUTS]"
          role: measure
        - id: web_orders
          name: Web Orders
          formula: "[WEB_TRAFFIC/WEB_ORDERS]"
          role: measure
        - id: web_revenue
          name: Web Revenue
          formula: "[WEB_TRAFFIC/WEB_REVENUE]"
          format:
            kind: currency
            decimals: 0
          role: measure
      metrics:
        - id: total_sessions
          name: Total Sessions
          formula: Sum([Sessions])
          timeline:
            columnId: date
            grain: week
          goal: increase
        - id: conversion_rate
          name: Conversion Rate
          formula: SafeDivide(Sum([Web Orders]), Sum([Sessions]))
          format:
            kind: percent
            decimals: 2
          synonyms:
            - cvr
          goal: increase
        - id: bounce_rate
          name: Bounce Rate
          formula: SafeDivide(Sum([Bounces]), Sum([Sessions]))
          format:
            kind: percent
            decimals: 1
          goal: decrease
        - id: cart_abandonment
          name: Cart Abandonment
          formula: 1 - SafeDivide(Sum([Web Orders]), Sum([Add to Carts]))
          format:
            kind: percent
            decimals: 1
          goal: decrease
      visibleAsSource: true
