dataModelId: retail
name: Retail
description: Curated semantic layer over the demo retail warehouse. Orders at line grain, joined to customers, products and stores. QA96 browser sync verified.
folderId: models
tags:
  - certified
  - sales
contents:
  schemaVersion: 1
  kind: data-model
  elements:
    - id: orders
      name: Orders
      description: One row per order line. Revenue is net of discount; cost is landed unit cost times quantity.
      kind: table
      grain: order_id
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - ORDERS
      columns:
        - id: order_id
          name: Order ID
          description: Unique order line identifier.
          formula: "[ORDERS/ORDER_ID]"
          role: identifier
        - id: order_date
          name: Order Date
          description: Calendar date the order was placed.
          formula: "[ORDERS/ORDER_DATE]"
          role: time
        - id: order_month
          name: Order Month
          description: Order date truncated to the first of the month.
          formula: DateTrunc("month", [Order Date])
          role: time
        - id: customer_id
          name: Customer ID
          formula: "[ORDERS/CUSTOMER_ID]"
          hidden: true
          role: identifier
        - id: product_id
          name: Product ID
          formula: "[ORDERS/PRODUCT_ID]"
          hidden: true
          role: identifier
        - id: store_id
          name: Store ID
          formula: "[ORDERS/STORE_ID]"
          hidden: true
          role: identifier
        - id: channel
          name: Channel
          description: "Sales channel: Online, In Store, Mobile or Marketplace."
          formula: "[ORDERS/CHANNEL]"
          role: dimension
          synonyms:
            - sales channel
            - source
        - id: status
          name: Status
          description: Completed, Returned or Cancelled.
          formula: "[ORDERS/STATUS]"
          role: dimension
        - id: quantity
          name: Quantity
          description: Units on the order line.
          formula: "[ORDERS/QUANTITY]"
          role: measure
        - id: unit_price
          name: Unit Price
          description: Net price per unit after discount.
          formula: "[ORDERS/UNIT_PRICE]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: discount
          name: Discount
          description: Discount rate applied to list price.
          formula: "[ORDERS/DISCOUNT]"
          format:
            kind: percent
            decimals: 0
          role: measure
        - id: revenue
          name: Revenue
          description: Net revenue for the line (unit price x quantity).
          formula: "[ORDERS/REVENUE]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: cost
          name: Cost
          description: Landed cost for the line.
          formula: "[ORDERS/COST]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: profit
          name: Profit
          description: Revenue minus cost.
          formula: "[Revenue] - [Cost]"
          format:
            kind: currency
            decimals: 0
          role: measure
      metrics:
        - id: total_revenue
          name: Total Revenue
          description: Net revenue across all order lines.
          formula: Sum([Revenue])
          format:
            kind: currency
            decimals: 0
          synonyms:
            - sales
            - gmv
          timeline:
            columnId: order_date
            grain: month
          goal: increase
        - id: order_count
          name: Order Count
          description: Number of distinct order lines.
          formula: CountDistinct([Order ID])
          goal: increase
        - id: aov
          name: Avg Order Value
          description: Revenue per order line.
          formula: SafeDivide(Sum([Revenue]), CountDistinct([Order ID]))
          format:
            kind: currency
            decimals: 2
          goal: increase
        - id: gross_margin
          name: Gross Margin
          description: Profit as a share of revenue.
          formula: SafeDivide(Sum([Profit]), Sum([Revenue]))
          format:
            kind: percent
            decimals: 1
          goal: increase
        - id: units
          name: Units Sold
          description: Total units sold.
          formula: Sum([Quantity])
        - id: return_rate
          name: Return Rate
          description: Share of lines that were returned.
          formula: SafeDivide(CountIf([Status] = "Returned"), Count())
          format:
            kind: percent
            decimals: 1
          goal: decrease
      relationships:
        - id: orders_customers
          name: Customer
          targetElementId: customers
          keys:
            - sourceColumnId: customer_id
              targetColumnId: customer_id
          cardinality: many-to-one
        - id: orders_products
          name: Product
          targetElementId: products
          keys:
            - sourceColumnId: product_id
              targetColumnId: product_id
          cardinality: many-to-one
        - id: orders_stores
          name: Store
          targetElementId: stores
          keys:
            - sourceColumnId: store_id
              targetColumnId: store_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: customers
      name: Customers
      description: One row per customer.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - CUSTOMERS
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[CUSTOMERS/CUSTOMER_ID]"
          role: identifier
        - id: customer_name
          name: Customer Name
          description: Full name of the customer.
          formula: "[CUSTOMERS/CUSTOMER_NAME]"
          role: attribute
        - id: segment
          name: Segment
          description: Consumer, Small Business or Enterprise.
          formula: "[CUSTOMERS/SEGMENT]"
          role: dimension
        - id: loyalty_tier
          name: Loyalty Tier
          description: Bronze through Platinum.
          formula: "[CUSTOMERS/LOYALTY_TIER]"
          role: dimension
        - id: region
          name: Customer Region
          formula: "[CUSTOMERS/REGION]"
          role: geo
        - id: signup_date
          name: Signup Date
          formula: "[CUSTOMERS/SIGNUP_DATE]"
          role: time
        - id: email
          name: Email
          description: Contact email. Restricted to the PII team.
          formula: "[CUSTOMERS/EMAIL]"
          role: attribute
      metrics:
        - id: customer_count
          name: Customer Count
          description: Distinct customers.
          formula: CountDistinct([Customer ID])
      columnSecurity:
        - columnIds:
            - email
          allow:
            teams:
              - PII
      visibleAsSource: true
    - id: products
      name: Products
      description: Product catalog with list price and unit cost.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - PRODUCTS
      columns:
        - id: product_id
          name: Product ID
          formula: "[PRODUCTS/PRODUCT_ID]"
          role: identifier
        - id: product_name
          name: Product Name
          formula: "[PRODUCTS/PRODUCT_NAME]"
          role: attribute
        - id: category
          name: Category
          description: Top-level merchandising category.
          formula: "[PRODUCTS/CATEGORY]"
          role: dimension
        - id: subcategory
          name: Subcategory
          formula: "[PRODUCTS/SUBCATEGORY]"
          role: dimension
        - id: list_price
          name: List Price
          formula: "[PRODUCTS/LIST_PRICE]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: unit_cost
          name: Unit Cost
          formula: "[PRODUCTS/UNIT_COST]"
          format:
            kind: currency
            decimals: 2
          role: measure
      visibleAsSource: true
    - id: deals
      name: Deals
      description: Open discount requests mirrored from the CRM. Sales reps only see deals they own; everyone else sees all deals.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - DEALS
      columns:
        - id: deal_id
          name: Deal ID
          formula: "[DEALS/DEAL_ID]"
          role: identifier
        - id: account
          name: Account
          formula: "[DEALS/ACCOUNT]"
          role: attribute
        - id: owner
          name: Owner
          description: Account executive who submitted the request.
          formula: "[DEALS/OWNER]"
          role: dimension
        - id: owner_email
          name: Owner Email
          formula: "[DEALS/OWNER_EMAIL]"
          hidden: true
          role: attribute
        - id: region
          name: Region
          formula: "[DEALS/REGION]"
          role: geo
        - id: stage
          name: Stage
          formula: "[DEALS/STAGE]"
          role: dimension
        - id: status
          name: Status
          formula: "[DEALS/STATUS]"
          role: dimension
        - id: list_amount
          name: List Amount
          formula: "[DEALS/LIST_AMOUNT]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: submitted_discount
          name: Submitted Discount
          formula: "[DEALS/SUBMITTED_DISCOUNT]"
          format:
            kind: percent
            decimals: 0
          role: measure
        - id: age_days
          name: Age Days
          description: Days since the request was submitted.
          formula: "[DEALS/AGE_DAYS]"
          role: measure
      rowLevelSecurity:
        description: Members of the Sales team see only their own deals.
        formula: If(CurrentUserInTeam("Sales"), [DEALS/OWNER_EMAIL] = CurrentUserEmail(), True)
      visibleAsSource: true
    - id: stores
      name: Stores
      description: Physical and virtual store locations.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - STORES
      columns:
        - id: store_id
          name: Store ID
          formula: "[STORES/STORE_ID]"
          role: identifier
        - id: store_name
          name: Store Name
          formula: "[STORES/STORE_NAME]"
          role: attribute
        - id: region
          name: Region
          description: Sales region that owns the store.
          formula: "[STORES/REGION]"
          role: geo
        - id: state
          name: State
          formula: "[STORES/STATE]"
          role: geo
        - id: store_format
          name: Store Format
          formula: "[STORES/STORE_FORMAT]"
          role: dimension
      visibleAsSource: true
    - id: customer_profiles
      name: Customer Profiles
      description: One row per customer with geography, demographics, acquisition and marketing preferences.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - CUSTOMER_PROFILES
      columns:
        - id: customer_id
          name: Customer ID
          formula: "[CUSTOMER_PROFILES/CUSTOMER_ID]"
          role: identifier
        - id: city
          name: City
          formula: "[CUSTOMER_PROFILES/CITY]"
          role: geo
        - id: state
          name: State
          formula: "[CUSTOMER_PROFILES/STATE]"
          role: geo
        - id: postal_code
          name: Postal Code
          description: Postal code. Restricted to the PII team.
          formula: "[CUSTOMER_PROFILES/POSTAL_CODE]"
          role: attribute
        - id: age_band
          name: Age Band
          description: Consumer customers only.
          formula: "[CUSTOMER_PROFILES/AGE_BAND]"
          role: dimension
        - id: household_size
          name: Household Size
          formula: "[CUSTOMER_PROFILES/HOUSEHOLD_SIZE]"
          role: measure
        - id: employee_count
          name: Employee Count
          description: Business customers only.
          formula: "[CUSTOMER_PROFILES/EMPLOYEE_COUNT]"
          role: measure
        - id: acquisition_channel
          name: Acquisition Channel
          formula: "[CUSTOMER_PROFILES/ACQUISITION_CHANNEL]"
          role: dimension
          synonyms:
            - first touch
        - id: preferred_channel
          name: Preferred Channel
          formula: "[CUSTOMER_PROFILES/PREFERRED_CHANNEL]"
          role: dimension
        - id: marketing_opt_in
          name: Marketing Opt-in
          formula: "[CUSTOMER_PROFILES/MARKETING_OPT_IN]"
          role: dimension
        - id: has_store_card
          name: Has Store Card
          formula: "[CUSTOMER_PROFILES/HAS_STORE_CARD]"
          role: dimension
        - id: assigned_csm
          name: Assigned CSM
          description: Customer success manager for business accounts.
          formula: "[CUSTOMER_PROFILES/ASSIGNED_CSM]"
          role: dimension
        - id: last_nps_score
          name: Last NPS Score
          description: Most recent 0-10 survey answer.
          formula: "[CUSTOMER_PROFILES/LAST_NPS_SCORE]"
          role: measure
      metrics:
        - id: opt_in_rate
          name: Opt-in Rate
          formula: SafeDivide(CountIf([Marketing Opt-in]), Count())
          format:
            kind: percent
            decimals: 1
          goal: increase
      relationships:
        - id: profiles_customers
          name: Customer
          targetElementId: customers
          keys:
            - sourceColumnId: customer_id
              targetColumnId: customer_id
          cardinality: many-to-one
      columnSecurity:
        - columnIds:
            - postal_code
          allow:
            teams:
              - PII
      visibleAsSource: true
    - id: shipments
      name: Shipments
      description: One row per shipped order line (online, mobile and marketplace). Delivery dates are empty while in transit.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - SHIPMENTS
      columns:
        - id: shipment_id
          name: Shipment ID
          formula: "[SHIPMENTS/SHIPMENT_ID]"
          role: identifier
        - id: order_id
          name: Order ID
          formula: "[SHIPMENTS/ORDER_ID]"
          hidden: true
          role: identifier
        - id: carrier
          name: Carrier
          formula: "[SHIPMENTS/CARRIER]"
          role: dimension
        - id: service_level
          name: Service Level
          description: Standard, Expedited or Overnight.
          formula: "[SHIPMENTS/SERVICE_LEVEL]"
          role: dimension
        - id: fulfillment_center
          name: Fulfillment Center
          formula: "[SHIPMENTS/FULFILLMENT_CENTER]"
          role: geo
        - id: ship_date
          name: Ship Date
          formula: "[SHIPMENTS/SHIP_DATE]"
          role: time
        - id: promised_date
          name: Promised Date
          formula: "[SHIPMENTS/PROMISED_DATE]"
          role: time
        - id: delivered_date
          name: Delivered Date
          formula: "[SHIPMENTS/DELIVERED_DATE]"
          role: time
        - id: transit_days
          name: Transit Days
          formula: "[SHIPMENTS/TRANSIT_DAYS]"
          role: measure
        - id: on_time
          name: On Time
          description: Delivered by the promised date.
          formula: "[SHIPMENTS/ON_TIME]"
          role: dimension
        - id: shipment_status
          name: Shipment Status
          formula: "[SHIPMENTS/SHIPMENT_STATUS]"
          role: dimension
        - id: shipping_charged
          name: Shipping Charged
          formula: "[SHIPMENTS/SHIPPING_CHARGED]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: shipping_cost
          name: Shipping Cost
          formula: "[SHIPMENTS/SHIPPING_COST]"
          format:
            kind: currency
            decimals: 2
          role: measure
      metrics:
        - id: on_time_rate
          name: On-time Rate
          formula: SafeDivide(CountIf([On Time]), Count())
          format:
            kind: percent
            decimals: 1
          synonyms:
            - otd
          timeline:
            columnId: ship_date
            grain: month
          goal: increase
        - id: avg_transit_days
          name: Avg Transit Days
          formula: Avg([Transit Days])
          format:
            kind: number
            decimals: 1
          goal: decrease
        - id: shipping_subsidy
          name: Shipping Subsidy
          formula: Sum([Shipping Cost]) - Sum([Shipping Charged])
          format:
            kind: currency
            decimals: 0
          goal: decrease
      relationships:
        - id: shipments_orders
          name: Order
          targetElementId: orders
          keys:
            - sourceColumnId: order_id
              targetColumnId: order_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: returns
      name: Returns
      description: One row per returned order line with reason, item condition and refund.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - RETURNS
      columns:
        - id: return_id
          name: Return ID
          formula: "[RETURNS/RETURN_ID]"
          role: identifier
        - id: order_id
          name: Order ID
          formula: "[RETURNS/ORDER_ID]"
          hidden: true
          role: identifier
        - id: product_id
          name: Product ID
          formula: "[RETURNS/PRODUCT_ID]"
          hidden: true
          role: identifier
        - id: return_date
          name: Return Date
          formula: "[RETURNS/RETURN_DATE]"
          role: time
        - id: reason
          name: Return Reason
          formula: "[RETURNS/REASON]"
          role: dimension
        - id: item_condition
          name: Item Condition
          description: Resellable, Refurbish or Write-off.
          formula: "[RETURNS/ITEM_CONDITION]"
          role: dimension
        - id: return_method
          name: Return Method
          formula: "[RETURNS/RETURN_METHOD]"
          role: dimension
        - id: refund_amount
          name: Refund Amount
          formula: "[RETURNS/REFUND_AMOUNT]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: restocking_fee
          name: Restocking Fee
          formula: "[RETURNS/RESTOCKING_FEE]"
          format:
            kind: currency
            decimals: 2
          role: measure
      metrics:
        - id: total_refunds
          name: Total Refunds
          formula: Sum([Refund Amount])
          format:
            kind: currency
            decimals: 0
          timeline:
            columnId: return_date
            grain: month
          goal: decrease
      relationships:
        - id: returns_orders
          name: Order
          targetElementId: orders
          keys:
            - sourceColumnId: order_id
              targetColumnId: order_id
          cardinality: many-to-one
        - id: returns_products
          name: Product
          targetElementId: products
          keys:
            - sourceColumnId: product_id
              targetColumnId: product_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: support_tickets
      name: Support Tickets
      description: Customer service tickets, each tied to an order. CSAT is only present when the customer answered the survey.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - SUPPORT_TICKETS
      columns:
        - id: ticket_id
          name: Ticket ID
          formula: "[SUPPORT_TICKETS/TICKET_ID]"
          role: identifier
        - id: customer_id
          name: Customer ID
          formula: "[SUPPORT_TICKETS/CUSTOMER_ID]"
          hidden: true
          role: identifier
        - id: order_id
          name: Order ID
          formula: "[SUPPORT_TICKETS/ORDER_ID]"
          hidden: true
          role: identifier
        - id: opened_at
          name: Opened At
          formula: "[SUPPORT_TICKETS/OPENED_AT]"
          role: time
        - id: channel
          name: Contact Channel
          formula: "[SUPPORT_TICKETS/CHANNEL]"
          role: dimension
        - id: category
          name: Ticket Category
          formula: "[SUPPORT_TICKETS/CATEGORY]"
          role: dimension
        - id: priority
          name: Priority
          formula: "[SUPPORT_TICKETS/PRIORITY]"
          role: dimension
        - id: agent
          name: Agent
          formula: "[SUPPORT_TICKETS/AGENT]"
          role: dimension
        - id: status
          name: Ticket Status
          formula: "[SUPPORT_TICKETS/STATUS]"
          role: dimension
        - id: first_response_minutes
          name: First Response Minutes
          formula: "[SUPPORT_TICKETS/FIRST_RESPONSE_MINUTES]"
          role: measure
        - id: resolution_hours
          name: Resolution Hours
          formula: "[SUPPORT_TICKETS/RESOLUTION_HOURS]"
          role: measure
        - id: csat_score
          name: CSAT Score
          description: 1-5 satisfaction rating.
          formula: "[SUPPORT_TICKETS/CSAT_SCORE]"
          role: measure
      metrics:
        - id: ticket_count
          name: Ticket Count
          formula: CountDistinct([Ticket ID])
          timeline:
            columnId: opened_at
            grain: month
          goal: decrease
        - id: avg_csat
          name: Avg CSAT
          formula: Avg([CSAT Score])
          format:
            kind: number
            decimals: 2
          synonyms:
            - satisfaction
          goal: increase
        - id: median_first_response
          name: Median First Response (min)
          formula: Median([First Response Minutes])
          format:
            kind: number
            decimals: 0
          goal: decrease
      relationships:
        - id: tickets_customers
          name: Customer
          targetElementId: customers
          keys:
            - sourceColumnId: customer_id
              targetColumnId: customer_id
          cardinality: many-to-one
        - id: tickets_orders
          name: Order
          targetElementId: orders
          keys:
            - sourceColumnId: order_id
              targetColumnId: order_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: product_reviews
      name: Product Reviews
      description: Star ratings left after purchase.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - RETAIL
          - PRODUCT_REVIEWS
      columns:
        - id: review_id
          name: Review ID
          formula: "[PRODUCT_REVIEWS/REVIEW_ID]"
          role: identifier
        - id: product_id
          name: Product ID
          formula: "[PRODUCT_REVIEWS/PRODUCT_ID]"
          hidden: true
          role: identifier
        - id: review_date
          name: Review Date
          formula: "[PRODUCT_REVIEWS/REVIEW_DATE]"
          role: time
        - id: rating
          name: Rating
          description: 1 to 5 stars.
          formula: "[PRODUCT_REVIEWS/RATING]"
          role: measure
        - id: review_title
          name: Review Title
          formula: "[PRODUCT_REVIEWS/REVIEW_TITLE]"
          role: attribute
        - id: verified_purchase
          name: Verified Purchase
          formula: "[PRODUCT_REVIEWS/VERIFIED_PURCHASE]"
          role: dimension
        - id: helpful_votes
          name: Helpful Votes
          formula: "[PRODUCT_REVIEWS/HELPFUL_VOTES]"
          role: measure
      metrics:
        - id: avg_rating
          name: Avg Rating
          formula: Avg([Rating])
          format:
            kind: number
            decimals: 2
          goal: increase
      relationships:
        - id: reviews_products
          name: Product
          targetElementId: products
          keys:
            - sourceColumnId: product_id
              targetColumnId: product_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: campaigns
      name: Campaigns
      description: Marketing campaign performance at one row per campaign, including spend, funnel activity and attributed revenue.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - RETAIL
          - CAMPAIGNS
      columns:
        - id: campaign_id
          name: Campaign ID
          description: Unique campaign identifier
          formula: "[CAMPAIGNS/CAMPAIGN_ID]"
          role: identifier
        - id: campaign_name
          name: Campaign Name
          description: Campaign name
          formula: "[CAMPAIGNS/CAMPAIGN_NAME]"
          role: attribute
        - id: channel
          name: Channel
          description: Marketing channel
          formula: "[CAMPAIGNS/CHANNEL]"
          role: dimension
        - id: target_category
          name: Target Category
          description: Product category targeted by the campaign
          formula: "[CAMPAIGNS/TARGET_CATEGORY]"
          role: dimension
        - id: target_segment
          name: Target Segment
          description: Customer segment targeted by the campaign
          formula: "[CAMPAIGNS/TARGET_SEGMENT]"
          role: dimension
        - id: start_date
          name: Start Date
          description: Campaign start date
          formula: "[CAMPAIGNS/START_DATE]"
          role: time
        - id: end_date
          name: End Date
          description: Campaign end date
          formula: "[CAMPAIGNS/END_DATE]"
          role: time
        - id: status
          name: Status
          description: Campaign lifecycle status
          formula: "[CAMPAIGNS/STATUS]"
          role: dimension
        - id: budget
          name: Budget
          description: Approved campaign budget
          formula: "[CAMPAIGNS/BUDGET]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: spend
          name: Spend
          description: Campaign spend to date
          formula: "[CAMPAIGNS/SPEND]"
          format:
            kind: currency
            decimals: 0
          role: measure
        - id: impressions
          name: Impressions
          description: Campaign impressions
          formula: "[CAMPAIGNS/IMPRESSIONS]"
          role: measure
        - id: clicks
          name: Clicks
          description: Campaign clicks
          formula: "[CAMPAIGNS/CLICKS]"
          role: measure
        - id: conversions
          name: Conversions
          description: Campaign conversions
          formula: "[CAMPAIGNS/CONVERSIONS]"
          role: measure
        - id: attributed_revenue
          name: Attributed Revenue
          description: Revenue attributed to the campaign
          formula: "[CAMPAIGNS/ATTRIBUTED_REVENUE]"
          format:
            kind: currency
            decimals: 0
          role: measure
      metrics:
        - id: campaign_count
          name: Campaign Count
          description: Number of campaigns
          formula: CountDistinct([Campaign ID])
        - id: total_budget
          name: Total Budget
          description: Total approved budget
          formula: Sum([Budget])
          format:
            kind: currency
            decimals: 0
          goal: increase
        - id: total_spend
          name: Total Spend
          description: Total campaign spend
          formula: Sum([Spend])
          format:
            kind: currency
            decimals: 0
          goal: decrease
        - id: total_attributed_revenue
          name: Total Attributed Revenue
          description: Total attributed revenue
          formula: Sum([Attributed Revenue])
          format:
            kind: currency
            decimals: 0
          goal: increase
        - id: click_through_rate
          name: Click-through Rate
          description: Share of impressions that became clicks
          formula: SafeDivide(Sum([Clicks]), Sum([Impressions]))
          format:
            kind: percent
            decimals: 2
          goal: increase
        - id: conversion_rate
          name: Conversion Rate
          description: Share of clicks that converted
          formula: SafeDivide(Sum([Conversions]), Sum([Clicks]))
          format:
            kind: percent
            decimals: 2
          goal: increase
        - id: return_on_ad_spend
          name: Return on Ad Spend
          description: Attributed revenue per unit of campaign spend
          formula: SafeDivide(Sum([Attributed Revenue]), Sum([Spend]))
          format:
            kind: number
            decimals: 2
          goal: increase
      visibleAsSource: true
    - id: web_traffic
      name: Web Traffic
