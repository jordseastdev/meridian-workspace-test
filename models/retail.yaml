            kind: number
            decimals: 1
          role: measure
        - id: stock_status
          name: Stock Status
          description: Inventory health classification
          formula: "[INVENTORY/STOCK_STATUS]"
          role: dimension
        - id: last_restock_date
          name: Last Restock Date
          description: Most recent replenishment date
          formula: "[INVENTORY/LAST_RESTOCK_DATE]"
          role: time
      metrics:
        - id: snapshot_count
          name: Snapshot Count
          description: Number of inventory snapshots
          formula: Count()
        - id: units_on_hand
