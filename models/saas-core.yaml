dataModelId: saas-core
name: SaaS Core
description: Governed semantic model for customer accounts, feature adoption, and invoices in the SaaS warehouse.
contents:
  schemaVersion: 1
  kind: data-model
  elements:
    - id: accounts
      name: Accounts
      description: One row per customer account, including lifecycle, plan, ownership, and segmentation attributes.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - ACCOUNTS
      columns:
        - id: account_id
          name: Account ID
          description: Unique identifier for the customer account.
          formula: "[ACCOUNTS/ACCOUNT_ID]"
          role: identifier
        - id: account_name
          name: Account Name
          description: Customer account name.
          formula: "[ACCOUNTS/ACCOUNT_NAME]"
          role: dimension
        - id: domain
          name: Domain
          description: Primary customer web domain.
          formula: "[ACCOUNTS/DOMAIN]"
          role: dimension
        - id: industry
          name: Industry
          description: Customer industry classification.
          formula: "[ACCOUNTS/INDUSTRY]"
          role: dimension
        - id: company_size
          name: Company Size
          description: Customer company-size segment.
          formula: "[ACCOUNTS/COMPANY_SIZE]"
          role: dimension
        - id: employee_count
          name: Employee Count
          description: Number of employees at the customer company.
          formula: "[ACCOUNTS/EMPLOYEE_COUNT]"
          role: measure
        - id: region
          name: Region
          description: Customer geographic region.
          formula: "[ACCOUNTS/REGION]"
          role: dimension
        - id: acquisition_source
          name: Acquisition Source
          description: Source through which the account was acquired.
          formula: "[ACCOUNTS/ACQUISITION_SOURCE]"
          role: dimension
        - id: signup_date
          name: Signup Date
          description: Date the account signed up.
          formula: "[ACCOUNTS/SIGNUP_DATE]"
          role: time
        - id: converted_date
          name: Converted Date
          description: Date the account converted.
          formula: "[ACCOUNTS/CONVERTED_DATE]"
          role: time
        - id: churned_date
          name: Churned Date
          description: Date the account churned, when applicable.
          formula: "[ACCOUNTS/CHURNED_DATE]"
          role: time
        - id: starting_plan
          name: Starting Plan
          description: Plan selected at account start.
          formula: "[ACCOUNTS/STARTING_PLAN]"
          role: dimension
        - id: current_plan
          name: Current Plan
          description: Current customer plan.
          formula: "[ACCOUNTS/CURRENT_PLAN]"
          role: dimension
        - id: plan_changed_date
          name: Plan Changed Date
          description: Date the account plan last changed.
          formula: "[ACCOUNTS/PLAN_CHANGED_DATE]"
          role: time
        - id: billing_period
          name: Billing Period
          description: Account billing cadence.
          formula: "[ACCOUNTS/BILLING_PERIOD]"
          role: dimension
        - id: contract_discount
          name: Contract Discount
          description: Discount applied to the account contract, represented as a ratio.
          formula: "[ACCOUNTS/CONTRACT_DISCOUNT]"
          format:
            kind: percent
            decimals: 1
          role: measure
        - id: starting_seats
          name: Starting Seats
          description: Number of seats at account start.
          formula: "[ACCOUNTS/STARTING_SEATS]"
          role: measure
        - id: status
          name: Status
          description: Current lifecycle status of the account.
          formula: "[ACCOUNTS/STATUS]"
          role: dimension
        - id: churn_reason
          name: Churn Reason
          description: Reason recorded for churn, when applicable.
          formula: "[ACCOUNTS/CHURN_REASON]"
          role: dimension
        - id: account_owner
          name: Account Owner
          description: Internal account owner.
          formula: "[ACCOUNTS/ACCOUNT_OWNER]"
          role: dimension
        - id: csm
          name: CSM
          description: Customer success manager assigned to the account.
          formula: "[ACCOUNTS/CSM]"
          role: dimension
      metrics:
        - id: row_count
          name: Account Count
          description: Number of customer account rows.
          formula: Count()
        - id: total_employee_count
          name: Total Employee Count
          description: Sum of employees represented across accounts.
          formula: Sum([Employee Count])
        - id: total_starting_seats
          name: Total Starting Seats
          description: Sum of seats at account start.
          formula: Sum([Starting Seats])
      relationships:
        - id: accounts_to_feature_adoption
          name: Feature Adoption
          targetElementId: feature_adoption
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
        - id: accounts_to_invoices
          name: Invoices
          targetElementId: invoices
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
    - id: feature_adoption
      name: Feature Adoption
      description: One row per account and feature, capturing adoption status and usage activity.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - FEATURE_ADOPTION
      columns:
        - id: account_id
          name: Account ID
          description: Customer account identifier associated with the feature record.
          formula: "[FEATURE_ADOPTION/ACCOUNT_ID]"
          role: identifier
        - id: feature
          name: Feature
          description: Product feature.
          formula: "[FEATURE_ADOPTION/FEATURE]"
          role: dimension
        - id: feature_category
          name: Feature Category
          description: Product feature category.
          formula: "[FEATURE_ADOPTION/FEATURE_CATEGORY]"
          role: dimension
        - id: min_plan
          name: Minimum Plan
          description: Minimum plan required for the feature.
          formula: "[FEATURE_ADOPTION/MIN_PLAN]"
          role: dimension
        - id: adopted
          name: Adopted
          description: Whether the account has adopted the feature.
          formula: "[FEATURE_ADOPTION/ADOPTED]"
          role: dimension
        - id: first_used_date
          name: First Used Date
          description: Date the account first used the feature.
          formula: "[FEATURE_ADOPTION/FIRST_USED_DATE]"
          role: time
        - id: last_used_date
          name: Last Used Date
          description: Most recent date the account used the feature.
          formula: "[FEATURE_ADOPTION/LAST_USED_DATE]"
          role: time
        - id: monthly_active_users
          name: Monthly Active Users
          description: Monthly active users for the account and feature.
          formula: "[FEATURE_ADOPTION/MONTHLY_ACTIVE_USERS]"
          role: measure
      metrics:
        - id: feature_record_count
          name: Feature Record Count
          description: Number of account-feature records.
          formula: Count()
        - id: adopted_feature_count
          name: Adopted Feature Count
          description: Number of account-feature records marked as adopted.
          formula: CountIf([Adopted] = true)
        - id: total_monthly_active_users
          name: Total Monthly Active Users
          description: Sum of monthly active users across account-feature records.
          formula: Sum([Monthly Active Users])
      visibleAsSource: true
    - id: invoices
      name: Invoices
      description: One row per invoice issued to a customer account, including charges, taxes, payment details, and status.
      kind: table
      source:
        kind: warehouse-table
        connectionId: default
        path:
          - MERIDIAN
          - SAAS
          - INVOICES
      columns:
        - id: invoice_id
          name: Invoice ID
          description: Unique invoice identifier.
          formula: "[INVOICES/INVOICE_ID]"
          role: identifier
        - id: account_id
          name: Account ID
          description: Customer account identifier billed by the invoice.
          formula: "[INVOICES/ACCOUNT_ID]"
          role: identifier
        - id: invoice_date
          name: Invoice Date
          description: Date the invoice was issued.
          formula: "[INVOICES/INVOICE_DATE]"
          role: time
        - id: due_date
          name: Due Date
          description: Date payment was due.
          formula: "[INVOICES/DUE_DATE]"
          role: time
        - id: plan_name
          name: Plan Name
          description: Plan billed on the invoice.
          formula: "[INVOICES/PLAN_NAME]"
          role: dimension
        - id: billing_period
          name: Billing Period
          description: Billing cadence represented by the invoice.
          formula: "[INVOICES/BILLING_PERIOD]"
          role: dimension
        - id: payment_method
          name: Payment Method
          description: Payment method used or recorded for the invoice.
          formula: "[INVOICES/PAYMENT_METHOD]"
          role: dimension
        - id: seats
          name: Seats
          description: Number of seats billed.
          formula: "[INVOICES/SEATS]"
          role: measure
        - id: amount
          name: Amount
          description: Invoice amount before tax.
          formula: "[INVOICES/AMOUNT]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: tax
          name: Tax
          description: Tax charged on the invoice.
          formula: "[INVOICES/TAX]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: total
          name: Total
          description: Total invoice amount including tax.
          formula: "[INVOICES/TOTAL]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: paid_date
          name: Paid Date
          description: Date the invoice was paid, when applicable.
          formula: "[INVOICES/PAID_DATE]"
          role: time
        - id: status
          name: Status
          description: Invoice payment status.
          formula: "[INVOICES/STATUS]"
          role: dimension
      metrics:
        - id: invoice_count
          name: Invoice Count
          description: Number of invoices.
          formula: Count()
        - id: total_seats
          name: Total Seats
          description: Sum of seats billed.
          formula: Sum([Seats])
        - id: total_amount
          name: Total Amount
          description: Sum of invoice amounts before tax.
          formula: Sum([Amount])
          format:
            kind: currency
            decimals: 2
        - id: total_tax
          name: Total Tax
          description: Sum of invoice tax.
          formula: Sum([Tax])
          format:
            kind: currency
            decimals: 2
        - id: total_billed
          name: Total Billed
          description: Sum of invoice totals including tax.
          formula: Sum([Total])
          format:
            kind: currency
            decimals: 2
      relationships:
        - id: invoices_to_accounts
          name: Account
          targetElementId: accounts
          keys:
            - sourceColumnId: account_id
              targetColumnId: account_id
          cardinality: many-to-one
      visibleAsSource: true
