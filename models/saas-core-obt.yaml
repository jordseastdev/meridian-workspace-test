dataModelId: saas-core-obt
name: SaaS Core Account OBT
description: One row per customer account with rolled-up feature adoption and invoice metrics.
tags:
  - obt
  - account-grain
contents:
  schemaVersion: 1
  kind: data-model
  elements:
    - id: account_obt
      name: Account OBT
      description: One row per customer account, combining account attributes with feature adoption and invoice rollups without double counting.
      kind: table
      source:
        kind: sql
        connectionId: default
        statement: |
          WITH feature_rollup AS (
            SELECT account_id, COUNT(*) AS feature_record_count,
              SUM(CASE WHEN adopted = TRUE THEN 1 ELSE 0 END) AS adopted_feature_count,
              SUM(monthly_active_users) AS total_monthly_active_users,
              COUNT(DISTINCT feature_category) AS feature_category_count,
              MAX(last_used_date) AS latest_feature_used_date
            FROM MERIDIAN.SAAS.FEATURE_ADOPTION
            GROUP BY account_id
          ),
          invoice_rollup AS (
            SELECT account_id, COUNT(*) AS invoice_count,
              SUM(seats) AS total_billed_seats, SUM(amount) AS total_amount,
              SUM(tax) AS total_tax, SUM(total) AS total_billed,
              SUM(CASE WHEN status = 'Paid' THEN 1 ELSE 0 END) AS paid_invoice_count,
              MAX(invoice_date) AS latest_invoice_date, MAX(paid_date) AS latest_paid_date
            FROM MERIDIAN.SAAS.INVOICES
            GROUP BY account_id
          )
          SELECT a.account_id, a.account_name, a.domain, a.industry, a.company_size,
            a.employee_count, a.region, a.acquisition_source, a.signup_date, a.converted_date,
            a.churned_date, a.starting_plan, a.current_plan, a.plan_changed_date, a.billing_period,
            a.contract_discount, a.starting_seats, a.status, a.churn_reason, a.account_owner, a.csm,
            COALESCE(f.feature_record_count, 0) AS feature_record_count,
            COALESCE(f.adopted_feature_count, 0) AS adopted_feature_count,
            COALESCE(f.total_monthly_active_users, 0) AS total_monthly_active_users,
            COALESCE(f.feature_category_count, 0) AS feature_category_count,
            f.latest_feature_used_date,
            COALESCE(i.invoice_count, 0) AS invoice_count,
            COALESCE(i.total_billed_seats, 0) AS total_billed_seats,
            COALESCE(i.total_amount, 0) AS total_amount,
            COALESCE(i.total_tax, 0) AS total_tax,
            COALESCE(i.total_billed, 0) AS total_billed,
            COALESCE(i.paid_invoice_count, 0) AS paid_invoice_count,
            i.latest_invoice_date, i.latest_paid_date
          FROM MERIDIAN.SAAS.ACCOUNTS a
          LEFT JOIN feature_rollup f ON a.account_id = f.account_id
          LEFT JOIN invoice_rollup i ON a.account_id = i.account_id
      columns:
        - id: account_id
          name: Account ID
          description: Unique customer account identifier.
          formula: "[ACCOUNT_OBT/ACCOUNT_ID]"
          role: identifier
        - id: account_name
          name: Account Name
          description: Customer account name.
          formula: "[ACCOUNT_OBT/ACCOUNT_NAME]"
          role: dimension
        - id: domain
          name: Domain
          description: Primary customer web domain.
          formula: "[ACCOUNT_OBT/DOMAIN]"
          role: dimension
        - id: industry
          name: Industry
          description: Customer industry classification.
          formula: "[ACCOUNT_OBT/INDUSTRY]"
          role: dimension
        - id: company_size
          name: Company Size
          description: Customer company-size segment.
          formula: "[ACCOUNT_OBT/COMPANY_SIZE]"
          role: dimension
        - id: employee_count
          name: Employee Count
          description: Number of employees at the customer company.
          formula: "[ACCOUNT_OBT/EMPLOYEE_COUNT]"
          role: measure
        - id: region
          name: Region
          description: Customer geographic region.
          formula: "[ACCOUNT_OBT/REGION]"
          role: dimension
        - id: acquisition_source
          name: Acquisition Source
          description: Source through which the account was acquired.
          formula: "[ACCOUNT_OBT/ACQUISITION_SOURCE]"
          role: dimension
        - id: signup_date
          name: Signup Date
          description: Date the account signed up.
          formula: "[ACCOUNT_OBT/SIGNUP_DATE]"
          role: time
        - id: converted_date
          name: Converted Date
          description: Date the account converted.
          formula: "[ACCOUNT_OBT/CONVERTED_DATE]"
          role: time
        - id: churned_date
          name: Churned Date
          description: Date the account churned.
          formula: "[ACCOUNT_OBT/CHURNED_DATE]"
          role: time
        - id: starting_plan
          name: Starting Plan
          description: Plan selected at account start.
          formula: "[ACCOUNT_OBT/STARTING_PLAN]"
          role: dimension
        - id: current_plan
          name: Current Plan
          description: Current customer plan.
          formula: "[ACCOUNT_OBT/CURRENT_PLAN]"
          role: dimension
        - id: plan_changed_date
          name: Plan Changed Date
          description: Date the account plan last changed.
          formula: "[ACCOUNT_OBT/PLAN_CHANGED_DATE]"
          role: time
        - id: billing_period
          name: Billing Period
          description: Account billing cadence.
          formula: "[ACCOUNT_OBT/BILLING_PERIOD]"
          role: dimension
        - id: contract_discount
          name: Contract Discount
          description: Contract discount ratio.
          formula: "[ACCOUNT_OBT/CONTRACT_DISCOUNT]"
          format:
            kind: percent
            decimals: 1
          role: measure
        - id: starting_seats
          name: Starting Seats
          description: Number of seats at account start.
          formula: "[ACCOUNT_OBT/STARTING_SEATS]"
          role: measure
        - id: status
          name: Status
          description: Current lifecycle status.
          formula: "[ACCOUNT_OBT/STATUS]"
          role: dimension
        - id: churn_reason
          name: Churn Reason
          description: Recorded reason for churn.
          formula: "[ACCOUNT_OBT/CHURN_REASON]"
          role: dimension
        - id: account_owner
          name: Account Owner
          description: Internal account owner.
          formula: "[ACCOUNT_OBT/ACCOUNT_OWNER]"
          role: dimension
        - id: csm
          name: CSM
          description: Customer success manager.
          formula: "[ACCOUNT_OBT/CSM]"
          role: dimension
        - id: feature_record_count
          name: Feature Record Count
          description: Number of feature records for the account.
          formula: "[ACCOUNT_OBT/FEATURE_RECORD_COUNT]"
          role: measure
        - id: adopted_feature_count
          name: Adopted Feature Count
          description: Number of adopted features for the account.
          formula: "[ACCOUNT_OBT/ADOPTED_FEATURE_COUNT]"
          role: measure
        - id: total_monthly_active_users
          name: Total Monthly Active Users
          description: Sum of monthly active users across feature records.
          formula: "[ACCOUNT_OBT/TOTAL_MONTHLY_ACTIVE_USERS]"
          role: measure
        - id: feature_category_count
          name: Feature Category Count
          description: Number of distinct feature categories for the account.
          formula: "[ACCOUNT_OBT/FEATURE_CATEGORY_COUNT]"
          role: measure
        - id: latest_feature_used_date
          name: Latest Feature Used Date
          description: Most recent feature usage date.
          formula: "[ACCOUNT_OBT/LATEST_FEATURE_USED_DATE]"
          role: time
        - id: invoice_count
          name: Invoice Count
          description: Number of invoices for the account.
          formula: "[ACCOUNT_OBT/INVOICE_COUNT]"
          role: measure
        - id: total_billed_seats
          name: Total Billed Seats
          description: Sum of seats billed across invoices.
          formula: "[ACCOUNT_OBT/TOTAL_BILLED_SEATS]"
          role: measure
        - id: total_amount
          name: Total Amount
          description: Sum of invoice amounts before tax.
          formula: "[ACCOUNT_OBT/TOTAL_AMOUNT]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: total_tax
          name: Total Tax
          description: Sum of invoice tax.
          formula: "[ACCOUNT_OBT/TOTAL_TAX]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: total_billed
          name: Total Billed
          description: Sum of invoice totals including tax.
          formula: "[ACCOUNT_OBT/TOTAL_BILLED]"
          format:
            kind: currency
            decimals: 2
          role: measure
        - id: paid_invoice_count
          name: Paid Invoice Count
          description: Number of paid invoices.
          formula: "[ACCOUNT_OBT/PAID_INVOICE_COUNT]"
          role: measure
        - id: latest_invoice_date
          name: Latest Invoice Date
          description: Most recent invoice date.
          formula: "[ACCOUNT_OBT/LATEST_INVOICE_DATE]"
          role: time
        - id: latest_paid_date
          name: Latest Paid Date
          description: Most recent paid date.
          formula: "[ACCOUNT_OBT/LATEST_PAID_DATE]"
          role: time
      metrics:
        - id: account_count
          name: Account Count
          description: Number of customer accounts.
          formula: Count()
        - id: total_employees
          name: Total Employees
          description: Sum of employees across accounts.
          formula: Sum([Employee Count])
        - id: total_adopted_features
          name: Total Adopted Features
          description: Sum of adopted features across accounts.
          formula: Sum([Adopted Feature Count])
        - id: total_billed_metric
          name: Total Billed Revenue
          description: Sum of invoice totals including tax.
          formula: Sum([Total Billed])
          format:
            kind: currency
            decimals: 2
        - id: average_adoption_rate
          name: Average Feature Adoption Rate
          description: Ratio of adopted feature records to feature records.
          formula: SafeDivide(Sum([Adopted Feature Count]), Sum([Feature Record Count]))
          format:
            kind: percent
            decimals: 1
        - id: average_revenue_per_account
          name: Average Billed per Account
          description: Average billed amount per account.
          formula: SafeDivide(Sum([Total Billed]), Count())
          format:
            kind: currency
            decimals: 2
      visibleAsSource: true
